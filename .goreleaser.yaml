# GoReleaser config. A vX.Y.Z tag runs it in .github/workflows/release.yml, which also builds and pushes the images
# (deploy/docker/Dockerfile). CI runs it as a snapshot with --skip=sign.
version: 2

project_name: pihole-rbac

before:
  hooks:
    - npm --prefix web ci
    - npm --prefix web run build
    # THIRD_PARTY_NOTICES.txt into web/build/app, so every binary embeds and serves it.
    - bash deploy/notices/notices.sh

builds:
  - id: pihole-rbac
    main: ./cmd/pihole-rbac
    binary: pihole-rbac
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/Kate-0713/pihole-rbac/internal/buildinfo.Version={{ .Version }}
      - -X github.com/Kate-0713/pihole-rbac/internal/buildinfo.Commit={{ .ShortCommit }}
      - -X github.com/Kate-0713/pihole-rbac/internal/buildinfo.Date={{ .Date }}
    hooks:
      post:
        # Refuse to release a binary without the UI, or one built with the updatertest tag (which takes releases
        # from a test server). Only the native-arch binary can run on the build host, so check that one.
        - cmd: >-
            sh -c 'if [ "{{ .Arch }}" = "{{ .Runtime.Goarch }}" ]; then out="$("{{ .Path }}" version)" &&
            printf "%s\n" "$out" | grep -qx "frontend: embedded" && ! printf "%s\n" "$out" | grep -q "TEST BUILD"; fi'

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # The licence must travel with every binary; listed explicitly because GoReleaser's defaults look for LICENSE*, not LICENCE*.
    files:
      - LICENCE.md
      - README.md
      # The LXC install script takes the unit and env template from the verified archive, not from the network.
      - deploy/lxc/pihole-rbac.service
      - deploy/lxc/pihole-rbac-update.path
      - deploy/lxc/pihole-rbac-update.service
      - deploy/lxc/env.example
      - src: web/build/app/THIRD_PARTY_NOTICES.txt
        dst: THIRD_PARTY_NOTICES.txt

checksum:
  name_template: checksums.txt

# checksums.txt is signed with minisign; install.sh (and later the updater) verify it with the public key in
# minisign.pub, then each archive against its checksum. The trusted comment names the tag, and install.sh checks it,
# so a signature can't be passed off as another release's. The key file and its password come from repository
# secrets, written to a file by the release workflow.
signs:
  - id: minisign
    cmd: minisign
    artifacts: checksum
    signature: "${artifact}.minisig"
    stdin: "{{ .Env.MINISIGN_PASSWORD }}\n"
    args:
      - -S
      - -s
      - "{{ .Env.MINISIGN_KEY_FILE }}"
      - -t
      - "pihole-rbac {{ .Tag }}"
      - -m
      - "${artifact}"
      - -x
      - "${signature}"

release:
  prerelease: auto
  # Beside the archives: the install script, which holds the same public key, and the key itself.
  extra_files:
    - glob: deploy/lxc/install.sh
    - glob: minisign.pub

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot+{{ .ShortCommit }}"

changelog:
  sort: asc
