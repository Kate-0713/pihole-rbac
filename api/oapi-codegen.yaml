# oapi-codegen config: Go types, net/http routing and the strict server interface for api/openapi.yaml.
# Run from the repo root: make generate / .\build.ps1 generate
package: gen
generate:
  std-http-server: true
  strict-server: true
  models: true
output: internal/api/gen/api.gen.go
