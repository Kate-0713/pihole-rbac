        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/TargetUnavailable"
        "502":
          $ref: "#/components/responses/TargetPiholeFailed"
        "503":
          $ref: "#/components/responses/SetupRequired"
    delete:
      summary: Delete a lease
      description: >-
        Deletes the lease for `ip`: the device asks for an address again, and this doesn't block it. Not a config write,
        so nothing restarts. Instance targets only: a mirrored group target is a 400, since DHCP isn't mirrored. A lease
        Pi-hole doesn't have is a 404 (not_found), a Pi-hole whose DHCP is off a 409 (pihole_dhcp_off) and one that is
        busy a 409 (pihole_busy), which can be repeated. Audited as dhcp_lease_delete. Since v2.7.0.
      operationId: deleteDHCPLease
      x-permission: target:dhcp.edit
