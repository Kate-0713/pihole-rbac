        app refers to (client reset rules, protected groups, group windows) also needs `confirm=true`; once Pi-hole
        has renamed it, the app updates those references where the old name is gone, and `references` says what
        changed and what to check. Through a mirrored group, a member without the group fails with not_found. Answers
        with a result per instance (see WriteResults under the schemas). Audited as piholegroup_enable or
