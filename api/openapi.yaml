        Pi-hole only lets the app's password change config while webserver.api.app_sudo is on. Through a mirrored
        group (which DHCP doesn't mirror) every enabled member is read and answered separately, the primary first;
        `members` says how each answered, and a request fails only when none did. Reading isn't audited. Since v2.7.0.
