          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/TargetPiholeFailed"
        "503":
          $ref: "#/components/responses/SetupRequired"
  /api/v1/targets/{target}/schedules/status:
    parameters:
      - $ref: "#/components/parameters/TargetID"
    get:
      summary: What the target's schedules are doing
      description: >-
        For the dashboard and the blocking menu: the windows open now and the next edge of each enabled schedule that
        reaches the target (set on it, or, for an instance, on its mirrored group), by name, kind, group and time only.
        A schedule with no window open and no edge to come (a one-off past its end) is left out.
        Any permission on the target. Since v2.5.0.
      operationId: getScheduleStatus
      x-permission: target:any
      responses:
        "200":
          description: The schedules' state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleStatus"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/SetupRequired"
  /api/v1/targets/{target}/schedules/{id}:
    parameters:
      - $ref: "#/components/parameters/TargetID"
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      summary: A schedule
      description: One of the target's schedules. 404 for one set on another target. Since v2.5.0.
      operationId: getSchedule
      x-permission: target:schedules.manage
      responses:
        "200":
          description: The schedule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/SetupRequired"
    patch:
      summary: Change a schedule
      description: >-
        Changes the fields given; the rest keep their value, and the result is checked as a whole, as when adding one.
        Needs the underlying permission (blocking.toggle or piholegroups.edit) as it is now. A finished one-off
        schedule is 409 conflict: it can only be deleted. The schedule acts from its next edge after the change, and
        its results start again; a blocking window already open keeps Pi-hole's timer. Audited as schedule_update.
        Since v2.5.0.
      operationId: updateSchedule
      x-permission: target:schedules.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleUpdate"
      responses:
        "200":
          description: The saved schedule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/TargetPiholeFailed"
        "503":
          $ref: "#/components/responses/SetupRequired"
    delete:
      summary: Delete a schedule
      description: >-
        Deletes the schedule. Needs schedules.manage alone, so a schedule can always be stopped. Nothing is sent to
        Pi-hole: a blocking window's timer runs on, and a group stays as it is. Audited as schedule_delete. Since v2.5.0.
      operationId: deleteSchedule
      x-permission: target:schedules.manage
      responses:
        "204":
          description: Deleted.
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/SetupRequired"

components:
  parameters:
    GravityAfter:
      name: after
      in: query
      description: Only output lines with a higher `seq`; the newest 200 of them. 0 or absent for the newest 200 of all.
      schema:
        type: integer
        minimum: 0
    RunLimit:
      name: limit
      in: query
      required: false
      description: How many runs to return, 1 to 200.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50

    RunCursor:
      name: cursor
      in: query
      required: false
      description: The `next_cursor` of the previous page.
      schema:
        type: string
        maxLength: 128

    AuditUser:
      name: user
      in: query
      required: false
      description: Only entries by this username (exact). Names are copied into each entry, so deleted users still match.
      schema:
        type: string
        maxLength: 256
    AuditAction:
      name: action
      in: query
      required: false
      description: Only entries with one of these actions. Repeat for several.
      schema:
        type: array
        maxItems: 50
        items:
          type: string
          pattern: "^[a-z][a-z_]{0,63}$"
    AuditTarget:
      name: target
      in: query
      required: false
      description: Only entries with this target (exact), such as `i-1`, `g-2`, `user:alice` or `settings:general`.
      schema:
        type: string
        maxLength: 512
    AuditInstance:
      name: instance_id
      in: query
      required: false
      description: Only entries about this Pi-hole instance.
      schema:
        type: integer
        format: int64
        minimum: 1
    AuditResult:
      name: result
      in: query
      required: false
      description: Only successes or only failures.
      schema:
        type: string
        enum: [success, failure]
    AuditFrom:
      name: from
      in: query
      required: false
      description: Only entries at or after this time.
      schema:
        type: string
        format: date-time
    AuditTo:
      name: to
      in: query
      required: false
      description: Only entries before this time. Must be after `from` when both are given.
      schema:
        type: string
        format: date-time

    ChannelID:
      name: id
      in: path
      required: true
      description: The notification channel's ID.
      schema:
        type: integer
        format: int64
        minimum: 1

    InstanceID:
      name: id
      in: path
      required: true
      description: The instance's ID.
      schema:
        type: integer
        format: int64
        minimum: 1

    GroupID:
      name: id
      in: path
      required: true
      description: The instance group's ID.
      schema:
        type: integer
        format: int64
        minimum: 1

    TemporaryChangeID:
      name: id
      in: path
      required: true
      description: The temporary client change's ID. 404 for one made on another target.
      schema:
        type: integer
        format: int64
        minimum: 1

    Members:
      name: members
      in: query
      required: false
      description: >-
        Only for a mirrored group: send the write to these members alone (instance IDs, each an enabled member of the
        group), to retry the members that failed last time. The results list only them, and the write is still made
        through the group: it is audited with the group as its target, and the group's rules apply (the primary's
        Pi-hole group IDs, and the check that the primary has the entry). A 400 for an instance target, or for an ID that
        isn't an enabled member.
      schema:
        type: array
        minItems: 1
        maxItems: 100
        items:
          type: integer
          format: int64
          minimum: 1

    RoleID:
      name: id
      in: path
      required: true
      description: The role's ID.
      schema:
        type: integer
        format: int64
        minimum: 1

    Confirm:
      name: confirm
      in: query
      required: false
      description: >-
        Go ahead with a change that answered 409 confirmation_required: one that would take away the caller's own
        roles.manage or users.manage, or disable or delete their own account; or a Pi-hole group change that renames
        or deletes a group the app refers to, or disables the Default group; a local DNS name under a directory domain; or a DHCP settings change that turns DHCP on or off or changes its address range, router, netmask or unknown-client rule.
      schema:
        type: boolean
        default: false

    UserID:
      name: id
      in: path
      required: true
      description: The user's ID.
      schema:
        type: integer
        format: int64
        minimum: 1

    MappingID:
      name: mapping_id
      in: path
      required: true
      description: The LDAP group mapping's ID.
      schema:
        type: integer
        format: int64
        minimum: 1

    TargetID:
      name: target
      in: path
      required: true
      description: >-
        `i-<instance id>` for one instance, or `g-<group id>` for a mirrored group, which reads its domains, clients
        and Pi-hole groups from its primary, reads its dashboard and query log from every enabled member, and sends
        writes to every enabled member. A target that doesn't exist, including an independent group, is a 403 like
        one the user holds nothing on; a disabled instance, or a mirrored group whose primary is disabled, is a 404.
      schema:
        type: string
        pattern: "^[ig]-[1-9][0-9]*$"
        examples: ["i-1"]

  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: pihole_rbac_session

  responses:
    Unauthenticated:
      description: No valid session (code unauthenticated).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: >-
        Not allowed (code forbidden, with `details.permission` naming the missing permission), or the CSRF or Origin
        check failed on a state-changing request (code csrf_failed).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationFailed:
      description: The request body is malformed or a field is invalid (code validation_failed).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnsupportedMediaType:
      description: The request body isn't application/json (code unsupported_media_type).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SetupRequired:
      description: First-run setup hasn't been completed yet (code setup_required).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No such resource (code not_found).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The change conflicts with existing data (code conflict); the message says how.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InstanceConflict:
      description: >-
        The change conflicts with existing data or with a change made at the same time (code conflict), or the
        connection test couldn't run: the password variable isn't set (code instance_password_missing) or the settings
        can't be used (code instance_misconfigured). `details.instance` names the instance for the last two.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InstanceGroupConflict:
      description: >-
        The change conflicts with existing data (code conflict): the name is taken, or an instance is already in
        another mirrored group (`details.field` members, `details.instance` and `details.group` name them); or a
        mirrored group would become independent while roles hold mirrored-group permissions on it (code
        invariant_violated, with `details.roles`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RoleConflict:
      description: >-
        The change conflicts with existing data, such as a name already taken (code conflict); it would break an
        invariant, such as changing the builtin admin role or deleting a role in use (code invariant_violated); or it
        would take away the caller's own roles.manage or users.manage and needs `confirm=true` (code
        confirmation_required, with `details.would_lose`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UserConflict:
      description: >-
        The change conflicts with existing data, such as a username already taken (code conflict); it would leave no
        enabled local admin (code invariant_violated); or it would disable or delete the caller's own account, or take
        away their own roles.manage or users.manage, and needs `confirm=true` (code confirmation_required, with
        `details.would_lose`: "account", or the permissions).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    LDAPFailed:
      description: >-
        The LDAP server couldn't be used (code ldap_failed): it didn't answer, refused the service account's bind, or a
        search failed. Nothing was saved. `details.detail` has the underlying error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PiholeFailed:
      description: >-
        The connection test failed (code pihole_unreachable, pihole_auth_rejected or pihole_status_error), so nothing
        was changed. `details.instance` names the instance and `details.detail` has the underlying error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidOrRejected:
      description: >-
        A field is invalid (code validation_failed), or the Pi-hole refused the request's content (code
        pihole_rejected): a duplicate entry, say, or a domain it doesn't accept. For pihole_rejected,
        `details.instance` names the instance and `details.pihole_message` has Pi-hole's reason, which is Pi-hole's
        text: show it as text. On a write, a pihole_rejected answer means no instance succeeded, and `details.results`
        has the result per instance, in the shape of the 200 response's `results`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TargetUnavailable:
      description: >-
        The instance can't be used: its password variable isn't set (code instance_password_missing) or its settings
        can't be used (code instance_misconfigured). `details.instance` names it. Through a mirrored group, also a
        member without a Pi-hole group the change uses (code pihole_group_missing). On a write, this answer means no instance
        succeeded, and `details.results` has the result per instance, in the shape of the 200 response's `results`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    LocalDNSConflict:
      description: >-
        The name is, or falls under, a directory domain and needs `confirm=true` (code confirmation_required, with
        `details.domain` and `details.field`); or the instance already has the record (code conflict); or the
        instance can't be used or won't let the app change its config: code instance_password_missing,
        instance_misconfigured, pihole_app_sudo_off (webserver.api.app_sudo is off) or pihole_config_locked (the
        records are set by an environment variable, or the config is read-only). On a write, a Pi-hole failure here
        means no instance succeeded, and `details.results` has the result per instance.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    DHCPConflict:
      description: >-
        A change that needs `confirm=true` (code confirmation_required, with `details.summary` and, for turning DHCP
        on, `details.other_active`); a static lease that shares its MAC or address with another (code conflict, with
        `details.field`); a lease that can't be deleted while DHCP is off (code pihole_dhcp_off) or while Pi-hole is
        busy (code pihole_busy: repeat it); or an instance that can't be used or won't let the app change its config
        (instance_password_missing, instance_misconfigured, pihole_app_sudo_off, pihole_config_locked). On a write, a
        Pi-hole failure here means it failed, and `details.results` has the result.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TargetPiholeFailed:
      description: >-
        The Pi-hole didn't respond (code pihole_unreachable), refused the app password (code pihole_auth_rejected)
        or answered unexpectedly (code pihole_status_error). `details.instance` names the instance. When it is a
        mirrored group's primary, `details.group` names the group and `details.primary` is true: reads of domains,
        clients and Pi-hole groups come from the primary alone. The underlying error goes to the server log only. On a write, this answer means no instance
        succeeded, and `details.results` has the result per instance, in the shape of the 200 response's `results`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PiholeGroupConflict:
      description: >-
        The change needs `confirm=true` (code confirmation_required): `details.default_group` is true when it would
        disable the Default group, and `details.references` (a PiholeGroupReferences) lists the app's references to a
        group being renamed or deleted. Or an instance can't be used, as for TargetUnavailable: code
        instance_password_missing, instance_misconfigured or pihole_group_missing, with `details.results` on a write.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ClientResetConflict:
      description: >-
        The target has no client reset rules, or (for a run) another client reset is running (code conflict); the
        message says which.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TOTPInvalid:
      description: >-
        The code is wrong, was used before or has expired (code totp_invalid); where the request carries a password,
        the password is wrong (code invalid_credentials); or there is no valid session (code unauthenticated).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Too many failed attempts (code rate_limited). Retry after the given number of seconds.
      headers:
        Retry-After:
          description: Seconds until another attempt is allowed.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    About:
      type: object
      additionalProperties: false
      required: [source_url, license]
      properties:
        source_url:
          type: string
          format: uri
          description: Where the source code of the running build can be obtained.
          examples: ["https://github.com/Kate-0713/pihole-rbac"]
        license:
          type: string
          description: SPDX licence identifier.
          examples: ["AGPL-3.0-or-later"]

    SetupStatus:
      type: object
      additionalProperties: false
      required: [setup_required]
      properties:
        setup_required:
          type: boolean
          description: True until the first admin has been created.

    SetupRequest:
      type: object
      additionalProperties: false
      required: [token, username, password]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 256
          description: The one-time setup token. Surrounding spaces are ignored.
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: >-
            The first admin's username: 1-64 lowercase letters, digits, '.', '_' or '-', starting with a letter or
            digit. Uppercase is folded to lowercase.
        password:
          type: string
          minLength: 12
          maxLength: 72
          description: At least 12 characters and at most 72 bytes.

    CSRFToken:
      type: object
      additionalProperties: false
      required: [csrf_token]
      properties:
        csrf_token:
          type: string
          description: Send as the X-CSRF-Token header on every state-changing request.

    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 256
          description: Case-insensitive; surrounding spaces are ignored.
        password:
          type: string
          minLength: 1
          maxLength: 1024

    SessionUser:
      type: object
      additionalProperties: false
      required: [id, username, source]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        source:
          type: string
          enum: [local, ldap]

    CurrentSession:
      type: object
      additionalProperties: false
      required: [user, public_id, expires_at, csrf_token, permissions]
      properties:
        user:
          $ref: "#/components/schemas/SessionUser"
        public_id:
          type: string
          description: Identifies this session in the sessions list and the audit log. Can't be used to authenticate.
        expires_at:
          type: string
          format: date-time
          description: When the session ends at the latest. It also ends after a period without requests.
        csrf_token:
          type: string
          description: Send as the X-CSRF-Token header on every state-changing request.
        permissions:
          $ref: "#/components/schemas/Permissions"

    Permissions:
      type: object
      additionalProperties: false
      required: [global, targets]
      description: >-
        What the user may do, worked out by the server from their roles and the current groups. The server checks
        every request again; this is for the UI.
      properties:
        global:
          type: array
          items:
            type: string
          description: The global permissions the user holds, sorted.
        targets:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: >-
            By target (`i-<instance id>` or `g-<mirrored group id>`): the permissions the user holds there, sorted.
            Lists every instance and mirrored group where the user holds at least one.
          examples:
            - { "i-1": ["domains.view"], "g-2": ["domains.view", "drift.view"] }

    SecretList:
      type: object
      additionalProperties: false
      required: [secrets]
      properties:
        secrets:
          type: array
          items:
            $ref: "#/components/schemas/SecretStatus"

    SecretStatus:
      type: object
      additionalProperties: false
      required: [name, kind, set]
      properties:
        name:
          type: string
          description: The environment variable, without a _FILE suffix.
        kind:
          type: string
          enum: [master_key, session_key, ldap_bind_password, instance_password, channel_secret]
        set:
          type: boolean
        source:
          type: string
          enum: [env, file, generated]
          description: Where the value came from. Absent when the secret isn't set. Only `file` can change on a reload.

    ReloadResult:
      type: object
      additionalProperties: false
      required: [changed, failed, session_ended]
      properties:
        changed:
          type: array
          items:
            type: string
          description: Variables whose value changed.
        failed:
          type: array
          items:
            $ref: "#/components/schemas/ReloadFailure"
        session_ended:
          type: boolean
          description: True when the session key changed, which ends every session including the caller's.

    ReloadFailure:
      type: object
      additionalProperties: false
      required: [name, message]
      properties:
        name:
          type: string
        message:
          type: string
          description: Why the secret couldn't be loaded. Never contains the value.

    VersionInfo:
      type: object
      additionalProperties: false
      required: [version, commit, build_date, development]
      properties:
        version:
          type: string
          description: As built, without a leading v for a release ("2.1.0"); "dev" or a git-describe string otherwise.
        commit:
          type: string
        build_date:
          type: string
          description: As built (RFC 3339 for releases), or "unknown".
        development:
          type: boolean
          description: The version can't be compared with releases (a development, snapshot or git-describe build).
        latest:
          $ref: "#/components/schemas/LatestRelease"
        update_available:
          type: boolean
          description: >-
            The latest release is newer than the running version. Present only with `latest`; always false for a
            development build.

    UpdateStatus:
      type: object
      additionalProperties: false
      required: [current_version, development, install, check_enabled, update_available, can_request, requests]
      properties:
        current_version:
          type: string
          description: The running version as built (see VersionInfo).
        development:
          type: boolean
          description: The running version can't be compared with releases, so no update is ever reported available.
        install:
          type: string
          enum: [lxc, docker, other]
          description: >-
            From PIHOLE_RBAC_INSTALL. lxc can request updates here; docker is updated with docker compose pull and
            up -d; other is updated however it was installed.
        check_enabled:
          type: boolean
          description: False when PIHOLE_RBAC_UPDATE_CHECK is false.
        checked_at:
          type: string
          format: date-time
          description: When GitHub was last asked. Absent if never.
        check_error:
          type: string
          description: Why the last check failed. The release found before it, if any, is still given.
        latest:
          $ref: "#/components/schemas/LatestRelease"
        update_available:
          type: boolean
          description: The latest release is newer than the running version.
        can_request:
          type: boolean
          description: An update can be requested now (an LXC install, a release build, nothing pending or running).
        requests:
          type: array
          description: The latest update requests, newest first (at most 10).
          items:
            $ref: "#/components/schemas/UpdateRequest"

    LatestRelease:
      type: object
      additionalProperties: false
      description: The newest published release that isn't a prerelease. Absent until one is found.
      required: [version, url]
      properties:
        version:
          type: string
          description: The tag, such as v2.1.0.
        published_at:
          type: string
          format: date-time
        url:
          type: string
          description: The release's page on GitHub, with its changelog.

    UpdateRequest:
      type: object
      additionalProperties: false
      required: [id, requested_at, requested_by, status, log]
      properties:
        id:
          type: integer
          format: int64
        requested_at:
          type: string
          format: date-time
        requested_by:
          type: string
          description: The user who asked, or (cli) for sudo pihole-rbac update. Kept when the user is deleted.
        target_version:
          type: string
          description: The version asked for. Absent for the latest release.
        status:
          type: string
          enum: [pending, running, done, failed, rolled_back]
          description: >-
            pending until the updater takes it; failed when it stopped before replacing anything; rolled_back when
            the new version didn't become healthy and the previous one was restored. A request not taken within 10
            minutes, or not finished within an hour, is marked failed.
        log:
          type: string
          description: The updater's progress, one line per step.
        finished_at:
          type: string
          format: date-time

    UpdateRequestInput:
      type: object
      additionalProperties: false
      properties:
        target_version:
          type: string
          maxLength: 64
          description: >-
            A release tag newer than the running version, such as v2.1.0, or a prerelease such as v2.1.0-rc.1.
            Absent or empty for the latest release.

    TargetList:
      type: object
      additionalProperties: false
      required: [targets]
      properties:
        targets:
          type: array
          items:
            $ref: "#/components/schemas/Target"

    Target:
      type: object
      additionalProperties: false
      required: [id, kind, name]
      properties:
        id:
          type: string
          description: The target as used in URLs and the session's permissions, `i-<instance id>` or `g-<group id>`.
          examples: ["i-1"]
        kind:
          type: string
          enum: [instance, group]
        name:
          type: string
        health:
          $ref: "#/components/schemas/TargetHealth"
        members:
          type: array
          description: >-
            For a mirrored group: its enabled members, the primary first, then by name. Absent for an instance.
          items:
            $ref: "#/components/schemas/TargetMember"
        mirrored_group:
          $ref: "#/components/schemas/MirroredGroupRef"
        drifted:
          type: boolean
          description: >-
            For a mirrored group: whether its members differed from the primary at the last drift check. Absent until
            a check has compared them (see GET /instance-groups/{id}/drift).

    TargetHealth:
      type: object
      additionalProperties: false
      required: [state]
      description: >-
        An instance's health (see InstanceHealth), or a mirrored group's overall state, worked out from its enabled
        members: up when all are up, down when all are down, unknown when none has been checked yet, and degraded
        otherwise. A group's health has no times or error; its members carry their own.
      properties:
        state:
          type: string
          enum: [unknown, up, down, degraded]
        last_success:
          type: string
          format: date-time
        last_failure:
          type: string
          format: date-time
        last_error:
          type: string

    TargetMember:
      type: object
      additionalProperties: false
      required: [instance_id, name, primary, health]
      properties:
        instance_id:
          type: integer
          format: int64
        name:
          type: string
        primary:
          type: boolean
        health:
          $ref: "#/components/schemas/InstanceHealth"

    MirroredGroupRef:
      type: object
      additionalProperties: false
      required: [id, name]
      description: >-
        The mirrored group an instance belongs to. Editing the instance on its own makes it differ from the group;
        such edits are allowed to anyone whose grants cover the instance, and are flagged in the audit log.
      properties:
        id:
          type: string
          description: The group's target, `g-<group id>`.
          examples: ["g-1"]
        name:
          type: string

    MemberRead:
      type: object
      additionalProperties: false
      required: [instance, instance_id, primary, status]
      description: How one member of a mirrored group answered a read made through the group.
      properties:
        instance:
          type: string
        instance_id:
          type: integer
          format: int64
        primary:
          type: boolean
        status:
          $ref: "#/components/schemas/WriteStatus"
        error:
          $ref: "#/components/schemas/WriteError"
        blocking:
          $ref: "#/components/schemas/BlockingStatus"

    InstanceInput:
      type: object
      additionalProperties: false
      required: [name, base_url]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: Unique, ignoring case. Surrounding spaces are ignored.
        base_url:
          type: string
          maxLength: 2048
          description: >-
            http:// or https:// with a host and optional port; no username, password, query or fragment. A path prefix
            is allowed, but not one ending in /admin or /api. Stored without a trailing slash.
          examples: ["https://pihole1.lan"]
        env_name:
          type: string
          maxLength: 64
          pattern: "^[A-Z0-9_]*$"
          description: >-
            Optional. Names a variable, PIHOLE_RBAC_INSTANCE_<env_name>_PASSWORD, whose password overrides the stored
            one when it is set. Unique. Empty or absent means none.
          examples: ["PIHOLE1"]
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 1024
          description: >-
            The Pi-hole app password, used exactly as given. Stored encrypted (it needs the master key), or, when the
            instance's variable is set, checked against it. Required to confirm a new address or a newly used
            variable. Never returned.
        tls_mode:
          type: string
          enum: [verify, insecure]
          description: How the Pi-hole's certificate is checked. verify if absent; insecure is for labs only.
        ca_file:
          type: string
          maxLength: 4096
          description: >-
            Absolute path, on the server, of an extra CA bundle (PEM) to trust. Only with tls_mode verify and an
            https:// base URL. Checked when saved.

    Instance:
      type: object
      additionalProperties: false
      required: [id, name, base_url, tls_mode, enabled, created_at, password_source, password_set]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        base_url:
          type: string
        env_name:
          type: string
          description: Absent when the instance has none.
        tls_mode:
          type: string
          enum: [verify, insecure]
        ca_file:
          type: string
          description: Absent when no CA file is set.
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        password_variable:
          type: string
          description: >-
            The variable whose password overrides the stored one (or its _FILE form). Absent when the instance has no
            env name.
          examples: ["PIHOLE_RBAC_INSTANCE_PIHOLE1_PASSWORD"]
        password_source:
          type: string
          enum: [environment, stored, none]
          description: >-
            Where the password comes from: the variable (set when the server started or last reloaded its secrets),
            the database, or nowhere yet.
        password_set:
          type: boolean
          description: Whether the instance has a password, from either source.
        password_updated_at:
          type: string
          format: date-time
          description: When the stored password was last set. Absent when none is stored.
        password_updated_by:
          type: string
          description: Who last set the stored password. Absent when none is stored.
        health:
          $ref: "#/components/schemas/InstanceHealth"

    InstanceList:
      type: object
      additionalProperties: false
      required: [instances, can_store_passwords]
      properties:
        can_store_passwords:
          type: boolean
          description: Whether a master key is set, without which passwords can't be stored.
        instances:
          type: array
          items:
            $ref: "#/components/schemas/Instance"

    InstancePassword:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 1024
          description: The new Pi-hole app password, used exactly as given.

    InstanceHealth:
      type: object
      additionalProperties: false
      required: [state]
      description: Present only for enabled instances.
      properties:
        state:
          type: string
          enum: [unknown, up, down]
          description: >-
            unknown until the first call; up when Pi-hole last answered with the password accepted; down when it was
            unreachable or refused the password, or the password or settings can't be used.
        last_success:
          type: string
          format: date-time
        last_failure:
          type: string
          format: date-time
        last_error:
          type: string
          description: The error code of the last failure, kept after a later success.

    InstanceTestResult:
      type: object
      additionalProperties: false
      required: [ok]
      properties:
        ok:
          type: boolean
        app_sudo:
          type: boolean
          description: >-
            When ok, whether the Pi-hole's webserver.api.app_sudo is on, which the app needs to change local DNS
            (since v2.4.0). Absent if it couldn't be read.
        error:
          $ref: "#/components/schemas/InstanceTestError"

    InstanceTestError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum: [pihole_unreachable, pihole_auth_rejected, pihole_status_error, instance_password_missing, instance_misconfigured]
        message:
          type: string
          description: What went wrong, for the admin.
        detail:
          type: string
          description: The underlying error, such as a TLS or connection error. Never contains the password.

    InstanceGroupInput:
      type: object
      additionalProperties: false
      required: [name, mode, members]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: Unique, ignoring case.
        mode:
          type: string
          enum: [independent, mirrored]
        members:
          type: array
          maxItems: 100
          uniqueItems: true
          items:
            type: integer
            format: int64
            minimum: 1
          description: The member instances' IDs. A mirrored group needs at least its primary.
        primary_instance_id:
          type: integer
          format: int64
          minimum: 1
          description: >-
            Required for a mirrored group, and must be one of its members: the reference for reads and drift checks.
            Must be absent for an independent group.

    InstanceGroup:
      type: object
      additionalProperties: false
      required: [id, name, mode, members, created_at]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        mode:
          type: string
          enum: [independent, mirrored]
        primary_instance_id:
          type: integer
          format: int64
          description: The primary, for a mirrored group. Absent for an independent group.
        members:
          type: array
          description: By name.
          items:
            $ref: "#/components/schemas/InstanceGroupMember"
        created_at:
          type: string
          format: date-time

    InstanceGroupMember:
      type: object
      additionalProperties: false
      required: [id, name, enabled]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        enabled:
          type: boolean
          description: A disabled member is left out of everything done through a mirrored group.

    InstanceGroupList:
      type: object
      additionalProperties: false
      required: [groups]
      properties:
        groups:
          type: array
          items:
            $ref: "#/components/schemas/InstanceGroup"

    DriftReport:
      type: object
      additionalProperties: false
      required: [group_id, group, state, drifted, members, counts]
      properties:
        group_id:
          type: integer
          format: int64
        group:
          type: string
          description: The group's name.
        state:
          type: string
          enum: [not_checked, checked, primary_unavailable]
          description: >-
            not_checked: no check since the server started. checked: the primary answered, so the members that answered
            were compared with it. primary_unavailable: the primary didn't answer or is disabled, so nothing could be
            compared.
        checked_at:
          type: string
          format: date-time
          description: When the check ran. Absent when not_checked.
        drifted:
          type: boolean
          description: Whether any member was found to differ from the primary, in any of the five kinds of item.
        members:
          type: array
          description: The enabled members as of the check, the primary first. Empty when not_checked.
          items:
            $ref: "#/components/schemas/MemberRead"
        counts:
          $ref: "#/components/schemas/DriftCounts"
        domains:
          type: array
          description: Absent without domains.view on the group.
          items:
            $ref: "#/components/schemas/DomainDrift"
        clients:
          type: array
          description: Absent without clients.view on the group.
          items:
            $ref: "#/components/schemas/ClientDrift"
        groups:
          type: array
          items:
            $ref: "#/components/schemas/PiholeGroupDrift"
        lists:
          type: array
          description: Absent without lists.view on the group. Since v2.3.0.
          items:
            $ref: "#/components/schemas/PiholeListDrift"
        local_dns:
          type: array
          description: Absent without localdns.view on the group. Since v2.4.0.
          items:
            $ref: "#/components/schemas/LocalDNSDrift"

    DriftCounts:
      type: object
      additionalProperties: false
      required: [domains, clients, groups, lists, local_dns]
      properties:
        domains:
          type: integer
        clients:
          type: integer
        groups:
          type: integer
        lists:
          type: integer
        local_dns:
          type: integer

    DriftDifference:
      type: string
      enum: [missing, extra, changed]
      description: >-
        missing: on the primary but not on this member. extra: on this member but not on the primary. changed: on
        both, with different settings.

    DomainDrift:
      type: object
      additionalProperties: false
      required: [instance, instance_id, domain, type, kind, difference]
      properties:
        instance:
          type: string
        instance_id:
          type: integer
          format: int64
        domain:
          type: string
        type:
          type: string
          enum: [allow, deny]
        kind:
          type: string
          enum: [exact, regex]
        difference:
          $ref: "#/components/schemas/DriftDifference"
        primary:
          $ref: "#/components/schemas/DriftDomainState"
        member:
          $ref: "#/components/schemas/DriftDomainState"

    DriftDomainState:
      type: object
      additionalProperties: false
      required: [comment, groups, enabled]
      description: The entry's settings on the primary or on the member; absent where the entry is missing.
      properties:
        comment:
          type: string
        groups:
          type: array
          description: The Pi-hole groups by name, sorted.
          items:
            type: string
        enabled:
          type: boolean

    ClientDrift:
      type: object
      additionalProperties: false
      required: [instance, instance_id, client, difference]
      properties:
        instance:
          type: string
        instance_id:
          type: integer
          format: int64
        client:
          type: string
        difference:
          $ref: "#/components/schemas/DriftDifference"
        primary:
          $ref: "#/components/schemas/DriftClientState"
        member:
          $ref: "#/components/schemas/DriftClientState"

    DriftClientState:
      type: object
      additionalProperties: false
      required: [comment, groups]
      properties:
        comment:
          type: string
        groups:
          type: array
          items:
            type: string

    PiholeGroupDrift:
      type: object
      additionalProperties: false
      required: [instance, instance_id, name, difference]
      properties:
        instance:
          type: string
        instance_id:
          type: integer
          format: int64
        name:
          type: string
        difference:
          $ref: "#/components/schemas/DriftDifference"
        primary:
          $ref: "#/components/schemas/DriftGroupState"
        member:
          $ref: "#/components/schemas/DriftGroupState"

    PiholeListDrift:
      type: object
      additionalProperties: false
      required: [instance, instance_id, address, type, difference]
      properties:
        instance:
          type: string
        instance_id:
          type: integer
          format: int64
        address:
          type: string
          description: As in the lists, with a user name or password replaced by `xxxxx`.
        type:
          $ref: "#/components/schemas/PiholeListType"
        difference:
          $ref: "#/components/schemas/DriftDifference"
        primary:
          $ref: "#/components/schemas/DriftDomainState"
        member:
          $ref: "#/components/schemas/DriftDomainState"

    DriftGroupState:
      type: object
      additionalProperties: false
      required: [comment, enabled]
      properties:
        comment:
          type: string
        enabled:
          type: boolean

    ReconcileInput:
      type: object
      additionalProperties: false
      description: Either `all` true, or at least one item (at most 1000 in all). Each item names a member that isn't the primary.
      properties:
        all:
          type: boolean
        domains:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/ReconcileDomain"
        clients:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/ReconcileClient"
        groups:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/ReconcileGroup"
        lists:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/ReconcileList"
        local_dns:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/ReconcileLocalDNS"

    ReconcileList:
      type: object
      additionalProperties: false
      required: [instance_id, address, type]
      properties:
        instance_id:
          type: integer
          format: int64
        address:
          type: string
          minLength: 1
          maxLength: 2048
          description: As the drift report shows it.
        type:
          $ref: "#/components/schemas/PiholeListType"

    ReconcileDomain:
      type: object
      additionalProperties: false
      required: [instance_id, domain, type, kind]
      properties:
        instance_id:
          type: integer
          format: int64
        domain:
          type: string
        type:
          type: string
          enum: [allow, deny]
        kind:
          type: string
          enum: [exact, regex]

    ReconcileClient:
      type: object
      additionalProperties: false
      required: [instance_id, client]
      properties:
        instance_id:
          type: integer
          format: int64
        client:
          type: string

    ReconcileGroup:
      type: object
      additionalProperties: false
      required: [instance_id, name]
      properties:
        instance_id:
          type: integer
          format: int64
        name:
          type: string

    ReconcileResult:
      type: object
      additionalProperties: false
      required: [results, members, report]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/ReconcileItemResult"
        members:
          type: array
          description: The members reconciled, with an error for those that couldn't be read and were left alone.
          items:
            $ref: "#/components/schemas/MemberRead"
        report:
          $ref: "#/components/schemas/DriftReport"

    ReconcileItemResult:
      type: object
      additionalProperties: false
      required: [instance, instance_id, item, action, status]
      properties:
        instance:
          type: string
        instance_id:
          type: integer
          format: int64
        item:
          type: string
          enum: [domain, client, group, list, local_dns]
        domain:
          type: string
          description: For a domain list entry, with `type` and `kind`.
        address:
          type: string
          description: For a subscribed list, with `list_type`; a user name or password in it is replaced by `xxxxx`.
        list_type:
          $ref: "#/components/schemas/PiholeListType"
        needs_gravity:
          type: boolean
          description: For a list added or enabled on the member, which waits for gravity there.
        record_kind:
          $ref: "#/components/schemas/LocalDNSKind"
        key:
          type: string
          description: For a local DNS record or CNAME, with `record_kind`.
        restart_pending:
          type: boolean
          description: For a CNAME change, the member hadn't answered again within 15 seconds of restarting its resolver.
        type:
          type: string
          enum: [allow, deny]
        kind:
          type: string
          enum: [exact, regex]
        client:
          type: string
        group:
          type: string
          description: For a Pi-hole group, its name.
        action:
          type: string
          enum: [add, update, delete, none]
          description: none means the item already matched the primary, or (with an error) wasn't changed.
        status:
          type: string
          enum: [ok, failed]
        error:
          $ref: "#/components/schemas/WriteError"

    Grant:
      type: object
      additionalProperties: false
      required: [permission, scope]
      description: One permission within one scope.
      properties:
        permission:
          type: string
          description: A permission from the catalogue.
          examples: ["domains.edit"]
        scope:
          type: string
          enum: [all, group, instance]
        id:
          type: integer
          format: int64
          description: The instance or group, for scope instance or group. Absent for scope all.

    RoleInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: Unique, ignoring case. Surrounding spaces are ignored.
        description:
          type: string
          maxLength: 500

    RoleCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: Unique, ignoring case. Surrounding spaces are ignored.
        description:
          type: string
          maxLength: 500
        grants:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/Grant"

    GrantsInput:
      type: object
      additionalProperties: false
      required: [grants]
      properties:
        grants:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/Grant"

    Role:
      type: object
      additionalProperties: false
      required: [id, name, description, builtin, created_at, grants, users, ldap_groups, manageable]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        builtin:
          type: boolean
          description: The builtin admin role, which can't be changed or deleted.
        created_at:
          type: string
          format: date-time
        grants:
          type: array
          description: Sorted by permission, then scope.
          items:
            $ref: "#/components/schemas/Grant"
        users:
          type: array
          description: The local users who hold the role, by username.
          items:
            type: string
        ldap_groups:
          type: array
          description: The LDAP group DNs mapped to the role, as entered.
          items:
            type: string
        manageable:
          type: boolean
          description: >-
            Whether the caller holds every grant of the role, and so may give it to users, change it (unless it is
            builtin) or delete it. The server checks again on each change.

    RoleList:
      type: object
      additionalProperties: false
      required: [roles]
      properties:
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"

    RoleCatalogue:
      type: object
      additionalProperties: false
      required: [permissions, instances, groups]
      properties:
        permissions:
          type: array
          description: In the catalogue's order.
          items:
            $ref: "#/components/schemas/PermissionInfo"
        instances:
          type: array
          description: Every instance, enabled or not, sorted by name.
          items:
            $ref: "#/components/schemas/ScopeName"
        groups:
          type: array
          description: Every instance group, sorted by name.
          items:
            $ref: "#/components/schemas/GroupScopeName"

    PermissionInfo:
      type: object
      additionalProperties: false
      required: [name, class, description]
      properties:
        name:
          type: string
        class:
          type: string
          enum: [instance, group, global]
          description: >-
            instance permissions can be granted at scope all, on any group or on one instance; group permissions at
            scope all or on a mirrored group; global permissions at scope all only.
        description:
          type: string

    ScopeName:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string

    GroupScopeName:
      type: object
      additionalProperties: false
      required: [id, name, mode]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        mode:
          type: string
          enum: [independent, mirrored]

    PasswordChange:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          minLength: 1
          maxLength: 1024
        new_password:
          type: string
          minLength: 1
          maxLength: 1024
          description: At least 12 characters and at most 72 bytes, and not the current password.

    TOTPStatus:
      type: object
      additionalProperties: false
      required: [available, enabled, pending, required, recovery_codes_left]
      properties:
        available:
          type: boolean
          description: >-
            Whether two-factor login can be set up. False when the app has no master key, which the secret is stored
            under.
        enabled:
          type: boolean
        enabled_at:
          type: string
          format: date-time
          description: When it was turned on. Absent when it is off.
        pending:
          type: boolean
          description: Whether a secret from setup is waiting for its first code.
        required:
          type: boolean
          description: Whether the caller must use two-factor login, by their own setting or one of their roles'.
        recovery_codes_left:
          type: integer
          description: Unused recovery codes. 0 when two-factor login is off.

    TOTPEnrolment:
      type: object
      additionalProperties: false
      required: [secret, uri, qr]
      properties:
        secret:
          type: string
          description: The secret in base32, for typing into an authenticator app that can't scan the QR code.
        uri:
          type: string
          description: The otpauth:// URI the QR code holds.
        qr:
          type: string
          description: The QR code as a data:image/svg+xml URI, for an img element.

    TOTPCode:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
          description: >-
            A six-digit code from the authenticator app, or where the operation says so a recovery code. Spaces, and a
            recovery code's hyphens and case, are ignored.

    TOTPDisable:
      type: object
      additionalProperties: false
      required: [password, code]
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
        code:
          type: string
          minLength: 1
          maxLength: 64
          description: A six-digit code from the authenticator app, or a recovery code.

    RecoveryCodes:
      type: object
      additionalProperties: false
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: array
          description: Ten single-use codes, each of which stands in for a six-digit code once.
          items:
            type: string

    UserCreate:
      type: object
      additionalProperties: false
      required: [username, password, role_ids]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: >-
            1 to 64 lowercase letters, digits, '.', '_' or '-', starting with a letter or digit. Uppercase is folded
            and surrounding spaces are ignored. Unique across local and LDAP users.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: At least 12 characters and at most 72 bytes.
        role_ids:
          type: array
          maxItems: 1000
          description: The roles to give. A user with none can't log in.
          items:
            type: integer
            format: int64

    UserPassword:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: At least 12 characters and at most 72 bytes.

    UserRoles:
      type: object
      additionalProperties: false
      required: [role_ids]
      properties:
        role_ids:
          type: array
          maxItems: 1000
          description: Every role the user should have; an empty list takes them all away and ends the user's sessions.
          items:
            type: integer
            format: int64

    RoleRef:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string

    User:
      type: object
      additionalProperties: false
      required: [id, username, source, disabled, totp_enabled, created_at, roles, manageable]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        source:
          type: string
          enum: [local, ldap]
        ldap_dn:
          type: string
          description: The user's DN in the directory, for LDAP users.
        disabled:
          type: boolean
        totp_enabled:
          type: boolean
          description: Whether the user has two-factor login on.
        created_at:
          type: string
          format: date-time
        last_login_at:
          type: string
          format: date-time
          description: Absent if the user has never logged in.
        roles:
          type: array
          description: >-
            Sorted by name. A local user's assigned roles; an LDAP user's are the roles their current sessions hold,
            so empty when they aren't logged in.
          items:
            $ref: "#/components/schemas/RoleRef"
        manageable:
          type: boolean
          description: >-
            Whether the caller holds every grant of every role the user has, and so may change their roles or
            password, disable, enable or delete them. The server checks again on each change.

    UserList:
      type: object
      additionalProperties: false
      required: [users]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/User"

    LoginMethods:
      type: object
      additionalProperties: false
      required: [methods]
      properties:
        methods:
          type: array
          minItems: 1
          maxItems: 2
          description: The enabled methods in the order they are tried. Must include local.
          items:
            type: string
            enum: [local, ldap]

    LDAPConnection:
      type: object
      additionalProperties: false
      required: [url, bind_dn, base_dn, user_filter, tls_mode, allow_cn_fallback]
      properties:
        url:
          type: string
          description: ldaps://host[:port], or ldap://host[:port] (passwords then cross the network unencrypted).
        bind_dn:
          type: string
          description: The read-only service account that finds users and their groups.
        base_dn:
          type: string
          description: Users and groups are searched for under this DN.
        user_filter:
          type: string
          description: Finds a user by username, with %s exactly once, e.g. (uid=%s) or (sAMAccountName=%s).
        tls_mode:
          type: string
          enum: [verify, insecure]
        allow_cn_fallback:
          type: boolean
          description: >-
            Accept a certificate whose Common Name, rather than a Subject Alternative Name, matches the host. Only
            applies with PIHOLE_RBAC_LDAP_CA_FILE.

    LDAPSettingsInput:
      type: object
      additionalProperties: false
      required: [url, bind_dn, base_dn, user_filter]
      properties:
        url:
          type: string
          maxLength: 1024
        bind_dn:
          type: string
          maxLength: 1024
        base_dn:
          type: string
          maxLength: 1024
        user_filter:
          type: string
          maxLength: 1024
        tls_mode:
          type: string
          enum: [verify, insecure]
          description: verify if absent.
        allow_cn_fallback:
          type: boolean
        bind_password:
          type: string
          minLength: 1
          maxLength: 1024
          description: >-
            Write-only. Stored encrypted, replacing the stored one, unless PIHOLE_RBAC_LDAP_BIND_PASSWORD is set, when it
            must match the variable. Required when the settings would send an existing password to a new server.

    LDAPSettingsView:
      type: object
      additionalProperties: false
      required: [enabled, bind_password, can_store_password, ca_file_set]
      properties:
        settings:
          $ref: "#/components/schemas/LDAPConnection"
        updated_at:
          type: string
          format: date-time
        updated_by:
          type: string
        enabled:
          type: boolean
          description: Whether LDAP is among the login methods.
        bind_password:
          $ref: "#/components/schemas/LDAPBindPasswordStatus"
        can_store_password:
          type: boolean
          description: Whether a master key is set, so a bind password can be stored.
        ca_file_set:
          type: boolean
          description: Whether PIHOLE_RBAC_LDAP_CA_FILE is set.

    LDAPBindPasswordStatus:
      type: object
      additionalProperties: false
      required: [source, variable]
      description: Where the bind password comes from. Never the password.
      properties:
        source:
          type: string
          enum: [environment, stored, none]
        variable:
          type: string
          description: The environment variable that overrides a stored password.
        updated_at:
          type: string
          format: date-time
          description: When the stored password was last set.
        updated_by:
          type: string

    LDAPUserTestInput:
      type: object
      additionalProperties: false
      required: [username]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 256

    LDAPUserTest:
      type: object
      additionalProperties: false
      required: [username, found, groups, local_account, mappings, roles, permissions]
      properties:
        username:
          type: string
        found:
          type: boolean
          description: Whether the directory has exactly one entry for the username.
        dn:
          type: string
        groups:
          type: array
          description: The group DNs the directory lists the user in, as it returned them.
          items:
            type: string
        local_account:
          type: boolean
          description: The username belongs to a local account, so an LDAP login with it is refused.
        mappings:
          type: array
          description: The mappings that match one of the user's groups.
          items:
            $ref: "#/components/schemas/LDAPMatchedMapping"
        roles:
          type: array
          description: The roles the user would get, sorted by name. None means they would be refused.
          items:
            $ref: "#/components/schemas/RoleRef"
        permissions:
          $ref: "#/components/schemas/TestedPermissions"

    LDAPMatchedMapping:
      type: object
      additionalProperties: false
      required: [group_dn, role]
      properties:
        group_dn:
          type: string
          description: The mapping's group DN, as entered.
        role:
          $ref: "#/components/schemas/RoleRef"

    TestedPermissions:
      type: object
      additionalProperties: false
      required: [global, targets]
      properties:
        global:
          type: array
          items:
            type: string
        targets:
          type: array
          description: Each instance and mirrored group where the roles give at least one permission, by name.
          items:
            $ref: "#/components/schemas/TargetPermissions"

    TargetPermissions:
      type: object
      additionalProperties: false
      required: [target, name, permissions]
      properties:
        target:
          type: string
          examples: ["i-1"]
        name:
          type: string
        permissions:
          type: array
          items:
            type: string

    LDAPGroupInput:
      type: object
      additionalProperties: false
      required: [group_dn]
      properties:
        group_dn:
          type: string
          minLength: 1
          maxLength: 1024

    LDAPGroupCheck:
      type: object
      additionalProperties: false
      required: [exists, members]
      properties:
        exists:
          type: boolean
        members:
          type: integer
          description: How many members the group lists; 0 if it doesn't exist.

    LDAPMapping:
      type: object
      additionalProperties: false
      required: [id, role_id, group_dn, created_at]
      properties:
        id:
          type: integer
          format: int64
        role_id:
          type: integer
          format: int64
        group_dn:
          type: string
          description: As entered. Matching ignores case and spacing.
        created_at:
          type: string
          format: date-time

    LDAPMappingList:
      type: object
      additionalProperties: false
      required: [mappings]
      properties:
        mappings:
          type: array
          items:
            $ref: "#/components/schemas/LDAPMapping"

    LDAPMappingCreated:
      type: object
      additionalProperties: false
      required: [mapping]
      properties:
        mapping:
          $ref: "#/components/schemas/LDAPMapping"
        check:
          $ref: "#/components/schemas/LDAPGroupCheck"
        check_error:
          type: string
          description: Why the group couldn't be looked up, when it couldn't.

    SessionInfo:
      type: object
      additionalProperties: false
      required: [public_id, user, created_at, last_seen_at, expires_at, ip, user_agent, current]
      properties:
        public_id:
          type: string
        user:
          $ref: "#/components/schemas/SessionUser"
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
          description: The last request, to within a minute.
        expires_at:
          type: string
          format: date-time
          description: When the session ends at the latest. It ends sooner after the idle timeout without requests.
        ip:
          type: string
        user_agent:
          type: string
        current:
          type: boolean
          description: Whether this is the caller's current session.

    SessionList:
      type: object
      additionalProperties: false
      required: [sessions, all]
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/SessionInfo"
        all:
          type: boolean
          description: Whether these are every user's sessions (sessions.manage, without mine), or only the caller's.
        next_cursor:
          type: string
          description: Pass as `cursor` for the next page. Absent on the last page.

    ChannelKind:
      type: string
      enum: [discord, matrix]

    ChannelMatrix:
      type: object
      additionalProperties: false
      required: [homeserver, room_id]
      properties:
        homeserver:
          type: string
          maxLength: 2048
          description: >-
            The homeserver's base URL. It may be on the local network; it must be https unless allow_http is on.
        room_id:
          type: string
          maxLength: 255
          description: The room's internal ID, like !abcdefg:example.org (not an alias).
        allow_http:
          type: boolean
          default: false
          description: Allow a plain http:// homeserver, so the token crosses the network unencrypted.

    ChannelInput:
      type: object
      additionalProperties: false
      required: [kind, name, enabled, events]
      properties:
        kind:
          $ref: "#/components/schemas/ChannelKind"
        name:
          type: string
          maxLength: 64
        env_name:
          type: string
          maxLength: 64
          description: >-
            Optional. A secret in PIHOLE_RBAC_NOTIFY_<env_name>_SECRET (or _FILE) then overrides the stored one.
            Empty or absent for none.
        enabled:
          type: boolean
        events:
          type: array
          maxItems: 200
          description: The events the channel receives, from GET /notifications/events.
          items:
            type: string
        matrix:
          $ref: "#/components/schemas/ChannelMatrix"
        secret:
          type: string
          maxLength: 2048
          writeOnly: true
          description: >-
            Write-only. The Discord webhook URL or the Matrix access token. See createChannel and updateChannel for
            when it is required.

    ChannelSecret:
      type: object
      additionalProperties: false
      required: [secret]
      properties:
        secret:
          type: string
          maxLength: 2048
          writeOnly: true

    Channel:
      type: object
      additionalProperties: false
      required: [id, kind, name, enabled, events, secret_source, created_at]
      properties:
        id:
          type: integer
          format: int64
        kind:
          $ref: "#/components/schemas/ChannelKind"
        name:
          type: string
        env_name:
          type: string
        enabled:
          type: boolean
        events:
          type: array
          items:
            type: string
        webhook_id:
          type: string
          description: Discord only, once it has a webhook URL. The webhook's ID, which isn't secret.
        matrix:
          $ref: "#/components/schemas/ChannelMatrix"
        secret_source:
          type: string
          enum: [environment, stored, none]
        secret_variable:
          type: string
          description: The variable that overrides the stored secret, when the channel has an env name.
        secret_updated_at:
          type: string
          format: date-time
          description: When the stored secret was set. Absent without one.
        secret_updated_by:
          type: string
        secret_problem:
          type: string
          description: Why the channel can't send, when it can't (no secret, or one that can't be read).
        created_at:
          type: string
          format: date-time

    ChannelList:
      type: object
      additionalProperties: false
      required: [channels, can_store_secrets]
      properties:
        can_store_secrets:
          type: boolean
          description: Whether a master key is set, without which secrets can't be stored.
        channels:
          type: array
          items:
            $ref: "#/components/schemas/Channel"

    ChannelTestResult:
      type: object
      additionalProperties: false
      required: [ok, message]
      properties:
        ok:
          type: boolean
        status:
          type: integer
          description: The destination's HTTP status. Absent when it didn't answer.
        errcode:
          type: string
          description: Matrix's errcode, such as M_FORBIDDEN, when it sent one.
        message:
          type: string

    NotificationEvent:
      type: object
      additionalProperties: false
      required: [name, group, description]
      properties:
        name:
          type: string
        group:
          type: string
        description:
          type: string

    NotificationEventList:
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/NotificationEvent"

    ProtectedGroupScope:
      type: string
      enum: [instance, group]

    ProtectedGroupEntry:
      type: object
      additionalProperties: false
      required: [scope, id, name, pihole_groups]
      properties:
        scope:
          $ref: "#/components/schemas/ProtectedGroupScope"
        id:
          type: integer
          format: int64
        name:
          type: string
          description: The instance's or mirrored group's name.
        pihole_groups:
          type: array
          items:
            type: string

    ProtectedGroupChoice:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string

    ProtectedGroupSettings:
      type: object
      additionalProperties: false
      required: [entries, instances, groups]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/ProtectedGroupEntry"
        instances:
          type: array
          description: Every instance, as a scope can name it.
          items:
            $ref: "#/components/schemas/ProtectedGroupChoice"
        groups:
          type: array
          description: Every mirrored group, as a scope can name it.
          items:
            $ref: "#/components/schemas/ProtectedGroupChoice"

    ProtectedGroupsInput:
      type: object
      additionalProperties: false
      required: [entries]
      properties:
        entries:
          type: array
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required: [scope, id, pihole_groups]
            properties:
              scope:
                $ref: "#/components/schemas/ProtectedGroupScope"
              id:
                type: integer
                format: int64
              pihole_groups:
                type: array
                maxItems: 100
                items:
                  type: string
                  maxLength: 1024

    AuditList:
      type: object
      additionalProperties: false
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
        next_cursor:
          type: string
          description: Pass as `cursor` for the next page. Absent on the last page.

    AuditEntry:
      type: object
      additionalProperties: false
      required: [id, at, username, action, target, instance_name, result, detail, ip]
      properties:
        id:
          type: integer
          format: int64
        at:
          type: string
          format: date-time
        user_id:
          type: integer
          format: int64
          description: >-
            The acting user's ID. Absent when there was no user row (a failed login with an unknown name, the CLI or the
            app itself) or the user has since been deleted.
        username:
          type: string
          description: >-
            The acting user, the name typed into a failed login, `(cli)` for the command line or `(system)` for the app
            itself.
        action:
          type: string
        target:
          type: string
          description: What the action was performed against, or empty.
        instance_id:
          type: integer
          format: int64
          description: The Pi-hole instance, for actions about one. Absent otherwise, or once the instance is deleted.
        instance_name:
          type: string
          description: The instance's name at the time, kept after it is deleted; empty when there is none.
        result:
          type: string
          enum: [success, failure]
        detail:
          type: object
          additionalProperties: true
          description: What the action changed, per action; `error` on a failure. Never secret values.
        ip:
          type: string
          description: The client address, or empty for the CLI and the app itself.

    GeneralSettingsInput:
      type: object
      additionalProperties: false
      required: [session_lifetime_minutes, idle_timeout_minutes]
      properties:
        session_lifetime_minutes:
          type: integer
          minimum: 15
          maximum: 43200
          description: How long a session lasts at most, from login. 15 minutes to 30 days.
        idle_timeout_minutes:
          type: integer
          minimum: 5
          maximum: 1440
          description: How long a session lasts without requests. 5 minutes to 24 hours, and at most the lifetime.
        audit_retention_days:
          type: integer
          minimum: 30
          maximum: 3650
          description: How many days audit entries are kept, 30 to 3650. Absent leaves it as it is.
        client_reset_schedule:
          $ref: "#/components/schemas/ClientResetSchedule"
        allow_file_lists:
          type: boolean
          description: >-
            Whether file: lists can be added (since v2.3.0). They make a Pi-hole read a file on its own host. Turning
            it off leaves existing ones alone. Absent leaves it as it is.
        localdns_reason_required:
          type: boolean
          description: Whether a local DNS change needs a reason (since v2.4.0). Absent leaves it as it is.
        schedule_group_window_max_minutes:
          type: integer
          minimum: 5
          maximum: 525600
          description: >-
            The longest a schedule's Pi-hole group window can be, 5 minutes to 365 days (since v2.5.0). Lowering it
            leaves existing schedules running. Absent leaves it as it is.
        client_temp_max_minutes:
          type: integer
          minimum: 5
          maximum: 525600
          description: >-
            The longest a temporary client group change can last from its start, 5 minutes to 365 days (since v2.6.0).
            Lowering it shortens nothing already running. Absent leaves it as it is.
        client_temp_reason_required:
          type: boolean
          description: Whether a temporary client group change needs a reason (since v2.6.0). Absent leaves it as it is.
        localdns_extra_domains:
          type: array
          maxItems: 20
          description: >-
            Directory domains a local DNS name is checked against, besides the LDAP base DN's (since v2.4.0). Each
            follows the hostname rules; stored lowercased. Absent leaves them as they are.
          items:
            type: string
            maxLength: 253

    ClientResetSchedule:
      type: object
      additionalProperties: false
      required: [enabled, time, time_zone]
      description: >-
        When client reset runs by itself: every day at `time` in `time_zone`, while `enabled`. Off, at 03:00 UTC, until
        saved. Runs on demand don't depend on it. On a save, absent leaves it as it is.
      properties:
        enabled:
          type: boolean
        time:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: HH:MM, 24-hour, in the time zone. A time skipped by a daylight saving change runs an hour later that day.
        time_zone:
          type: string
          maxLength: 64
          description: An IANA time zone, such as Europe/London or UTC. Not "Local".

    GeneralSettings:
      type: object
      additionalProperties: false
      required: [session_lifetime_minutes, idle_timeout_minutes, audit_retention_days, client_reset_schedule, allow_file_lists, localdns_reason_required, localdns_extra_domains, schedule_group_window_max_minutes, client_temp_max_minutes, client_temp_reason_required]
      properties:
        schedule_group_window_max_minutes:
          type: integer
          description: The longest a schedule's group window can be; 1440 (a day) until saved.
        client_temp_max_minutes:
          type: integer
          description: The longest a temporary client group change can last; 10080 (7 days) until saved.
        client_temp_reason_required:
          type: boolean
          description: Whether a temporary client group change needs a reason; true until saved.
        allow_file_lists:
          type: boolean
          description: "Whether file: lists can be added; false until saved."
        localdns_reason_required:
          type: boolean
          description: Whether a local DNS change needs a reason; true until saved.
        localdns_extra_domains:
          type: array
          description: The extra directory domains for the local DNS check; none until saved.
          items:
            type: string
        session_lifetime_minutes:
          type: integer
        idle_timeout_minutes:
          type: integer
        audit_retention_days:
          type: integer
          description: How many days audit entries, and client reset runs, are kept; 365 until saved.
        client_reset_schedule:
          $ref: "#/components/schemas/ClientResetSchedule"
        updated_at:
          type: string
          format: date-time
          description: Absent until the settings are first saved.
        updated_by:
          type: string

    TargetSummary:
      type: object
      additionalProperties: false
      required: [blocking, last_24h, live]
      description: >-
        For a mirrored group, the counters are summed over the members that answered (counts of distinct clients and
        domains are sums too, so a client seen by two members counts twice), the percentages are worked out from the
        sums, and the blocklist size is the primary's (or the largest, if the primary didn't answer). `blocking` is
        the members' common state, or mixed. `members` says how each member answered, with its own blocking state; a
        member that didn't answer leaves the totals, and the request fails only when none answered.
      properties:
        blocking:
          $ref: "#/components/schemas/BlockingStatus"
        last_24h:
          $ref: "#/components/schemas/DatabaseTotals"
        live:
          $ref: "#/components/schemas/LiveCounters"
        members:
          type: array
          description: For a mirrored group, its enabled members, the primary first. Absent for an instance.
          items:
            $ref: "#/components/schemas/MemberRead"

    DatabaseTotals:
      type: object
      additionalProperties: false
      description: Totals for the last 24 hours from Pi-hole's long-term database, unaffected by FTL restarts.
      required: [queries, blocked, percent_blocked, clients]
      properties:
        queries:
          type: integer
        blocked:
          type: integer
        percent_blocked:
          type: number
          format: double
        clients:
          type: integer

    LiveCounters:
      type: object
      additionalProperties: false
      description: Counters since FTL last started.
      required:
        [queries, blocked, percent_blocked, unique_domains, forwarded, cached, active_clients, total_clients, domains_on_blocklist, status, replies]
      properties:
        queries:
          type: integer
        blocked:
          type: integer
        percent_blocked:
          type: number
          format: double
        unique_domains:
          type: integer
        forwarded:
          type: integer
        cached:
          type: integer
        active_clients:
          type: integer
        total_clients:
          type: integer
        domains_on_blocklist:
          type: integer
          description: Domains on the Pi-hole's blocklists (gravity).
        status:
          type: object
          description: Queries by FTL's result code (GRAVITY, FORWARDED, CACHE and so on).
          additionalProperties:
            type: integer
        replies:
          type: object
          description: Queries by reply type (IP, NXDOMAIN, CNAME and so on).
          additionalProperties:
            type: integer

    BlockingStatus:
      type: object
      additionalProperties: false
      required: [blocking]
      properties:
        blocking:
          type: string
          enum: [enabled, disabled, mixed, failed, unknown]
          description: >-
            failed and unknown mean Pi-hole couldn't tell. mixed is only for a mirrored group whose members differ.
        timer:
          type: integer
          description: >-
            Seconds until blocking changes back, rounded up. Absent when no timer is running. For a mirrored group, the
            soonest of its members' timers.

    BlockingInput:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled:
          type: boolean
        timer:
          type: integer
          minimum: 1
          maximum: 86400
          description: >-
            Only with `enabled` false. Seconds until Pi-hole turns blocking back on. Leaving it out when disabling
            needs `blocking.indefinite` as well as `blocking.toggle`.

    # WriteResults: every Pi-hole write (blocking, DNS restart, domain and client changes) answers with one result per
    # instance it acted on: one for an instance target, one per member for a mirrored group. 200 when every result is
    # ok, 207 when they differ; when none is ok, the error envelope of the first failure, with the results in
    # details.results. Requests refused before any Pi-hole is changed (bad input, no permission, an entry that doesn't
    # exist) answer with the error envelope as usual.
    #
    # Through a mirrored group, the write goes to every enabled member at once, the primary first in the results, and
    # is audited once per member. Pi-hole group IDs in the request are the primary's; each member gets its own IDs
    # for the same names, and a member without one of them fails with pihole_group_missing (if the request names
    # groups other than Default and the primary can't be read, nothing is sent). A change or delete of an entry the
    # primary doesn't have is a 404; if the primary can't be read, the write still goes to the other members. Each
    # member reads its own entry first: a change to an entry a member doesn't have fails there with not_found, and a
    # delete of one is ok, since the entry is already gone.
    LocalDNS:
      type: object
      additionalProperties: false
      required: [records, cnames, instances, reason_required]
      properties:
        reason_required:
          type: boolean
          description: Whether a change needs a reason (the general setting localdns_reason_required), so a form can say so.
        records:
          type: array
          items:
            $ref: "#/components/schemas/DNSRecord"
        cnames:
          type: array
          items:
            $ref: "#/components/schemas/CNAMERecord"
        instances:
          type: array
          description: Per instance (every enabled member, for a mirrored group), whether the app can change its local DNS.
          items:
            $ref: "#/components/schemas/LocalDNSInstance"
        drifted:
          type: boolean
          description: For a mirrored group, whether the last drift check found its members' local DNS differing.
        members:
          type: array
          description: For a mirrored group, how each member answered.
          items:
            $ref: "#/components/schemas/MemberRead"

    LocalDNSMark:
      type: string
      enum: [multiple_names, comment, unparsed]
      description: >-
        Why the app couldn't have written an entry: several hostnames or aliases on it, a # comment, or a string that
        doesn't parse as a record. Such entries can be deleted, but the app never writes one.

    LocalDNSReason:
      type: object
      additionalProperties: false
      required: [reason, by, at]
      description: The reason given with the latest change to the record made through the app.
      properties:
        reason:
          type: string
          description: Empty when none was given (while reasons aren't required).
        by:
          type: string
        at:
          type: string
          format: date-time

    DNSRecord:
      type: object
      additionalProperties: false
      required: [key, value, hostnames, marks]
      properties:
        key:
          type: string
          description: The record's normalised form, which matches it across instances.
        value:
          type: string
          description: Pi-hole's string exactly. Pi-hole's text; show it as text.
        ip:
          type: string
          description: Absent for an unparsed entry.
        hostnames:
          type: array
          items:
            type: string
        comment:
          type: string
        marks:
          type: array
          items:
            $ref: "#/components/schemas/LocalDNSMark"
        reason:
          $ref: "#/components/schemas/LocalDNSReason"

    CNAMERecord:
      type: object
      additionalProperties: false
      required: [key, value, aliases, marks]
      properties:
        key:
          type: string
        value:
          type: string
          description: Pi-hole's string exactly. Pi-hole's text; show it as text.
        aliases:
          type: array
          items:
            type: string
        target:
          type: string
          description: Absent for an unparsed entry.
        ttl:
          type: integer
        comment:
          type: string
        marks:
          type: array
          items:
            $ref: "#/components/schemas/LocalDNSMark"
        reason:
          $ref: "#/components/schemas/LocalDNSReason"

    LocalDNSInstance:
      type: object
      additionalProperties: false
      required: [instance, instance_id, writable, records_locked, cnames_locked]
      properties:
        instance:
          type: string
        instance_id:
          type: integer
          format: int64
        writable:
          type: string
          enum: [ok, app_sudo_off, locked, unknown]
          description: >-
            ok: the app can change it. app_sudo_off: webserver.api.app_sudo is off on the Pi-hole. locked: its config
            is read-only (misc.readOnly). unknown: the member couldn't be read.
        records_locked:
          type: boolean
          description: The records are set by an environment variable, so Pi-hole's API can't change them.
        cnames_locked:
          type: boolean
          description: Likewise for the CNAMEs.

    DNSRecordFields:
      type: object
      additionalProperties: false
      required: [ip, hostname]
      properties:
        ip:
          type: string
          maxLength: 64
          description: IPv4 or IPv6, without a zone.
        hostname:
          type: string
          maxLength: 253
          description: Letters, digits, hyphens and dots, in labels of 1 to 63 characters.

    DNSRecordRef:
      type: object
      additionalProperties: false
      description: Names an existing record, either by `value` (Pi-hole's string as read) or by `ip` and `hostname`.
      properties:
        value:
          type: string
          maxLength: 1024
        ip:
          type: string
          maxLength: 64
        hostname:
          type: string
          maxLength: 253

    DNSRecordInput:
      type: object
      additionalProperties: false
      required: [ip, hostname]
      properties:
        ip:
          type: string
          maxLength: 64
        hostname:
          type: string
          maxLength: 253
        reason:
          $ref: "#/components/schemas/LocalDNSReasonText"

    DNSRecordUpdate:
      type: object
      additionalProperties: false
      required: [from, to]
      properties:
        from:
          $ref: "#/components/schemas/DNSRecordRef"
        to:
          $ref: "#/components/schemas/DNSRecordFields"
        reason:
          $ref: "#/components/schemas/LocalDNSReasonText"

    DNSRecordDelete:
      type: object
      additionalProperties: false
      required: [record]
      properties:
        record:
          $ref: "#/components/schemas/DNSRecordRef"
        reason:
          $ref: "#/components/schemas/LocalDNSReasonText"

    CNAMEFields:
      type: object
      additionalProperties: false
      required: [alias, target]
      properties:
        alias:
          type: string
          maxLength: 253
        target:
          type: string
          maxLength: 253
        ttl:
          type: integer
          minimum: 0
          maximum: 86400
          description: Seconds. Absent uses Pi-hole's dns.localTTL.

    CNAMERef:
      type: object
      additionalProperties: false
      description: Names an existing CNAME, either by `value` (Pi-hole's string as read) or by `alias`, `target` and `ttl`.
      properties:
        value:
          type: string
          maxLength: 1024
        alias:
          type: string
          maxLength: 253
        target:
          type: string
          maxLength: 253
        ttl:
          type: integer

    CNAMEInput:
      type: object
      additionalProperties: false
      required: [alias, target]
      properties:
        alias:
          type: string
          maxLength: 253
        target:
          type: string
          maxLength: 253
        ttl:
          type: integer
          minimum: 0
          maximum: 86400
        reason:
          $ref: "#/components/schemas/LocalDNSReasonText"

    CNAMEUpdate:
      type: object
      additionalProperties: false
      required: [from, to]
      properties:
        from:
          $ref: "#/components/schemas/CNAMERef"
        to:
          $ref: "#/components/schemas/CNAMEFields"
        reason:
          $ref: "#/components/schemas/LocalDNSReasonText"

    CNAMEDelete:
      type: object
      additionalProperties: false
      required: [cname]
      properties:
        cname:
          $ref: "#/components/schemas/CNAMERef"
        reason:
          $ref: "#/components/schemas/LocalDNSReasonText"

    LocalDNSReasonText:
      type: string
      maxLength: 1000
      description: >-
        Why the change is made, at most 200 characters once trimmed; required while the general setting
        localdns_reason_required is on. Kept in the audit log only.

    LocalDNSWriteResults:
      type: object
      additionalProperties: false
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/LocalDNSWriteResult"

    LocalDNSWriteResult:
      type: object
      additionalProperties: false
      required: [instance, instance_id, status]
      properties:
        instance:
          type: string
        instance_id:
          type: integer
          format: int64
        status:
          $ref: "#/components/schemas/WriteStatus"
        error:
          $ref: "#/components/schemas/WriteError"
        already_present:
          type: boolean
          description: For an add through a mirrored group, the member already had the record, so nothing was sent.
        added:
          type: boolean
          description: For a failed change, the new record was added but the old one couldn't be deleted.
        restart_pending:
          type: boolean
          description: >-
            For a CNAME change, Pi-hole accepted it but hadn't answered again within 15 seconds of restarting its
            resolver.

    DHCPSettings:
      type: object
      additionalProperties: false
      required: [active, start, end, router, netmask, lease_time, ipv6, rapid_commit, multi_dns, ignore_unknown_clients]
      description: The DHCP settings the app manages. Addresses are empty when unset.
      properties:
        active:
          type: boolean
        start:
          type: string
        end:
          type: string
        router:
          type: string
        netmask:
          type: string
          description: "Empty is allowed: Pi-hole then guesses from the class of `start`."
        lease_time:
          type: string
          description: "Empty keeps dnsmasq's default."
        ipv6:
          type: boolean
        rapid_commit:
          type: boolean
        multi_dns:
          type: boolean
        ignore_unknown_clients:
          type: boolean

    DHCPSettingsPatch:
      type: object
      additionalProperties: false
      description: The settings to change; a field that isn't sent is left alone.
      properties:
        active:
          type: boolean
        start:
          type: string
          maxLength: 45
        end:
          type: string
          maxLength: 45
        router:
          type: string
          maxLength: 45
        netmask:
          type: string
          maxLength: 45
        lease_time:
          type: string
          maxLength: 16
        ipv6:
          type: boolean
        rapid_commit:
          type: boolean
        multi_dns:
          type: boolean
        ignore_unknown_clients:
          type: boolean

    DHCPWritable:
      type: string
      enum: [ok, app_sudo_off, locked, unknown]
      description: >-
        ok: the app can change it. app_sudo_off: webserver.api.app_sudo is off on the Pi-hole. locked: its config is
        read-only (misc.readOnly). unknown: the instance couldn't be read.

    DHCPInstance:
      type: object
      additionalProperties: false
      required: [instance, instance_id, writable, locked, settings]
      properties:
        instance:
          type: string
        instance_id:
          type: integer
          format: int64
        writable:
          $ref: "#/components/schemas/DHCPWritable"
        locked:
          type: array
          description: "The settings (by the names this API uses) an environment variable fixes, which Pi-hole's API can't change."
          items:
            type: string
        settings:
          $ref: "#/components/schemas/DHCPSettings"

    DHCPSettingsRead:
      type: object
      additionalProperties: false
      required: [instances]
      properties:
        instances:
          type: array
          description: The instances that answered, the primary first through a mirrored group.
          items:
            $ref: "#/components/schemas/DHCPInstance"
        members:
          type: array
          description: Through a mirrored group, how each member answered.
          items:
            $ref: "#/components/schemas/MemberRead"

    DHCPLease:
      type: object
      additionalProperties: false
      required: [instance, instance_id, ip, ipv6]
      properties:
        instance:
          type: string
        instance_id:
          type: integer
          format: int64
        ip:
          type: string
        hwaddr:
          type: string
          description: "The MAC address, absent when Pi-hole has none. For an IPv6 lease it may be an IAID, not a MAC."
        name:
          type: string
          description: The device's hostname, absent when it gave none.
        client_id:
          type: string
        expires:
          type: integer
          format: int64
          description: "When the lease ends, in Unix seconds; 0 means it doesn't expire."
        ipv6:
          type: boolean

    DHCPLeaseSource:
      type: object
      additionalProperties: false
      required: [instance, instance_id, active, included]
      properties:
        instance:
          type: string
        instance_id:
          type: integer
          format: int64
        active:
          type: boolean
          description: DHCP is on, on this instance.
        included:
          type: boolean
          description: Its leases are in the list. False for a mirrored group's member with DHCP off.

    DHCPLeases:
      type: object
      additionalProperties: false
      required: [leases, instances]
      properties:
        leases:
          type: array
          items:
            $ref: "#/components/schemas/DHCPLease"
        instances:
          type: array
          items:
            $ref: "#/components/schemas/DHCPLeaseSource"
        members:
          type: array
          items:
            $ref: "#/components/schemas/MemberRead"

    DHCPLeaseRef:
      type: object
      additionalProperties: false
      required: [ip]
      properties:
        ip:
          type: string
          maxLength: 45

    DHCPStaticLease:
      type: object
      additionalProperties: false
      required: [key, value, marks]
      properties:
        key:
          type: string
          description: "What identifies the lease: its lowercase MAC and address, or its value for an entry that can't be read."
        value:
          type: string
          description: "Pi-hole's string, exactly as read. Text: show it as text."
        mac:
          type: string
        ip:
          type: string
        hostname:
          type: string
        marks:
          type: array
          description: Why the app couldn't have written the entry, so it can be deleted but not changed.
          items:
            $ref: "#/components/schemas/DHCPStaticMark"

    DHCPStaticMark:
      type: string
      enum: [extra_fields, multiple_macs, ipv6, no_mac, unparsed]

    DHCPStaticInstance:
      type: object
      additionalProperties: false
      required: [instance, instance_id, writable, locked, static_leases]
      properties:
        instance:
          type: string
        instance_id:
          type: integer
          format: int64
        writable:
          $ref: "#/components/schemas/DHCPWritable"
        locked:
          type: boolean
          description: "The static leases are set by an environment variable, so Pi-hole's API can't change them."
        subnet:
          type: string
          description: The subnet DHCP's settings give, as a prefix, when there is one, which new leases must fall in.
        static_leases:
          type: array
          items:
            $ref: "#/components/schemas/DHCPStaticLease"

    DHCPStaticLeases:
      type: object
      additionalProperties: false
      required: [instances]
      properties:
        instances:
          type: array
          items:
            $ref: "#/components/schemas/DHCPStaticInstance"
        members:
          type: array
          items:
            $ref: "#/components/schemas/MemberRead"

    DHCPStaticLeaseInput:
      type: object
      additionalProperties: false
      required: [mac, ip]
      properties:
        mac:
          type: string
          maxLength: 64
        ip:
          type: string
          maxLength: 45
        hostname:
          type: string
          maxLength: 253

    DHCPStaticLeaseRef:
      type: object
      additionalProperties: false
      description: A static lease, by its MAC and address, or by `value` (Pi-hole's string as read), not both.
      properties:
        mac:
          type: string
          maxLength: 64
        ip:
          type: string
          maxLength: 45
        value:
          type: string
          maxLength: 1000

    DHCPStaticLeaseUpdate:
      type: object
      additionalProperties: false
      required: [from, to]
      properties:
        from:
          $ref: "#/components/schemas/DHCPStaticLeaseRef"
        to:
          $ref: "#/components/schemas/DHCPStaticLeaseInput"

    DHCPStaticLeaseDelete:
      type: object
      additionalProperties: false
      required: [lease]
      properties:
        lease:
          $ref: "#/components/schemas/DHCPStaticLeaseRef"

    DHCPWriteResults:
      type: object
      additionalProperties: false
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/DHCPWriteResult"

    DHCPWriteResult:
      type: object
      additionalProperties: false
      required: [instance, instance_id, status]
      properties:
        instance:
          type: string
        instance_id:
          type: integer
          format: int64
        status:
          $ref: "#/components/schemas/WriteStatus"
        error:
          $ref: "#/components/schemas/WriteError"
        unchanged:
          type: boolean
          description: Nothing was sent, since the instance was already as asked.
        added:
          type: boolean
          description: For a failed change, the new lease was added but the old one couldn't be deleted.
        restart_pending:
          type: boolean
          description: Pi-hole accepted the change but hadn't answered again within 15 seconds of restarting.

    LocalDNSDrift:
      type: object
      additionalProperties: false
      required: [instance, instance_id, record_kind, key, value, difference]
      properties:
        instance:
          type: string
        instance_id:
          type: integer
          format: int64
        record_kind:
          $ref: "#/components/schemas/LocalDNSKind"
        key:
          type: string
        value:
          type: string
          description: The string on the primary (missing) or on the member (extra). Pi-hole's text; show it as text.
        difference:
          type: string
          enum: [missing, extra]
        writable:
          type: boolean
          description: For a missing entry, whether reconcile can copy it (the app could have written it).

    LocalDNSKind:
      type: string
      enum: [record, cname]

    ReconcileLocalDNS:
      type: object
      additionalProperties: false
      required: [instance_id, record_kind, key]
      properties:
        instance_id:
          type: integer
          format: int64
        record_kind:
          $ref: "#/components/schemas/LocalDNSKind"
        key:
          type: string
          minLength: 1
          maxLength: 1024
          description: As the drift report shows it.

    WriteStatus:
      type: string
      enum: [ok, failed, skipped]
      description: >-
        ok: the change was made. failed: the Pi-hole was asked and the change failed (see `error`). skipped: the
        instance wasn't asked, because it was found down moments ago or can't be used (see `error`).

    WriteError:
      type: object
      additionalProperties: false
      required: [code, message]
      description: Why an instance failed or was skipped. Present exactly when the status isn't ok.
      properties:
        code:
          type: string
          description: >-
            pihole_unreachable, pihole_auth_rejected, pihole_status_error, pihole_rejected, instance_password_missing
            or instance_misconfigured; and, for a member of a mirrored group, not_found (the entry a change names isn't
            on that member), pihole_group_missing (it has no Pi-hole group with a name the change uses) or
            validation_failed (the Pi-hole group a rename or delete names is that member's Default group). Since
            v2.4.0 also pihole_app_sudo_off and pihole_config_locked (the Pi-hole won't let the app change its config),
            and, for a member skipped by a CNAME write that goes one member at a time, stopped (an earlier member
            failed) or time_limit (the write ran out of time).
        message:
          type: string
          description: Safe to show to the user.
        pihole_message:
          type: string
          description: For pihole_rejected, Pi-hole's own reason, when it gave one. Pi-hole's text; show it as text.

    BlockingWriteResults:
      type: object
      additionalProperties: false
      required: [results]
      description: The result per instance of turning blocking on or off.
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/BlockingWriteResult"

    BlockingWriteResult:
      type: object
      additionalProperties: false
      required: [instance, instance_id, status]
      properties:
        instance:
          type: string
          description: The instance's name.
        instance_id:
          type: integer
          format: int64
        status:
          $ref: "#/components/schemas/WriteStatus"
        error:
          $ref: "#/components/schemas/WriteError"
        blocking:
          $ref: "#/components/schemas/BlockingStatus"
          description: Present when ok.

    DNSRestartResults:
      type: object
      additionalProperties: false
      required: [results]
      description: The result per instance of a DNS restart.
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/DNSRestartResult"

    DNSRestartResult:
      type: object
      additionalProperties: false
      required: [instance, instance_id, status]
      properties:
        instance:
          type: string
          description: The instance's name.
        instance_id:
          type: integer
          format: int64
        status:
          $ref: "#/components/schemas/WriteStatus"
        error:
          $ref: "#/components/schemas/WriteError"
        confirmed:
          type: boolean
          description: >-
            Present when ok. False when the connection dropped while the restart was being requested, which happens
            when the restart goes ahead: check the dashboard in a few seconds.

    DomainWriteResults:
      type: object
      additionalProperties: false
      required: [results]
      description: The result per instance of adding or changing a list entry.
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/DomainWriteResult"

    DomainWriteResult:
      type: object
      additionalProperties: false
      required: [instance, instance_id, status]
      properties:
        instance:
          type: string
          description: The instance's name.
        instance_id:
          type: integer
          format: int64
        status:
          $ref: "#/components/schemas/WriteStatus"
        error:
          $ref: "#/components/schemas/WriteError"
        entry:
          $ref: "#/components/schemas/Domain"
          description: Present when ok. The entry as saved.

    ClientWriteResults:
      type: object
      additionalProperties: false
      required: [results]
      description: The result per instance of changing a client.
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/ClientWriteResult"

    ClientWriteResult:
      type: object
      additionalProperties: false
      required: [instance, instance_id, status]
      properties:
        instance:
          type: string
          description: The instance's name.
        instance_id:
          type: integer
          format: int64
        status:
          $ref: "#/components/schemas/WriteStatus"
        error:
          $ref: "#/components/schemas/WriteError"
        entry:
          $ref: "#/components/schemas/PiholeClient"
          description: Present when ok. The client as saved.

    DeleteResults:
      type: object
      additionalProperties: false
      required: [results]
      description: The result per instance of deleting a list entry.
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/DeleteResult"

    DeleteResult:
      type: object
      additionalProperties: false
      required: [instance, instance_id, status]
      properties:
        instance:
          type: string
          description: The instance's name.
        instance_id:
          type: integer
          format: int64
        status:
          $ref: "#/components/schemas/WriteStatus"
        error:
          $ref: "#/components/schemas/WriteError"

    DomainList:
      type: object
      additionalProperties: false
      required: [domains]
      properties:
        drifted:
          type: boolean
          description: >-
            For a mirrored group: whether its members' domain lists differed from the primary's at the last drift check.
            Absent for an instance, and until a check has compared them.
        domains:
          type: array
          items:
            $ref: "#/components/schemas/Domain"

    Domain:
      type: object
      additionalProperties: false
      required: [domain, type, kind, comment, groups, enabled]
      properties:
        domain:
          type: string
        type:
          type: string
          enum: [allow, deny]
        kind:
          type: string
          enum: [exact, regex]
        comment:
          type: string
        groups:
          type: array
          description: IDs of the Pi-hole groups the entry is in. See the target's groups for their names.
          items:
            type: integer
        enabled:
          type: boolean
          description: Read-only here.
        added_at:
          type: string
          format: date-time
          description: Absent if Pi-hole didn't report it.
        modified_at:
          type: string
          format: date-time
          description: Absent if Pi-hole didn't report it.

    DomainKey:
      type: object
      additionalProperties: false
      required: [domain, type, kind]
      description: Names a list entry. The same domain can be on both lists, and be both an exact and a regex entry.
      properties:
        domain:
          type: string
          minLength: 1
          maxLength: 1024
        type:
          type: string
          enum: [allow, deny]
        kind:
          type: string
          enum: [exact, regex]

    DomainInput:
      type: object
      additionalProperties: false
      required: [domain, type, kind]
      properties:
        domain:
          type: string
          minLength: 1
          maxLength: 1024
          description: >-
            Surrounding spaces are ignored. An exact domain is at most 255 bytes; a regex at most 1024. Pi-hole checks
            the rest.
        type:
          type: string
          enum: [allow, deny]
        kind:
          type: string
          enum: [exact, regex]
        comment:
          type: string
          maxLength: 500
        groups:
          type: array
          maxItems: 1000
          items:
            type: integer
            minimum: 0

    DomainUpdate:
      type: object
      additionalProperties: false
      required: [domain, type, kind]
      description: Names the entry and gives at least one of comment and groups.
      properties:
        domain:
          type: string
          minLength: 1
          maxLength: 1024
        type:
          type: string
          enum: [allow, deny]
        kind:
          type: string
          enum: [exact, regex]
        comment:
          type: string
          maxLength: 500
        groups:
          type: array
          maxItems: 1000
          description: Replaces the entry's groups.
          items:
            type: integer
            minimum: 0

    ClientList:
      type: object
      additionalProperties: false
      required: [clients]
      properties:
        drifted:
          type: boolean
          description: >-
            For a mirrored group: whether its members' clients differed from the primary's at the last drift check.
            Absent for an instance, and until a check has compared them.
        clients:
          type: array
          items:
            $ref: "#/components/schemas/PiholeClient"

    PiholeClient:
      type: object
      additionalProperties: false
      required: [client, comment, groups]
      properties:
        client:
          type: string
          description: The IP address, MAC address, hostname or subnet the client was added with. Identifies it.
        name:
          type: string
          description: The hostname Pi-hole resolved, if any.
        comment:
          type: string
        groups:
          type: array
          items:
            type: integer
        added_at:
          type: string
          format: date-time
        modified_at:
          type: string
          format: date-time

    ClientUpdate:
      type: object
      additionalProperties: false
      required: [client]
      description: Names the client and gives at least one of comment and groups.
      properties:
        client:
          type: string
          minLength: 1
          maxLength: 255
        comment:
          type: string
          maxLength: 500
        groups:
          type: array
          maxItems: 1000
          description: Replaces the client's groups.
          items:
            type: integer
            minimum: 0

    PiholeListList:
      type: object
      additionalProperties: false
      required: [lists]
      properties:
        drifted:
          type: boolean
          description: >-
            For a mirrored group: whether its members' lists differed from the primary's at the last drift check.
            Absent for an instance, and until a check has compared them.
        gravity_last_update:
          type: string
          format: date-time
          description: When gravity last finished on the instance, or on the mirrored group's primary. Absent if it never has.
        members:
          type: array
          description: For a mirrored group, how each enabled member answered, the primary first. Absent for an instance.
          items:
            $ref: "#/components/schemas/MemberRead"
        lists:
          type: array
          items:
            $ref: "#/components/schemas/PiholeList"

    PiholeListType:
      type: string
      enum: [block, allow]

    PiholeListStatus:
      type: string
      enum: [never, updated, unchanged, cached, failed]
      description: >-
        How the last download went. never: not downloaded yet. updated: downloaded, with changes. unchanged:
        downloaded, the same as before. cached: the download failed and the copy from an earlier run was used. failed:
        the download failed and there was no earlier copy.

    PiholeList:
      type: object
      additionalProperties: false
      required: [address, type, comment, groups, enabled, status, domains, invalid_domains, needs_gravity, marks]
      properties:
        address:
          type: string
          description: The address, with a user name or password in it replaced by `xxxxx`.
        type:
          $ref: "#/components/schemas/PiholeListType"
        comment:
          type: string
        groups:
          type: array
          description: IDs of the Pi-hole groups the list applies to. See the target's groups for their names.
          items:
            type: integer
        enabled:
          type: boolean
        status:
          $ref: "#/components/schemas/PiholeListStatus"
        domains:
          type: integer
          description: How many domains the list had at its last download.
        invalid_domains:
          type: integer
          description: Lines that weren't valid domains at the last download.
        added_at:
          type: string
          format: date-time
        modified_at:
          type: string
          format: date-time
          description: When the address, enabled flag or comment last changed (Pi-hole doesn't track group changes).
        updated_at:
          type: string
          format: date-time
          description: When a download last changed the list's content. Absent if that never happened.
        needs_gravity:
          type: boolean
          description: >-
            The list is enabled and was added, enabled again, or had its comment changed since the last gravity run, so
            it may not be in use until gravity runs. Through a mirrored group, true when it is for any member.
        marks:
          type: array
          description: >-
            Why the list wouldn't be accepted if it were added now: file (a file: list, whatever allow_file_lists says),
            scheme (another scheme Pi-hole accepts, such as ftp) or credentials (a user name or password in the
            address). Empty for an ordinary list. Such lists can still be changed and deleted.
          items:
            type: string
            enum: [file, scheme, credentials]
        members:
          type: array
          description: >-
            For a mirrored group: the list on each enabled member, the primary first. Absent for an instance.
          items:
            $ref: "#/components/schemas/PiholeListMemberStatus"

    PiholeListMemberStatus:
      type: object
      additionalProperties: false
      required: [instance, instance_id, primary, state]
      description: >-
        The list on one member. state ok: the member has it, with its own status. missing: the member doesn't have it
        (drift). unreadable: the member couldn't be read; see the answer's `members` for why.
      properties:
        instance:
          type: string
        instance_id:
          type: integer
          format: int64
        primary:
          type: boolean
        state:
          type: string
          enum: [ok, missing, unreadable]
        status:
          $ref: "#/components/schemas/PiholeListStatus"
        domains:
          type: integer
        invalid_domains:
          type: integer
        updated_at:
          type: string
          format: date-time
        needs_gravity:
          type: boolean

    PiholeListKey:
      type: object
      additionalProperties: false
      required: [address, type]
      description: Names a list. The same address can be both a blocklist and an allowlist.
      properties:
        address:
          type: string
          minLength: 1
          maxLength: 2048
        type:
          $ref: "#/components/schemas/PiholeListType"

    PiholeListInput:
      type: object
      additionalProperties: false
      required: [address, type]
      properties:
        address:
          type: string
          minLength: 1
          maxLength: 2048
          description: >-
            Surrounding spaces are ignored. http:// or https:// with a host, and no user name or password; file:
            with an absolute path only while allow_file_lists is on. The address is shown to everyone who can see the
            lists, so a token in it isn't secret.
        type:
          $ref: "#/components/schemas/PiholeListType"
        comment:
          type: string
          maxLength: 500
        groups:
          type: array
          maxItems: 1000
          items:
            type: integer
            minimum: 0
        enabled:
          type: boolean
          default: true

    PiholeListUpdate:
      type: object
      additionalProperties: false
      required: [address, type]
      description: Names the list and gives at least one of comment, groups and enabled.
      properties:
        address:
          type: string
          minLength: 1
          maxLength: 2048
        type:
          $ref: "#/components/schemas/PiholeListType"
        comment:
          type: string
          maxLength: 500
        groups:
          type: array
          maxItems: 1000
          description: Replaces the list's groups.
          items:
            type: integer
            minimum: 0
        enabled:
          type: boolean

    PiholeListWriteResults:
      type: object
      additionalProperties: false
      required: [results]
      description: The result per instance of adding or changing a list.
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/PiholeListWriteResult"

    PiholeListWriteResult:
      type: object
      additionalProperties: false
      required: [instance, instance_id, status]
      properties:
        instance:
          type: string
          description: The instance's name.
        instance_id:
          type: integer
          format: int64
        status:
          $ref: "#/components/schemas/WriteStatus"
        error:
          $ref: "#/components/schemas/WriteError"
        entry:
          $ref: "#/components/schemas/PiholeList"
          description: >-
            Present when ok. The list as saved, with its status from before any gravity run; `needs_gravity` here says
            whether the write left it waiting for gravity (added enabled, or enabled again).

    GravityRun:
      type: object
      additionalProperties: false
      required: [id, target, status, started_at, started_by, results, output, output_last_seq, output_truncated]
      properties:
        id:
          type: string
        target:
          type: string
          description: The target the run was started through.
        status:
          type: string
          enum: [running, done]
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        started_by:
          type: string
          description: The username of who started it.
        results:
          type: array
          description: One per instance, in the order they run.
          items:
            $ref: "#/components/schemas/GravityInstanceResult"
        output:
          type: array
          description: >-
            Output lines after `after`, oldest first: the newest 200 of them. Each instance keeps its newest 2000.
            Lines are plain text, cleaned of terminal codes; show them as text.
          items:
            $ref: "#/components/schemas/GravityLine"
        output_last_seq:
          type: integer
          description: The `seq` of the newest line so far, to send as `after` next time; 0 when there is none.
        output_truncated:
          type: boolean
          description: Lines after `after` were left out before the first one in `output`.

    GravityLine:
      type: object
      additionalProperties: false
      required: [seq, instance_id, text]
      properties:
        seq:
          type: integer
        instance_id:
          type: integer
          format: int64
        text:
          type: string

    GravityInstanceResult:
      type: object
      additionalProperties: false
      required: [instance, instance_id, primary, status]
      properties:
        instance:
          type: string
        instance_id:
          type: integer
          format: int64
        primary:
          type: boolean
        status:
          type: string
          enum: [pending, running, ok, failed, skipped]
        reason:
          type: string
          enum: [stopped, down]
          description: >-
            For skipped: stopped, an earlier member failed; down, the instance couldn't be reached (in a run through a
            group).
        error:
          $ref: "#/components/schemas/WriteError"
        domains:
          type: integer
          description: The domain count gravity ended with.
        last_update:
          type: string
          format: date-time
          description: When Pi-hole says gravity finished.
        duration_ms:
          type: integer
          format: int64
        lists_failed:
          type: integer
          description: Enabled lists whose download failed (cached copy used, or none). These don't stop a run.

    PiholeGroupList:
      type: object
      additionalProperties: false
      required: [groups]
      properties:
        drifted:
          type: boolean
          description: >-
            For a mirrored group: whether its members' Pi-hole groups differed from the primary's at the last drift
            check. Absent for an instance, and until a check has compared them.
        groups:
          type: array
          items:
            $ref: "#/components/schemas/PiholeGroup"

    PiholeGroup:
      type: object
      additionalProperties: false
      required: [id, name, comment, enabled]
      properties:
        id:
          type: integer
          description: Pi-hole's ID for the group, which differs between Pi-holes.
        name:
          type: string
        comment:
          type: string
        enabled:
          type: boolean

    PiholeGroupKey:
      type: object
      additionalProperties: false
      required: [name]
      description: Names a Pi-hole group exactly. Names are compared case-sensitively, as Pi-hole does.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255

    PiholeGroupInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: No control characters, and no spaces at the start or end.
        comment:
          type: string
          maxLength: 500
        enabled:
          type: boolean
          default: true

    PiholeGroupUpdate:
      type: object
      additionalProperties: false
      required: [name]
      description: The group to change, by name, and at least one change.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        new_name:
          type: string
          minLength: 1
          maxLength: 255
          description: Renames the group. No control characters, and no spaces at the start or end.
        comment:
          type: string
          maxLength: 500
        enabled:
          type: boolean

    PiholeGroupWriteResults:
      type: object
      additionalProperties: false
      required: [results]
      description: The result per instance of adding or changing a Pi-hole group.
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/PiholeGroupWriteResult"
        references:
          $ref: "#/components/schemas/PiholeGroupRenameReferences"

    PiholeGroupWriteResult:
      type: object
      additionalProperties: false
      required: [instance, instance_id, status]
      properties:
        instance:
          type: string
          description: The instance's name.
        instance_id:
          type: integer
          format: int64
        status:
          $ref: "#/components/schemas/WriteStatus"
        error:
          $ref: "#/components/schemas/WriteError"
        entry:
          $ref: "#/components/schemas/PiholeGroup"
          description: Present when ok. The group as saved.

    PiholeGroupDeleteResults:
      type: object
      additionalProperties: false
      required: [results]
      description: The result per instance of deleting a Pi-hole group.
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/DeleteResult"
        references:
          $ref: "#/components/schemas/PiholeGroupReferences"

    PiholeGroupReferences:
      type: object
      additionalProperties: false
      required: [counts, items]
      description: >-
        The app's references to Pi-hole groups by name. `counts` covers them all; `items` holds only those the caller
        manages: client reset rules with settings.manage, protected groups with notifications.manage, group windows
        with schedules.manage on the schedule's instance or group.
      properties:
        counts:
          $ref: "#/components/schemas/PiholeGroupReferenceCounts"
        items:
          type: array
          items:
            $ref: "#/components/schemas/PiholeGroupReference"

    PiholeGroupReferenceCounts:
      type: object
      additionalProperties: false
      required: [client_reset_rules, protected_groups, group_windows, client_overrides]
      properties:
        client_reset_rules:
          type: integer
        protected_groups:
          type: integer
        group_windows:
          type: integer
          description: Schedules whose group window names the group.
        client_overrides:
          type: integer
          description: >-
            Active temporary client group changes that name the group, as a group the client was in or one the
            change put it in. Counted per instance a change covers.

    PiholeGroupReference:
      type: object
      additionalProperties: false
      required: [kind, scope, scope_id, scope_name, names]
      properties:
        kind:
          type: string
          enum: [client_reset_rule, protected_group, group_window, client_override]
          description: >-
            A client reset rule (shown to holders of settings.manage), a protected group (notifications.manage), a
            schedule's group window (schedules.manage on the schedule's instance or group) or an active temporary
            client change on one instance (clients.edit on that instance).
        scope:
          type: string
          enum: [instance, group]
        scope_id:
          type: integer
          format: int64
        scope_name:
          type: string
        comment_prefix:
          type: string
          description: A client reset rule's comment prefix.
        match:
          type: string
          enum: [names, prefixes]
          description: How a client reset rule matches Pi-hole groups.
        client:
          type: string
          description: A temporary client change's client.
        override_id:
          type: integer
          format: int64
          description: A temporary client change's ID.
        original_names:
          type: array
          items:
            type: string
          description: >-
            A temporary client change's original groups, which the client returns to. For an updated reference, the
            value after the rename. `names` holds the groups the change put the client in.
        original_before:
          type: array
          items:
            type: string
          description: For an updated temporary client change, its original groups before the rename.
        schedule_name:
          type: string
          description: A group window's schedule.
        schedule_kind:
          type: string
          enum: [group_enabled, group_disabled]
          description: Whether a group window's schedule enables or disables the group during its window.
        names:
          type: array
          items:
            type: string
          description: >-
            A client reset rule's group names or prefixes, or a protected group's or group window's name (one). For
            an updated reference, the value after the rename.
        before:
          type: array
          items:
            type: string
          description: For an updated reference, the value before the rename.
        dropped:
          type: boolean
          description: >-
            For an updated protected group: removed, because its instance or group already listed the new name.
        reason:
          type: string
          enum: [prefix_match_changes, not_renamed_everywhere, old_name_still_used]
          description: >-
            For a reference to check: a prefix rule now matches only one of the two names; the rename didn't reach
            every instance the reference covers; or a protected group still matches another group left there.

    ScheduleKind:
      type: string
      enum: [blocking_off, group_enabled, group_disabled]
      description: >-
        What a schedule does during its window: turn blocking off (through Pi-hole's own timer), or enable or disable
        a Pi-hole group, switching it back at the end.

    ScheduleRepeat:
      type: string
      enum: [weekly, once]

    ScheduleInput:
      type: object
      additionalProperties: false
      required: [name, kind, repeat]
      description: >-
        A weekly window starts on each day in `days` at `start` and ends `end_days` later at `end`, in `time_zone`:
        21:00 to 07:00 is `end_days` 1. It is at most 7 days long and can't overlap itself. A one-off window runs from
        `starts_at`, which must be in the future, to `ends_at`. A blocking window is at most 24 hours; a group window
        at most schedule_group_window_max_minutes (refusals give `details.max_minutes`).
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Unique on the target, ignoring case.
        kind:
          $ref: "#/components/schemas/ScheduleKind"
        pihole_group:
          type: string
          maxLength: 255
          description: For a group window, the Pi-hole group, named exactly. Not the Default group.
        repeat:
          $ref: "#/components/schemas/ScheduleRepeat"
        enabled:
          type: boolean
          default: true
        days:
          type: integer
          minimum: 1
          maximum: 127
          description: Weekly. The days a window starts on, as bits from Monday = 1 to Sunday = 64.
        start:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: Weekly. HH:MM, 24-hour. A start skipped by a daylight saving change comes an hour later.
        end:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: Weekly. HH:MM, 24-hour, on the day `end_days` after the start.
        end_days:
          type: integer
          minimum: 0
          maximum: 7
          description: Weekly. How many days after the start day the window ends.
        time_zone:
          type: string
          maxLength: 64
          description: Weekly. An IANA time zone, such as Europe/London or UTC. Not "Local".
        starts_at:
          type: string
          format: date-time
          description: Once.
        ends_at:
          type: string
          format: date-time
          description: Once.

    ScheduleUpdate:
      type: object
      additionalProperties: false
      description: Any of a schedule's fields but its kind. Absent fields keep their value.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        pihole_group:
          type: string
          maxLength: 255
        repeat:
          $ref: "#/components/schemas/ScheduleRepeat"
        enabled:
          type: boolean
        days:
          type: integer
          minimum: 1
          maximum: 127
        start:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        end:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        end_days:
          type: integer
          minimum: 0
          maximum: 7
        time_zone:
          type: string
          maxLength: 64
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time

    ScheduleEdge:
      type: object
      additionalProperties: false
      required: [at, edge]
      properties:
        at:
          type: string
          format: date-time
        edge:
          type: string
          enum: [start, end]

    ScheduleResult:
      type: object
      additionalProperties: false
      required: [instance_id, instance, status, at, attempts]
      description: >-
        What the latest edge, or its latest retry, did on one instance. A failed or skipped one is retried every 30
        seconds until the schedule's next edge (a blocking start only while its window is open; a one-off's end for a
        week, then given_up).
      properties:
        instance_id:
          type: integer
          format: int64
        instance:
          type: string
        status:
          type: string
          enum: [ok, failed, skipped, given_up]
        code:
          type: string
          description: Why it failed or was skipped, such as not_found, schedule_conflict or a Pi-hole error code.
        skip:
          type: string
          enum: [unchanged, still_open, window_over, timer]
          description: >-
            Why an ok edge sent nothing: the state was already right; another window for the group is still open;
            a blocking start found after its window ended; or a blocking window's end, which Pi-hole's timer handles
            (unless FTL lost the timer in a restart, when the end turns blocking back on and this is absent).
        other:
          type: string
          description: The schedule that is still open, or in conflict.
        at:
          type: string
          format: date-time
        attempts:
          type: integer

    Schedule:
      type: object
      additionalProperties: false
      required: [id, name, target, target_name, kind, repeat, enabled, length_minutes, open, results, over_limit, created_at, created_by, updated_at, updated_by]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        target:
          type: string
          description: The instance (i-<id>) or mirrored group (g-<id>) it is set on.
        target_name:
          type: string
        kind:
          $ref: "#/components/schemas/ScheduleKind"
        pihole_group:
          type: string
        repeat:
          $ref: "#/components/schemas/ScheduleRepeat"
        enabled:
          type: boolean
        days:
          type: integer
        start:
          type: string
        end:
          type: string
        end_days:
          type: integer
        time_zone:
          type: string
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        length_minutes:
          type: integer
          description: The window's length as entered.
        open:
          type: boolean
          description: Whether one of its windows is open now (whatever the instances' state, which a person may have changed).
        open_until:
          type: string
          format: date-time
          description: When the open window ends.
        next_edge:
          $ref: "#/components/schemas/ScheduleEdge"
        last_edge:
          $ref: "#/components/schemas/ScheduleEdge"
        results:
          type: array
          description: Each instance's result for the latest edge; empty until the first, and after a change.
          items:
            $ref: "#/components/schemas/ScheduleResult"
        finished_at:
          type: string
          format: date-time
          description: A one-off schedule, once done. It can then only be deleted.
        over_limit:
          type: boolean
          description: Longer than the limit allows now; it keeps running, but a change must bring it within the limit.
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
        updated_at:
          type: string
          format: date-time
        updated_by:
          type: string

    ScheduleList:
      type: object
      additionalProperties: false
      required: [schedules, from_groups, group_window_max_minutes]
      properties:
        group_window_max_minutes:
          type: integer
          description: >-
            The longest a group window can be now (schedule_group_window_max_minutes), so a form can say so without
            settings.manage. A blocking window is at most 1440 minutes, and a weekly one at most 10080.
        schedules:
          type: array
          items:
            $ref: "#/components/schemas/Schedule"
        from_groups:
          type: array
          description: For an instance, the schedules on its mirrored group the caller manages. Empty for a group.
          items:
            $ref: "#/components/schemas/Schedule"

    ScheduleStatusItem:
      type: object
      additionalProperties: false
      required: [id, name, kind, target, target_name, open]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        kind:
          $ref: "#/components/schemas/ScheduleKind"
        pihole_group:
          type: string
        target:
          type: string
        target_name:
          type: string
        open:
          type: boolean
        open_until:
          type: string
          format: date-time
        next_edge:
          $ref: "#/components/schemas/ScheduleEdge"

    ScheduleStatus:
      type: object
      additionalProperties: false
      required: [schedules]
      properties:
        schedules:
          type: array
          description: Open ones first, then by next edge.
          items:
            $ref: "#/components/schemas/ScheduleStatusItem"

    PiholeGroupRenameReferences:
      type: object
      additionalProperties: false
      required: [updated, to_check]
      description: Present on a rename. What happened to the app's references to the old name.
      properties:
        updated:
          $ref: "#/components/schemas/PiholeGroupReferences"
        to_check:
          $ref: "#/components/schemas/PiholeGroupReferences"
        error:
          type: string
          description: >-
            Set when Pi-hole renamed the group but the app couldn't update its references; `updated` then lists what
            would have changed, and nothing did.

    PiholeGroupUsage:
      type: object
      additionalProperties: false
      required: [name, id, domains, clients, lists, references]
      properties:
        name:
          type: string
        id:
          type: integer
          description: Pi-hole's ID for the group on the instance or primary read.
        domains:
          type: integer
          description: Domains in the group.
        clients:
          type: integer
          description: Clients in the group.
        lists:
          type: integer
          description: Subscribed lists in the group.
        references:
          $ref: "#/components/schemas/PiholeGroupReferences"

    QueryLog:
      type: object
      additionalProperties: false
      required: [queries, page, page_size, total, pages, capped, snapshot, source]
      description: >-
        For a mirrored group, `members` says how each member answered. A member that didn't answer leaves the log and
        the total, and the request fails only when none answered.
      properties:
        queries:
          type: array
          items:
            $ref: "#/components/schemas/QueryLogEntry"
        members:
          type: array
          description: >-
            For a mirrored group, its enabled members, the primary first (only the one asked for with `member`).
            Absent for an instance.
          items:
            $ref: "#/components/schemas/MemberRead"
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
          description: >-
            Entries matching the filters (summed over the members that answered). Without a filter it is Pi-hole's
            whole in-memory count, which can include a few entries newer than the snapshot.
        pages:
          type: integer
          description: The pages that can be reached; for a merged group log, no further than the newest 5,000 entries.
        capped:
          type: boolean
          description: A merged group log with more matching entries than can be paged through; narrow the search or pick a member.
        snapshot:
          type: string
          description: Send back with later pages of this search.
        source:
          $ref: "#/components/schemas/QuerySource"

    QuerySource:
      type: string
      enum: [memory, disk, mixed]
      description: >-
        Where the entries were read: Pi-hole's in-memory log, its long-term database, or, for a group, some members
        from each.

    QueryStatus:
      type: string
      enum: [UNKNOWN, GRAVITY, FORWARDED, CACHE, REGEX, DENYLIST, EXTERNAL_BLOCKED_IP, EXTERNAL_BLOCKED_NULL,
        EXTERNAL_BLOCKED_NXRA, GRAVITY_CNAME, REGEX_CNAME, DENYLIST_CNAME, RETRIED, RETRIED_DNSSEC, IN_PROGRESS, DBBUSY,
        SPECIAL_DOMAIN, CACHE_STALE, EXTERNAL_BLOCKED_EDE15]
      description: FTL's status names (Pi-hole v6).

    QueryType:
      type: string
      enum: [A, AAAA, ANY, SRV, SOA, PTR, TXT, NAPTR, MX, DS, RRSIG, DNSKEY, NS, SVCB, HTTPS, OTHER]

    QueryLogEntry:
      type: object
      additionalProperties: false
      required: [instance, time, type, domain, client_ip, status, reply_type]
      properties:
        instance:
          type: string
          description: The instance that answered the query.
        time:
          type: string
          format: date-time
        type:
          type: string
          description: The record type asked for (A, AAAA, PTR and so on).
        domain:
          type: string
        client_ip:
          type: string
        client_name:
          type: string
          description: Absent when Pi-hole has no name for the client.
        status:
          type: string
          description: FTL's result (GRAVITY, FORWARDED, CACHE, DENYLIST and so on).
        reply_type:
          type: string
        reply_time_ms:
          type: number
          format: double
          description: Absent when there was no reply.
        upstream:
          type: string
          description: Absent when the query wasn't forwarded.
        dnssec:
          type: string
          description: Absent when Pi-hole didn't report a DNSSEC status.

    ClientResetScope:
      type: string
      enum: [instance, group]

    ClientResetMatch:
      type: string
      enum: [names, prefixes]
      description: >-
        How a rule's Pi-hole groups are found on each instance: `names`, each is a group's exact name, and every
        instance must have them all; `prefixes`, every group whose name starts with one of them, and at least one must.

    ClientResetChoice:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string

    ClientResetRule:
      type: object
      additionalProperties: false
      required: [scope, id, name, comment_prefix, group_match, pihole_groups]
      properties:
        scope:
          $ref: "#/components/schemas/ClientResetScope"
        id:
          type: integer
          format: int64
        name:
          type: string
          description: The instance's or mirrored group's name.
        comment_prefix:
          type: string
          description: Clients whose comment starts with this (case-sensitive) are reset; the longest matching prefix wins.
        group_match:
          $ref: "#/components/schemas/ClientResetMatch"
        pihole_groups:
          type: array
          items:
            type: string

    ClientResetRules:
      type: object
      additionalProperties: false
      required: [rules, instances, groups]
      properties:
        rules:
          type: array
          items:
            $ref: "#/components/schemas/ClientResetRule"
        instances:
          type: array
          description: Every instance, as a rule can name it.
          items:
            $ref: "#/components/schemas/ClientResetChoice"
        groups:
          type: array
          description: Every mirrored group, as a rule can name it.
          items:
            $ref: "#/components/schemas/ClientResetChoice"

    ClientResetRulesInput:
      type: object
      additionalProperties: false
      required: [rules]
      properties:
        rules:
          type: array
          maxItems: 500
          items:
            type: object
            additionalProperties: false
            required: [scope, id, comment_prefix, group_match, pihole_groups]
            properties:
              scope:
                $ref: "#/components/schemas/ClientResetScope"
              id:
                type: integer
                format: int64
              comment_prefix:
                type: string
                maxLength: 1024
              group_match:
                $ref: "#/components/schemas/ClientResetMatch"
              pihole_groups:
                type: array
                maxItems: 50
                items:
                  type: string
                  maxLength: 1024

    ClientResetChange:
      type: object
      additionalProperties: false
      required: [client, comment, prefix, groups_before, groups_after]
      description: A client reset (or, in a preview, that would be), with its Pi-hole groups by name.
      properties:
        client:
          type: string
        comment:
          type: string
        prefix:
          type: string
          description: The comment prefix of the rule that matched it.
        groups_before:
          type: array
          items:
            type: string
        groups_after:
          type: array
          items:
            type: string

    ClientResetFailure:
      type: object
      additionalProperties: false
      required: [client, comment, prefix, code]
      properties:
        client:
          type: string
        comment:
          type: string
        prefix:
          type: string
        code:
          type: string
          description: >-
            Why it wasn't reset: pihole_group_missing or no_target_groups (its rule's groups aren't on the instance), or
            a Pi-hole or instance code.

    ClientResetProblem:
      type: object
      additionalProperties: false
      required: [prefix, code]
      description: A rule that can't run on the instance, whether or not a client matches it yet.
      properties:
        prefix:
          type: string
        code:
          type: string
          enum: [pihole_group_missing, no_target_groups]
        missing:
          type: array
          description: The group names the instance doesn't have, for pihole_group_missing.
          items:
            type: string

    TemporaryClientStart:
      type: object
      additionalProperties: false
      required: [client, groups]
      description: >-
        Names the client and the Pi-hole groups it is moved to, by name, and either how long or when it ends. The
        longest is the `client_temp_max_minutes` setting and the shortest 5 minutes. The reason is 1 to 200
        characters when `client_temp_reason_required` is on.
      properties:
        client:
          type: string
          minLength: 1
          maxLength: 255
        groups:
          type: array
          maxItems: 100
          description: Replaces the client's groups for the duration. Every instance must have a Pi-hole group of each name.
          items:
            type: string
            minLength: 1
            maxLength: 255
        duration_minutes:
          type: integer
          minimum: 5
          maximum: 525600
        ends_at:
          type: string
          format: date-time
        reason:
          type: string
          maxLength: 200

    TemporaryClientUpdate:
      type: object
      additionalProperties: false
      required: [ends_at]
      properties:
        ends_at:
          type: string
          format: date-time

    TemporaryClientMember:
      type: object
      additionalProperties: false
      required: [instance_id, instance, original_groups, override_groups, revert_status, attempts]
      description: One instance a change was made on, with the client's groups there by name.
      properties:
        instance_id:
          type: integer
          format: int64
        instance:
          type: string
        original_groups:
          type: array
          items:
            type: string
        override_groups:
          type: array
          items:
            type: string
        revert_status:
          type: string
          enum: [pending, ok, failed, skipped, given_up]
          description: >-
            pending: not tried yet. failed or skipped: tried and failed (skipped when the instance couldn't be
            called), to be retried. ok: put back. given_up: a week of retries failed.
        revert_code:
          type: string
          description: Why the latest revert failed or was skipped, such as not_found, or a Pi-hole error code.
        missing_groups:
          type: array
          description: Original groups that no longer exist on the Pi-hole, left out of the revert.
          items:
            type: string
        attempts:
          type: integer
        reverted_at:
          type: string
          format: date-time

    TemporaryClientChange:
      type: object
      additionalProperties: false
      required: [id, target, target_name, client, starts_at, ends_at, reason, status, overdue, created_by, members]
      properties:
        id:
          type: integer
          format: int64
        target:
          type: string
          description: Where it was set, i-<id> or g-<id>.
        target_name:
          type: string
        via:
          type: string
          description: >-
            Set when the change is listed on an instance it was made on through a mirrored group, which is the one
            that can change or end it (g-<id>).
        client:
          type: string
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        reason:
          type: string
        status:
          type: string
          enum: [active, reverted, ended, failed]
          description: >-
            active until every instance was put back. reverted: it ran its time. ended: a person ended it early.
            failed: an instance was given up on, or lost its client.
        overdue:
          type: boolean
          description: Active and past its end, so the app is putting the client back.
        created_by:
          type: string
        ended_by:
          type: string
        ended_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        members:
          type: array
          items:
            $ref: "#/components/schemas/TemporaryClientMember"

    TemporaryClientChangeList:
      type: object
      additionalProperties: false
      required: [changes, max_minutes, reason_required]
      properties:
        changes:
          type: array
          items:
            $ref: "#/components/schemas/TemporaryClientChange"
        max_minutes:
          type: integer
          description: The longest a change can last from its start (the client_temp_max_minutes setting).
        reason_required:
          type: boolean
          description: Whether a start needs a reason (the client_temp_reason_required setting).

    TemporaryClientWriteResult:
      type: object
      additionalProperties: false
      required: [instance, instance_id, status]
      properties:
        instance:
          type: string
        instance_id:
          type: integer
          format: int64
        status:
          $ref: "#/components/schemas/WriteStatus"
        error:
          $ref: "#/components/schemas/WriteError"
        unchanged:
          type: boolean
          description: "Present when ok and nothing needed sending: the client already had those groups."
        groups:
          type: array
          description: Present when ok. The client's groups on the instance now, by name.
          items:
            type: string
        missing_groups:
          type: array
          description: On an end or retry, the original groups that no longer exist on the Pi-hole.
          items:
            type: string

    TemporaryClientWriteResults:
      type: object
      additionalProperties: false
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/TemporaryClientWriteResult"
        change:
          $ref: "#/components/schemas/TemporaryClientChange"

    ClientResetSkipped:
      type: object
      additionalProperties: false
      required: [client, reason, override_id]
      description: A matching client the run left alone.
      properties:
        client:
          type: string
        reason:
          type: string
          enum: [temporary_change_active]
          description: The client has an active temporary group change on this instance.
        override_id:
          type: integer
          format: int64

    ClientResetInstanceResult:
      type: object
      additionalProperties: false
      required: [instance_id, instance, primary, status, reset, failed, unchanged, problems]
      properties:
        instance_id:
          type: integer
          format: int64
        instance:
          type: string
        primary:
          type: boolean
          description: Whether this is the mirrored group's primary.
        status:
          type: string
          enum: [ok, partial, failed, skipped]
          description: >-
            ok when nothing failed; failed when nothing that needed resetting was reset, or the instance couldn't be
            read (with `code`); partial otherwise; skipped when it wasn't contacted (down, or missing its password).
        code:
          type: string
          description: Why the instance couldn't be read or changed at all, when it couldn't.
        reset:
          type: array
          description: In a run, the clients reset; in a preview, those a run would reset.
          items:
            $ref: "#/components/schemas/ClientResetChange"
        failed:
          type: array
          items:
            $ref: "#/components/schemas/ClientResetFailure"
        unchanged:
          type: integer
          description: Matching clients already in exactly their rule's groups.
        skipped:
          type: array
          description: >-
            Matching clients left alone because they have an active temporary group change on this instance (since
            v2.6.0). Counted as neither reset nor unchanged. Absent in runs from before.
          items:
            $ref: "#/components/schemas/ClientResetSkipped"
        problems:
          type: array
          items:
            $ref: "#/components/schemas/ClientResetProblem"

    ClientResetPreview:
      type: object
      additionalProperties: false
      required: [target, target_name, rules, instances]
      properties:
        target:
          type: string
        target_name:
          type: string
        rules:
          type: integer
          description: How many rules the target has.
        instances:
          type: array
          items:
            $ref: "#/components/schemas/ClientResetInstanceResult"

    ClientResetRun:
      type: object
      additionalProperties: false
      required: [id, started_at, trigger, username, target, target_name, status, rules, instances]
      properties:
        id:
          type: integer
          format: int64
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          description: Absent while running.
        trigger:
          type: string
          enum: [manual, schedule]
        username:
          type: string
          description: Who ran it; (system) for a scheduled run. Kept when the user is deleted.
        target:
          type: string
          description: The target run, i-<id> or g-<id>.
        target_name:
          type: string
          description: The instance's or group's name when it ran; kept when it is deleted.
        status:
          type: string
          enum: [running, ok, partial, failed]
        rules:
          type: integer
          description: How many rules ran.
        instances:
          type: array
          items:
            $ref: "#/components/schemas/ClientResetInstanceResult"
        error:
          type: string
          description: Why a run that couldn't finish didn't, such as being interrupted by the app stopping.

    ClientResetRunList:
      type: object
      additionalProperties: false
      required: [runs]
      properties:
        runs:
          type: array
          items:
            $ref: "#/components/schemas/ClientResetRun"
        next_cursor:
          type: string
          description: Pass as `cursor` for the next page. Absent on the last page.
        rules:
          type: integer
          description: For one target's runs, how many rules the target has now.

    # The standard error envelope returned by every /api/v1 endpoint on failure.
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"

    ErrorBody:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          description: >-
            Stable machine-readable code: unauthenticated, forbidden, csrf_failed, validation_failed, method_not_allowed,
            unsupported_media_type, not_found, conflict, invariant_violated, confirmation_required, rate_limited, setup_required,
            invalid_credentials, no_access, invalid_setup_token, setup_complete, internal, pihole_unreachable, pihole_auth_rejected,
            pihole_status_error, pihole_rejected, instance_password_missing, instance_misconfigured, ldap_failed.
        message:
          type: string
          description: Human-readable message, safe to show to the user.
        details:
          type: object
          additionalProperties: true
          description: Optional structured context, e.g. which instance failed.
