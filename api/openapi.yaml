    AuditEntry:
      type: object
      additionalProperties: false
      required: [id, at, username, action, target, instance_name, result, detail, ip]
      properties:
        id:
          type: integer
          format: int64
        at:
          type: string
          format: date-time
        user_id:
          type: integer
          format: int64
          description: >-
            The acting user's ID. Absent when there was no user row (a failed login with an unknown name, the CLI or the
            app itself) or the user has since been deleted.
        username:
          type: string
          description: >-
            The acting user, the name typed into a failed login, `(cli)` for the command line or `(system)` for the app
            itself.
        action:
          type: string
        target:
          type: string
          description: What the action was performed against, or empty.
        instance_id:
          type: integer
          format: int64
