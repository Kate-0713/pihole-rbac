          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/RoleConflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "503":
          $ref: "#/components/responses/SetupRequired"
    delete:
      summary: Delete a role
      description: >-
        Needs every grant the role has. Refused (code invariant_violated) for the builtin admin role and for a role
        that local users or LDAP mappings still use; `details` then has `users` and `ldap_groups`.
      operationId: deleteRole
      x-permission: roles.manage
      responses:
        "204":
