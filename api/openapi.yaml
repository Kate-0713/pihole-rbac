          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PiholeGroupWriteResults"
        "400":
          $ref: "#/components/responses/InvalidOrRejected"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
