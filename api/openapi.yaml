      responses:
        "200":
          description: The catalogue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleCatalogue"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/roles/{id}:
    parameters:
      - $ref: "#/components/parameters/RoleID"
    get:
      summary: One role
      operationId: getRole
      x-permission: roles.manage|users.manage
      responses:
        "200":
          description: The role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/SetupRequired"
    put:
      summary: Rename a role or change its description
      description: >-
        Needs every grant the role has. The builtin admin role can't be changed (code invariant_violated).
      operationId: updateRole
      x-permission: roles.manage
      requestBody:
        required: true
