          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientWriteResults"
        "400":
          $ref: "#/components/responses/InvalidOrRejected"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/TargetUnavailable"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "502":
          $ref: "#/components/responses/TargetPiholeFailed"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/targets/{target}/clients/temporary:
    parameters:
      - $ref: "#/components/parameters/TargetID"
    get:
      summary: Temporary client group changes
      description: >-
        The target's active temporary changes, and those that finished in the last 30 days (at most 100), active first.
        For an instance, the active changes made through a mirrored group it belongs to are listed too, read-only, with
        `via`. Also gives the limits a start is checked against. Since v2.6.0.
      operationId: listTemporaryClientChanges
      x-permission: target:clients.view
      responses:
        "200":
          description: The changes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemporaryClientChangeList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/SetupRequired"
    post:
      summary: Move a client to other Pi-hole groups for a set time
      description: >-
        The body names the client and the Pi-hole groups by name, and how long (`duration_minutes`, or `ends_at`).
        The app records the client's groups on each instance, changes them, and puts them back when the time is up.
        Answers with a result per instance, as a client change does, plus the stored change. Members that failed
        aren't covered and aren't retried; end the change and start again to cover them. A client that already has an
        active change on any of the instances is a 409 (code conflict, with `details.override_id` and
        `details.instance`). Audited as client_temp_set, one row per instance. Since v2.6.0.
      operationId: startTemporaryClientChange
      x-permission: target:clients.edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemporaryClientStart"
      responses:
        "200":
          description: Every instance took the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemporaryClientWriteResults"
        "207":
          description: Some instances took the change and some didn't. Only a mirrored group can answer this.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemporaryClientWriteResults"
        "400":
          $ref: "#/components/responses/InvalidOrRejected"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/TargetUnavailable"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "502":
          $ref: "#/components/responses/TargetPiholeFailed"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/targets/{target}/clients/temporary/{id}:
    parameters:
      - $ref: "#/components/parameters/TargetID"
      - $ref: "#/components/parameters/TemporaryChangeID"
    patch:
      summary: Extend or shorten a temporary change
      description: >-
        Moves the end: later than now, and within the maximum measured from the change's start. A change that is over
        is a 409. Changes only the app's database. Audited as client_temp_update. Since v2.6.0.
      operationId: updateTemporaryClientChange
      x-permission: target:clients.edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemporaryClientUpdate"
      responses:
        "200":
          description: The change as saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemporaryClientChange"
        "400":
          $ref: "#/components/responses/InvalidOrRejected"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/targets/{target}/clients/temporary/{id}/end:
    parameters:
      - $ref: "#/components/parameters/TargetID"
      - $ref: "#/components/parameters/TemporaryChangeID"
    post:
      summary: End a temporary change now
      description: >-
        Puts the client back before answering, with a result per instance. A member that can't be reached is retried
        by the app every 30 seconds, and the change stays active, shown as reverting, until it is. Audited as
        client_temp_end, one row per instance. Since v2.6.0.
      operationId: endTemporaryClientChange
      x-permission: target:clients.edit
      responses:
        "200":
          description: Every instance was put back.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemporaryClientWriteResults"
        "207":
          description: Some instances were put back and some weren't yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemporaryClientWriteResults"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/TargetPiholeFailed"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/targets/{target}/clients/temporary/{id}/retry:
    parameters:
      - $ref: "#/components/parameters/TargetID"
      - $ref: "#/components/parameters/TemporaryChangeID"
    post:
      summary: Retry a revert the app gave up on
      description: >-
        Only for a change whose status is failed. Runs the revert again at once on the members that were given up
        after a week, with a result per instance. A member that fails again is given up on again. Audited as
        client_temp_end. Since v2.6.0.
      operationId: retryTemporaryClientChange
      x-permission: target:clients.edit
      responses:
        "200":
          description: Every instance was put back.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemporaryClientWriteResults"
        "207":
          description: Some instances were put back and some weren't.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemporaryClientWriteResults"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/TargetPiholeFailed"
        "503":
          $ref: "#/components/responses/SetupRequired"

