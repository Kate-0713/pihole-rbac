# API contract (spec-first). Every request/response shape is defined here before its handler.
# oapi-codegen generates internal/api/gen from this file: make generate / .\build.ps1 generate
openapi: 3.1.0
info:
  title: pihole-rbac
  version: 2.0.0-dev
  description: >-
    Every /api/v1 endpoint needs a session unless it says otherwise. Every state-changing request (POST, PUT, PATCH,
    DELETE) also needs the X-CSRF-Token header and an Origin (or Referer) matching the app's own origin, and a
    request body must be application/json. Failures use the Error envelope. Until first-run setup is complete, every
    /api/v1 endpoint except about, auth/csrf, setup/status and setup answers 503 with code setup_required.
  license:
    name: GNU Affero General Public License v3.0 or later
    identifier: AGPL-3.0-or-later

security:
  - session: []

paths:
  /healthz:
    get:
      summary: Liveness check
      description: Unauthenticated. Returns only "ok", for Docker health checks and the LXC updater.
      operationId: healthz
      security: []
      responses:
        "200":
          description: The server is up.
          content:
            text/plain:
              schema:
                type: string
                const: ok

  /api/v1/about:
    get:
      summary: Source code location and licence
      description: >-
        Unauthenticated, and available before first-run setup is complete, so every page (including login and setup)
        can show the source link that AGPL-3.0 section 13 requires. Deliberately carries no version number, so
        anonymous visitors can't tell which release is running.
      operationId: getAbout
      security: []
      responses:
        "200":
          description: Where to get the source of the running build, and its licence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/About"

  /api/v1/auth/csrf:
    get:
      summary: CSRF token for the current visitor
      description: >-
        Unauthenticated. Returns the token to send as X-CSRF-Token. For a logged-in visitor it is the session's token;
        otherwise it is bound to an anonymous cookie, which this call sets if the visitor doesn't have one yet. The
        login page calls this before POST /auth/login. An anonymous token stops working once the visitor logs in.
      operationId: getCSRFToken
      security: []
      responses:
        "200":
          description: The token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CSRFToken"

  /api/v1/setup/status:
    get:
      summary: Whether first-run setup is still needed
      description: Unauthenticated and available before setup. The SPA calls it to decide whether to show the setup page.
      operationId: getSetupStatus
      security: []
      responses:
        "200":
          description: The setup state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"

  /api/v1/setup:
    post:
      summary: Complete first-run setup
      description: >-
        Unauthenticated, but needs the anonymous CSRF token from GET /auth/csrf. Checks the one-time setup token
        printed to the log at startup (or by `pihole-rbac setup --print-token`), creates the first local admin with
        the builtin admin role and the starter roles staff and reader, closes setup for good, and logs the new admin
        in. The response is the new session, as for POST /auth/login. Wrong tokens count against the client
        address's failed-login limit.
      operationId: completeSetup
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "200":
          description: Setup complete; logged in as the new admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentSession"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          description: The setup token is wrong or has expired (code invalid_setup_token).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Setup is already complete (code setup_complete).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/login:
    post:
      summary: Log in
      description: >-
        Unauthenticated, but needs the anonymous CSRF token from GET /auth/csrf. Tries the enabled login methods in
        order. On success, sets the session cookie (replacing any previous session) and returns the new session,
        including its CSRF token. Failed attempts are limited per client address and per username; while a limit
        applies, attempts are refused with 429 without checking the credentials.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentSession"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          description: Wrong username or password (code invalid_credentials). Doesn't say which.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >-
            The credentials were correct but the user has no role in this app (code no_access), or the CSRF or
            Origin check failed (code csrf_failed).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/auth/logout:
    post:
      summary: Log out
      description: Ends the current session and clears the session cookie.
      operationId: logout
      x-permission: session
      responses:
        "204":
          description: Logged out.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/auth/session:
    get:
      summary: The current session
      description: >-
        Returns the logged-in user, the session's CSRF token and the user's permissions, or 401 when there is no
        session. The SPA calls this on load.
      operationId: getSession
      x-permission: session
      responses:
        "200":
          description: The current session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentSession"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/auth/password:
    post:
      summary: Change your own password
      description: >-
        For local users; an LDAP user's password lives in the directory (400 validation_failed). Needs the current
        password: a wrong one is 401 invalid_credentials and counts against the same per-address and per-username
        limits as logging in, and while a limit applies the request is refused with 429 without checking it. On
        success the user's other sessions end and this one is kept. No permission is needed beyond a session.
      operationId: changePassword
      x-permission: session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChange"
      responses:
        "204":
          description: Changed.
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          description: >-
            The current password is wrong (code invalid_credentials), or there is no valid session (code
            unauthenticated).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/system/secrets:
    get:
      summary: List the secrets
      description: >-
        Every known secret with whether it is set and where it came from. Never the values. Instances in the
        database whose password variable doesn't exist are listed as not set.
      operationId: listSecrets
      x-permission: config.reload
      responses:
        "200":
          description: The secrets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/system/reload:
    post:
      summary: Reload the secrets
      description: >-
        Re-reads every secret that was given as a *_FILE variable. Plain environment variables only change on a
        restart. A secret that fails to load keeps its previous value and is listed in `failed`; the response is 200
        either way.
      operationId: reloadSecrets
      x-permission: config.reload
      responses:
        "200":
          description: What the reload changed and what failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReloadResult"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/targets:
    get:
      summary: The instances the user can act on
      description: >-
        Every enabled instance where the user holds at least one permission, by name, with its health, then every
        mirrored group whose primary is enabled and where the user holds at least one permission, by name, with its
        enabled members' health and an overall state. Disabled members are left out. An instance in a mirrored group
        names it in `mirrored_group`, so a client can warn before editing it on its own. The health comes from the
        server's own calls and a periodic check of idle instances; it is held in memory, so it starts as unknown after
        a restart.
      operationId: listTargets
      x-permission: session
      responses:
        "200":
          description: The targets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TargetList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/instances:
    get:
      summary: List the Pi-hole instances
      description: Every instance, by name, with its settings, whether its password variable is set, and its health.
      operationId: listInstances
      x-permission: instances.manage
      responses:
        "200":
          description: The instances.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/SetupRequired"
    post:
      summary: Add a Pi-hole instance
      description: >-
        Creates the instance disabled. Its app password is either stored, encrypted under the master key, from
        `password`, or read from PIHOLE_RBAC_INSTANCE_<env_name>_PASSWORD (or _FILE), which overrides a stored one.
        A password is only sent to an address it was confirmed for: if the instance's variable is already set,
        `password` is required and must match it. Enable the instance once it has a password.
      operationId: createInstance
      x-permission: instances.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstanceInput"
      responses:
        "201":
          description: The new instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/instances/{id}:
    parameters:
      - $ref: "#/components/parameters/InstanceID"
    get:
      summary: One Pi-hole instance
      operationId: getInstance
      x-permission: instances.manage
      responses:
        "200":
          description: The instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/SetupRequired"
    put:
      summary: Change a Pi-hole instance's settings
      description: >-
        Replaces the settings, and stores `password` when given. A password is only sent to an address it was
        confirmed for, so `password` is required (code validation_failed, `details.field` password) when the base
        URL, TLS mode or CA file of an instance that has a password changes, or when the instance starts using a
        variable that is set; it must match the variable when one is set. If the instance is enabled and the change
        affects how it connects (base URL, TLS settings, env name or password), the new settings must pass a
        connection test first, or the change is refused; disable the instance to save settings that don't work yet.
        A rename keeps the instance's Pi-hole session.
      operationId: updateInstance
      x-permission: instances.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstanceInput"
      responses:
        "200":
          description: The instance as saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/InstanceConflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "502":
          $ref: "#/components/responses/PiholeFailed"
        "503":
          $ref: "#/components/responses/SetupRequired"
    delete:
      summary: Delete a Pi-hole instance
      description: >-
        Refused with 409 while a role grant, an instance group or a client-reset target refers to the instance; the
        message lists them, and `details` has `roles`, `groups` and `client_reset_targets`.
      operationId: deleteInstance
      x-permission: instances.manage
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/instances/{id}/password:
    parameters:
      - $ref: "#/components/parameters/InstanceID"
    put:
      summary: Store a new app password for a Pi-hole instance
      description: >-
        Stores the password encrypted under the master key, as when the Pi-hole's password is rotated. If the
        instance is enabled, the password must pass a connection test at its current address first, or nothing is
        changed. Refused with 409 conflict when the instance's variable is set (it overrides a stored password) or
        when no master key is set. The password is never returned.
      operationId: setInstancePassword
      x-permission: instances.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstancePassword"
      responses:
        "200":
          description: The instance, with its new password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/InstanceConflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "502":
          $ref: "#/components/responses/PiholeFailed"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/instances/{id}/test:
    parameters:
      - $ref: "#/components/parameters/InstanceID"
    post:
      summary: Test the connection to a Pi-hole instance
      description: >-
        Logs in to the Pi-hole with the stored settings and the current password, reads the blocking status and logs
        out, without changing anything. Works on disabled instances. A failed test is still a 200, with `ok` false.
      operationId: testInstance
      x-permission: instances.manage
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceTestResult"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/instances/{id}/enable:
    parameters:
      - $ref: "#/components/parameters/InstanceID"
    post:
      summary: Enable a Pi-hole instance
      description: >-
        Runs a connection test with the stored settings and enables the instance only if it passes. Enabling an
        enabled instance changes nothing.
      operationId: enableInstance
      x-permission: instances.manage
      responses:
        "200":
          description: The instance, now enabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/InstanceConflict"
        "502":
          $ref: "#/components/responses/PiholeFailed"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/instances/{id}/disable:
    parameters:
      - $ref: "#/components/parameters/InstanceID"
    post:
      summary: Disable a Pi-hole instance
      description: Stops all calls to the instance and logs its client out of the Pi-hole. Disabling a disabled instance changes nothing.
      operationId: disableInstance
      x-permission: instances.manage
      responses:
        "200":
          description: The instance, now disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/instance-groups:
    get:
      summary: List the instance groups
      description: >-
        Every instance group, by name, with its mode, its members (by name, with whether each is enabled) and, for a
        mirrored group, its primary.
      operationId: listInstanceGroups
      x-permission: instances.manage
      responses:
        "200":
          description: The groups.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceGroupList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/SetupRequired"
    post:
      summary: Add an instance group
      description: >-
        An independent group is a label for organising instances and scoping grants: a grant on it covers each current
        member. A mirrored group treats its members as one Pi-hole: it is a target (`g-<id>`), reads come from its
        primary and writes go to every enabled member. A mirrored group needs a primary, which must be a member; an
        independent group has none. An instance can be in at most one mirrored group. Audited as group_create.
      operationId: createInstanceGroup
      x-permission: instances.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstanceGroupInput"
      responses:
        "201":
          description: The new group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceGroup"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/InstanceGroupConflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/instance-groups/{id}:
    parameters:
      - $ref: "#/components/parameters/GroupID"
    get:
      summary: One instance group
      operationId: getInstanceGroup
      x-permission: instances.manage
      responses:
        "200":
          description: The group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceGroup"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/SetupRequired"
    put:
      summary: Change an instance group
      description: >-
        Replaces the group's name, mode, members and primary, under the same rules as adding one. A mirrored group
        can't become independent while a role holds a mirrored-group permission (drift.view, drift.reconcile) on it
        (code invariant_violated, with `details.roles`). Members added to an independent group are covered by its
        grants at once, and members removed lose them. Audited as group_update, with the fields that changed and the
        members added and removed.
      operationId: updateInstanceGroup
      x-permission: instances.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstanceGroupInput"
      responses:
        "200":
          description: The group as saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceGroup"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/InstanceGroupConflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "503":
          $ref: "#/components/responses/SetupRequired"
    delete:
      summary: Delete an instance group
      description: >-
        Removes the group and its memberships; the instances themselves are untouched. Refused with 409 conflict while
        a role grant or a client-reset target refers to the group; the message lists them, and `details` has `roles`
        and `client_reset_targets`. Audited as group_delete.
      operationId: deleteInstanceGroup
      x-permission: instances.manage
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/instance-groups/{id}/drift:
    parameters:
      - $ref: "#/components/parameters/GroupID"
    get:
      summary: What differs between a mirrored group's members
      description: >-
        The group's latest drift check: each enabled member compared with the primary, by natural key (domain, type
        and kind; client identifier; Pi-hole group name), with group memberships compared by name. Checks run at
        startup, every 5 minutes, and soon after a write through the group or to one of its members; the result is
        held in memory, so `state` is not_checked until the first check after a restart. Needs drift.view on the
        group. Without domains.view on the group the domain differences are left out, and without clients.view the
        client differences; the counts are always given. A member that didn't answer is listed with its error, and
        its differences are unknown rather than reported.
      operationId: getGroupDrift
      x-permission: target:drift.view
      responses:
        "200":
          description: The latest report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriftReport"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/instance-groups/{id}/drift/check:
    parameters:
      - $ref: "#/components/parameters/GroupID"
    post:
      summary: Check a mirrored group for drift now
      description: >-
        Reads every enabled member now and answers with the new report, as GET /instance-groups/{id}/drift does.
        Needs drift.view on the group. It only reads, so it isn't audited.
      operationId: checkGroupDrift
      x-permission: target:drift.view
      responses:
        "200":
          description: The new report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriftReport"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/instance-groups/{id}/reconcile:
    parameters:
      - $ref: "#/components/parameters/GroupID"
    post:
      summary: Make a mirrored group's members match its primary
      description: >-
        Reads the primary and the members again, then changes the members to match the primary: what a member is
        missing is added, what differs is changed to the primary's settings (comment, Pi-hole groups by name, and
        whether it's enabled), and list entries and clients only a member has are deleted. Pi-hole groups are created
        and changed by name but never deleted; naming one that only a member has fails with not_reconcilable. A
        Pi-hole group an entry or client needs that the member doesn't have is created as part of it. `all` covers
        every difference on every enabled member; otherwise only the items named, on the members they name, are
        changed, and an item that no longer differs is reported with action none. Needs drift.reconcile on the group
        (not domains.edit or clients.edit). Members that can't be read are left alone and listed in `members`. The
        answer is 200 when every item worked and every member was read, and 207 otherwise; it carries the drift
        report after the reconcile. Audited as group_reconcile, one row per member, listing what was added, changed
        and deleted.
      operationId: reconcileGroup
      x-permission: target:drift.reconcile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReconcileInput"
      responses:
        "200":
          description: Every item worked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconcileResult"
        "207":
          description: Some items failed, or some members couldn't be read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconcileResult"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "502":
          $ref: "#/components/responses/TargetPiholeFailed"
        "503":
          $ref: "#/components/responses/SetupRequired"

