  /api/v1/targets/{target}/gravity:
    parameters:
      - $ref: "#/components/parameters/TargetID"
    post:
      summary: Start a gravity update
      description: >-
        Starts gravity on the instance, or on a mirrored group's members one at a time (the primary first, then the
        others by name), and answers at once with the run; poll it for progress. Through a group the run stops at the
        first member that fails or ends with no domains when it had some, and the rest are skipped; a member that
        can't be reached is skipped and the run goes on. Pi-hole keeps blocking with its old lists while gravity
        builds. Refused with 409 conflict while any instance the run would cover is already in a run started by this
        app (`details.instances` names them). Runs are kept in memory, so they are lost on a restart (the Pi-hole
        finishes a run anyway). Audited as gravity_start when it starts and gravity_run per instance as its part ends.
        Since v2.3.0.
      operationId: startGravity
      x-permission: target:gravity.run
      responses:
        "202":
          description: The run has started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GravityRun"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/SetupRequired"
    get:
      summary: The target's latest gravity run
      description: >-
        The latest run started through this target since the app started, running or finished, with the newest output
        lines after `after`. 404 if there hasn't been one. Since v2.3.0.
      operationId: getLatestGravity
      x-permission: target:lists.view
      parameters:
        - $ref: "#/components/parameters/GravityAfter"
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GravityRun"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/SetupRequired"
  /api/v1/targets/{target}/gravity/{run}:
    parameters:
      - $ref: "#/components/parameters/TargetID"
      - name: run
        in: path
        required: true
        schema:
          type: string
          pattern: "^[0-9a-f]{24}$"
    get:
      summary: A gravity run
      description: >-
        One run started through this target, with the newest output lines after `after`. 404 once it has been dropped
        (an hour after it ends, unless it is the target's latest) or after a restart. Since v2.3.0.
      operationId: getGravityRun
      x-permission: target:lists.view
      parameters:
        - $ref: "#/components/parameters/GravityAfter"
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GravityRun"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/SetupRequired"
  /api/v1/targets/{target}/local-dns:
    parameters:
      - $ref: "#/components/parameters/TargetID"
    get:
      summary: Local DNS records and CNAMEs
      description: >-
        The Pi-hole's local DNS records (dns.hosts) and CNAMEs (dns.cnameRecords), each with its key, its fields as
        read, marks for an entry the app couldn't have written, and its latest reason from the audit log. `instances`
        says, per instance, whether the app can change them: Pi-hole only lets the app's password change config while
        webserver.api.app_sudo is on. For a mirrored group the records are the primary's, every member is read for
        `instances`, and a primary that can't be read fails the request. Reading isn't audited. Since v2.4.0.
      operationId: listLocalDNS
      x-permission: target:localdns.view
      responses:
        "200":
          description: The records and CNAMEs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalDNS"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/TargetUnavailable"
        "502":
          $ref: "#/components/responses/TargetPiholeFailed"
        "503":
          $ref: "#/components/responses/SetupRequired"
  /api/v1/targets/{target}/local-dns/records:
    parameters:
      - $ref: "#/components/parameters/TargetID"
    post:
      summary: Add a local DNS record
      description: >-
        Adds the host record `<ip> <hostname>`, with the address in its canonical form and the hostname lowercased. A
        record the instance already has (by key) is a 409 conflict for an instance target; a member of a mirrored
        group that has it is ok with `already_present`. A hostname that is, or falls under, a directory domain answers
        409 confirmation_required until `confirm=true`. `reason` is required while the general setting
        `localdns_reason_required` is on. Answers with a result per instance. Audited as dnsrecord_add.
      operationId: addDNSRecord
      x-permission: target:localdns.edit
      parameters:
        - $ref: "#/components/parameters/Members"
        - $ref: "#/components/parameters/Confirm"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DNSRecordInput"
      responses:
        "200":
          description: Every instance succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalDNSWriteResults"
        "207":
          description: >-
            The instances' results differ: some succeeded and some didn't, or (for a CNAME) a member's failure stopped
            the write before the rest were reached. Only a mirrored group, which has several members, can answer this.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalDNSWriteResults"
        "400":
          $ref: "#/components/responses/InvalidOrRejected"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/LocalDNSConflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "502":
          $ref: "#/components/responses/TargetPiholeFailed"
        "503":
          $ref: "#/components/responses/SetupRequired"
    patch:
      summary: Change a local DNS record
      description: >-
        Replaces the record `from` names (by its fields or by `value`, Pi-hole's string as read) with `to`: the new
        record is added, then the old one deleted, since Pi-hole has no edit. If the delete fails, that instance's
        result is failed with `added` true: the new record is in place and the old one is still there. A `to` with the
        same key as `from` changes nothing. Audited as dnsrecord_update.
      operationId: updateDNSRecord
      x-permission: target:localdns.edit
      parameters:
        - $ref: "#/components/parameters/Members"
        - $ref: "#/components/parameters/Confirm"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DNSRecordUpdate"
      responses:
        "200":
          description: Every instance succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalDNSWriteResults"
        "207":
          description: >-
            The instances' results differ: some succeeded and some didn't, or (for a CNAME) a member's failure stopped
            the write before the rest were reached. Only a mirrored group, which has several members, can answer this.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalDNSWriteResults"
        "400":
          $ref: "#/components/responses/InvalidOrRejected"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/LocalDNSConflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "502":
          $ref: "#/components/responses/TargetPiholeFailed"
        "503":
          $ref: "#/components/responses/SetupRequired"
    delete:
      summary: Delete a local DNS record
      description: >-
        Deletes the record `record` names, by its fields or by `value`. Every string on the instance with that key is
        deleted (Pi-hole matches strings exactly, so two spellings of one record can both be there). A record the
        target doesn't have is a 404; a member of a mirrored group without it is ok. Audited as dnsrecord_delete.
      operationId: deleteDNSRecord
      x-permission: target:localdns.edit
      parameters:
        - $ref: "#/components/parameters/Members"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DNSRecordDelete"
      responses:
        "200":
          description: Deleted on every instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalDNSWriteResults"
        "207":
          description: >-
            The instances' results differ: some succeeded and some didn't, or (for a CNAME) a member's failure stopped
            the write before the rest were reached. Only a mirrored group, which has several members, can answer this.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalDNSWriteResults"
        "400":
          $ref: "#/components/responses/InvalidOrRejected"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/LocalDNSConflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "502":
          $ref: "#/components/responses/TargetPiholeFailed"
        "503":
          $ref: "#/components/responses/SetupRequired"
  /api/v1/targets/{target}/local-dns/cnames:
    parameters:
      - $ref: "#/components/parameters/TargetID"
    post:
      summary: Add a CNAME
      description: >-
        Adds the CNAME `<alias>,<target>[,<ttl>]`, names lowercased. Pi-hole restarts its resolver for every CNAME
        change, so DNS doesn't answer for a moment; the answer comes once the instance is back (up to 15 seconds;
        `restart_pending` when it wasn't back in time). Through a mirrored group the members are written one at a
        time, the primary first, each waited for, so the group never restarts at once: a member that fails stops the
        write, and the rest are skipped with code stopped. Otherwise as for records. Audited as cname_add.
      operationId: addCNAME
      x-permission: target:localdns.edit
      parameters:
        - $ref: "#/components/parameters/Members"
        - $ref: "#/components/parameters/Confirm"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CNAMEInput"
      responses:
        "200":
          description: Every instance succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalDNSWriteResults"
        "207":
          description: >-
            The instances' results differ: some succeeded and some didn't, or (for a CNAME) a member's failure stopped
            the write before the rest were reached. Only a mirrored group, which has several members, can answer this.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalDNSWriteResults"
        "400":
          $ref: "#/components/responses/InvalidOrRejected"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/LocalDNSConflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "502":
          $ref: "#/components/responses/TargetPiholeFailed"
        "503":
          $ref: "#/components/responses/SetupRequired"
    patch:
      summary: Change a CNAME
      description: >-
        As for records: the new CNAME is added without a restart, then the old one deleted with one, so a change
        restarts the resolver once. If the delete fails, the resolver is restarted anyway so the new CNAME is served,
        and the result is failed with `added` true. Audited as cname_update.
      operationId: updateCNAME
      x-permission: target:localdns.edit
      parameters:
        - $ref: "#/components/parameters/Members"
        - $ref: "#/components/parameters/Confirm"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CNAMEUpdate"
      responses:
        "200":
          description: Every instance succeeded.
          content:
            application/json:
