    parameters:
      - $ref: "#/components/parameters/TargetID"
    get:
      summary: The target's schedules
      description: >-
        The schedules set on the target, each with its next edge, whether a window is open now, and each instance's
        result for its latest edge. For an instance, `from_groups` also lists the schedules on its mirrored group, which
        reach it too, when the caller holds schedules.manage on that group. Reading isn't audited. Since v2.5.0.
      operationId: listSchedules
      x-permission: target:schedules.manage
      responses:
        "200":
          description: The schedules.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleList"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/SetupRequired"
    post:
      summary: Add a schedule
      description: >-
        Saves a schedule on the target. Also needs blocking.toggle on the target for a blocking window, or
        piholegroups.edit for a group window, as you can't schedule what you can't do. A group window's Pi-hole group
        must exist on the instance, or the mirrored group's primary (which must answer), and can't be the Default
        group. A group window that would overlap an enabled one of the opposite kind for the same group, on an instance
        both reach, is 409 conflict. The schedule acts from its next edge: nothing is applied for a window already open.
