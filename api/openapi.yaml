    get:
      summary: Static DHCP leases
      description: >-
        The static leases (dhcp.hosts) of each instance the target names, each with its key, its fields as read and
        marks for an entry the app couldn't have written (those can be deleted, not changed). Through a mirrored group
        every enabled member is read and answered separately. Reading isn't audited. Since v2.7.0.
      operationId: listDHCPStaticLeases
      x-permission: target:dhcp.view
      responses:
        "200":
          description: The static leases per instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DHCPStaticLeases"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/TargetUnavailable"
        "502":
          $ref: "#/components/responses/TargetPiholeFailed"
        "503":
          $ref: "#/components/responses/SetupRequired"
    post:
      summary: Add a static lease
      description: >-
        Adds the static lease `<mac>,<ip>[,<hostname>]` with the MAC lowercase and the address canonical. It must not
        share its MAC or address with another static lease (409 conflict, with `details.field`). Pi-hole restarts DNS
        and DHCP to serve it, and the app waits for it to answer again; if it hasn't within 15 seconds the result has
        `restart_pending`. Instance targets only. Audited as dhcp_static_add. Since v2.7.0.
      operationId: addDHCPStaticLease
      x-permission: target:dhcp.edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DHCPStaticLeaseInput"
      responses:
        "200":
          description: The lease was added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DHCPWriteResults"
        "400":
          $ref: "#/components/responses/InvalidOrRejected"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/DHCPConflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "502":
          $ref: "#/components/responses/TargetPiholeFailed"
        "503":
          $ref: "#/components/responses/SetupRequired"
    patch:
      summary: Change a static lease
      description: >-
        Replaces the lease `from` names (by its MAC and address, or by `value`, Pi-hole's string as read) with `to`: the
        new one is added without a restart, then the old one deleted, so Pi-hole restarts once. If the delete fails the
        result is failed with `added` true: the new lease is in place and the old one is still there. A `to` that
        changes nothing sends nothing. `to` must not share its MAC or address with another static lease. A lease that
        isn't there is a 404. Instance targets only. Audited as dhcp_static_update. Since v2.7.0.
      operationId: updateDHCPStaticLease
      x-permission: target:dhcp.edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DHCPStaticLeaseUpdate"
      responses:
        "200":
          description: The lease was changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DHCPWriteResults"
        "400":
          $ref: "#/components/responses/InvalidOrRejected"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/DHCPConflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "502":
          $ref: "#/components/responses/TargetPiholeFailed"
        "503":
          $ref: "#/components/responses/SetupRequired"
    delete:
      summary: Delete a static lease
      description: >-
        Deletes every string of the static lease `lease` names, sending Pi-hole its own strings, never the request's
        text. Pi-hole restarts DNS and DHCP. A lease that isn't there is a 404. Instance targets only. Audited as
        dhcp_static_delete. Since v2.7.0.
      operationId: deleteDHCPStaticLease
      x-permission: target:dhcp.edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DHCPStaticLeaseDelete"
      responses:
        "200":
          description: The lease was deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DHCPWriteResults"
        "400":
          $ref: "#/components/responses/InvalidOrRejected"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/DHCPConflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "502":
          $ref: "#/components/responses/TargetPiholeFailed"
        "503":
          $ref: "#/components/responses/SetupRequired"
  /api/v1/targets/{target}/dhcp/settings:
    parameters:
      - $ref: "#/components/parameters/TargetID"
    patch:
      summary: Change the DHCP settings
      description: >-
        Changes the fields sent and leaves the rest. Pi-hole checks the settings as a whole once DHCP is on, so the
        app does too, on the result: start, end and router set and in one subnet, the router outside the range, start
        not after end, a contiguous netmask (empty is allowed: Pi-hole then guesses from the class of the start
        address), and a lease time of seconds or a number with m, h, d or w, from 2 minutes to 365 days. Values equal
        to the current ones aren't sent. One PATCH goes to Pi-hole, which restarts DNS and DHCP; the app waits for it
        to answer again, and the result has `restart_pending` if it hasn't within 15 seconds. Turning DHCP on or off,
        or changing start, end, router, netmask or ignore_unknown_clients, answers 409 confirmation_required with
        `details.summary` (the changes) until `confirm=true`; turning it on also lists in `details.other_active` any
        other enabled instance that already has DHCP on. A change that changes nothing sends nothing and isn't
        audited. Instance targets only. Audited as dhcp_settings_update with each changed setting's old and new
        value. Since v2.7.0.
      operationId: updateDHCPSettings
      x-permission: target:dhcp.config
      parameters:
        - $ref: "#/components/parameters/Confirm"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DHCPSettingsPatch"
      responses:
        "200":
          description: The settings were changed, or were already as asked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DHCPWriteResults"
        "400":
          $ref: "#/components/responses/InvalidOrRejected"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/DHCPConflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "502":
          $ref: "#/components/responses/TargetPiholeFailed"
        "503":
          $ref: "#/components/responses/SetupRequired"
  /api/v1/targets/{target}/queries:
    parameters:
      - $ref: "#/components/parameters/TargetID"
    get:
      summary: One page of the query log
      description: >-
        One page of the entries matching the filters, newest first, with every filter applied by Pi-hole. The first
        answer carries a `snapshot`; send it back with later pages so they show the same entries however many queries
        have arrived since, and leave it out for a new search. A member is read from Pi-hole's long-term database
        instead of its in-memory log (about the last 24 hours) when a time is given and the range starts before the
        oldest in-memory entry, or has no start; `source` says which was used. For a mirrored group, each member
        answering is read and the entries merged newest first, up to the newest 5,000 merged entries (`capped` when
        more match); `member` reads one member alone, with full paging.
      operationId: listQueries
      x-permission: target:querylog.view
      parameters:
        - name: page
          in: query
          description: The page, from 1. Default 1. A page past the last has no entries.
          schema:
            type: integer
            minimum: 1
            maximum: 1000000
        - name: page_size
          in: query
          description: Entries per page. Default 100.
          schema:
            type: integer
            enum: [25, 50, 100, 250]
        - name: snapshot
          in: query
          description: The `snapshot` of an earlier answer for the same search, so later pages stay stable.
          schema:
            type: string
            maxLength: 2048
        - name: from
          in: query
          description: Only entries at or after this time.
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          description: Only entries before this time; after `from`.
          schema:
            type: string
            format: date-time
        - name: domain
          in: query
          description: >-
            Keep entries whose domain contains this, ignoring case. Letters, digits, `.`, `-`, `_` and `*` (any run
            of characters).
          schema:
            type: string
            maxLength: 255
        - name: client
          in: query
          description: Keep entries whose client address or name contains this, ignoring case. As `domain`, plus `:`.
          schema:
            type: string
            maxLength: 255
        - name: status
          in: query
          description: Keep entries with this FTL status.
          schema:
            $ref: "#/components/schemas/QueryStatus"
        - name: type
          in: query
          description: Keep entries for this record type; OTHER is every type without a name of its own.
          schema:
            $ref: "#/components/schemas/QueryType"
        - name: result
          in: query
          description: Keep blocked entries, allowed ones (answered from the cache or forwarded), or cached ones.
          schema:
            type: string
            enum: [blocked, allowed, cached]
        - name: member
          in: query
          description: >-
            Mirrored groups only: read this member (an enabled member's instance ID) alone. A 400 for an instance
            target or an ID that isn't an enabled member.
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryLog"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/TargetUnavailable"
        "502":
          $ref: "#/components/responses/TargetPiholeFailed"
        "503":
          $ref: "#/components/responses/SetupRequired"

