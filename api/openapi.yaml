      description: >-
        The leases in dnsmasq's lease file, each naming its instance. Pi-hole reads the file whether or not DHCP is on,
        so an instance with DHCP off can show stale leases: for an instance target they are shown, with `active`
        false; through a mirrored group, a member with DHCP off has its leases left out (`included` false in
        `instances`). `*` in Pi-hole's name and client ID columns is read as absent. Reading isn't audited. Since v2.7.0.
