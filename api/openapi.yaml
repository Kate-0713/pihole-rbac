# API contract (spec-first). Every request/response shape is defined here before its handler.
# oapi-codegen generates internal/api/gen from this file: make generate / .\build.ps1 generate
openapi: 3.1.0
info:
  title: pihole-rbac
  version: 2.0.0-dev
  description: >-
    Every /api/v1 endpoint needs a session unless it says otherwise. Every state-changing request (POST, PUT, PATCH,
    DELETE) also needs the X-CSRF-Token header and an Origin (or Referer) matching the app's own origin, and a
    request body must be application/json. Failures use the Error envelope. Until first-run setup is complete, every
    /api/v1 endpoint except about, auth/csrf, setup/status and setup answers 503 with code setup_required.
  license:
    name: GNU Affero General Public License v3.0 or later
    identifier: AGPL-3.0-or-later

security:
  - session: []

paths:
  /healthz:
    get:
      summary: Liveness check
      description: Unauthenticated. Returns only "ok", for Docker health checks and the LXC updater.
      operationId: healthz
      security: []
      responses:
        "200":
          description: The server is up.
          content:
            text/plain:
              schema:
                type: string
                const: ok

  /api/v1/about:
    get:
      summary: Source code location and licence
      description: >-
        Unauthenticated, and available before first-run setup is complete, so every page (including login and setup)
        can show the source link that AGPL-3.0 section 13 requires. Deliberately carries no version number, so
        anonymous visitors can't tell which release is running.
      operationId: getAbout
      security: []
      responses:
        "200":
          description: Where to get the source of the running build, and its licence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/About"

  /api/v1/auth/csrf:
    get:
      summary: CSRF token for the current visitor
      description: >-
        Unauthenticated. Returns the token to send as X-CSRF-Token. For a logged-in visitor it is the session's token;
        otherwise it is bound to an anonymous cookie, which this call sets if the visitor doesn't have one yet. The
        login page calls this before POST /auth/login. An anonymous token stops working once the visitor logs in.
      operationId: getCSRFToken
      security: []
      responses:
        "200":
          description: The token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CSRFToken"

  /api/v1/setup/status:
    get:
      summary: Whether first-run setup is still needed
      description: Unauthenticated and available before setup. The SPA calls it to decide whether to show the setup page.
      operationId: getSetupStatus
      security: []
      responses:
        "200":
          description: The setup state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"

  /api/v1/setup:
    post:
      summary: Complete first-run setup
      description: >-
        Unauthenticated, but needs the anonymous CSRF token from GET /auth/csrf. Checks the one-time setup token
        printed to the log at startup (or by `pihole-rbac setup --print-token`), creates the first local admin with
        the builtin admin role and the starter roles staff and reader, closes setup for good, and logs the new admin
        in. The response is the new session, as for POST /auth/login. Wrong tokens count against the client
        address's failed-login limit.
      operationId: completeSetup
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "200":
          description: Setup complete; logged in as the new admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentSession"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          description: The setup token is wrong or has expired (code invalid_setup_token).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Setup is already complete (code setup_complete).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/login:
    post:
      summary: Log in
      description: >-
        Unauthenticated, but needs the anonymous CSRF token from GET /auth/csrf. Tries the enabled login methods in
        order. On success, sets the session cookie (replacing any previous session) and returns the new session,
        including its CSRF token. Failed attempts are limited per client address and per username; while a limit
        applies, attempts are refused with 429 without checking the credentials.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentSession"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          description: Wrong username or password (code invalid_credentials). Doesn't say which.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >-
            The credentials were correct but the user has no role in this app (code no_access), or the CSRF or
            Origin check failed (code csrf_failed).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/auth/logout:
    post:
      summary: Log out
      description: Ends the current session and clears the session cookie.
      operationId: logout
      x-permission: session
      responses:
        "204":
          description: Logged out.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/auth/session:
    get:
      summary: The current session
      description: >-
        Returns the logged-in user, the session's CSRF token and the user's permissions, or 401 when there is no
        session. The SPA calls this on load.
      operationId: getSession
      x-permission: session
      responses:
        "200":
          description: The current session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentSession"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/system/secrets:
    get:
      summary: List the secrets
      description: >-
        Every known secret with whether it is set and where it came from. Never the values. Instances in the
        database whose password variable doesn't exist are listed as not set.
      operationId: listSecrets
      x-permission: config.reload
      responses:
        "200":
          description: The secrets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/system/reload:
    post:
      summary: Reload the secrets
      description: >-
        Re-reads every secret that was given as a *_FILE variable. Plain environment variables only change on a
        restart. A secret that fails to load keeps its previous value and is listed in `failed`; the response is 200
        either way.
      operationId: reloadSecrets
      x-permission: config.reload
      responses:
        "200":
          description: What the reload changed and what failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReloadResult"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/targets:
    get:
      summary: The instances the user can act on
      description: >-
        Every enabled instance where the user holds at least one permission, by name, with its health. Mirrored groups
        will be listed here too once they exist. The health comes from the server's own calls and a periodic check of
        idle instances; it is held in memory, so it starts as unknown after a restart.
      operationId: listTargets
      x-permission: session
      responses:
        "200":
          description: The targets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TargetList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/instances:
    get:
      summary: List the Pi-hole instances
      description: Every instance, by name, with its settings, whether its password variable is set, and its health.
      operationId: listInstances
      x-permission: instances.manage
      responses:
        "200":
          description: The instances.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/SetupRequired"
    post:
      summary: Add a Pi-hole instance
      description: >-
        Creates the instance disabled. Its app password is either stored, encrypted under the master key, from
        `password`, or read from PIHOLE_RBAC_INSTANCE_<env_name>_PASSWORD (or _FILE), which overrides a stored one.
        A password is only sent to an address it was confirmed for: if the instance's variable is already set,
        `password` is required and must match it. Enable the instance once it has a password.
      operationId: createInstance
      x-permission: instances.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstanceInput"
      responses:
        "201":
          description: The new instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/instances/{id}:
    parameters:
      - $ref: "#/components/parameters/InstanceID"
    get:
      summary: One Pi-hole instance
      operationId: getInstance
      x-permission: instances.manage
      responses:
        "200":
          description: The instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/SetupRequired"
    put:
      summary: Change a Pi-hole instance's settings
      description: >-
        Replaces the settings, and stores `password` when given. A password is only sent to an address it was
        confirmed for, so `password` is required (code validation_failed, `details.field` password) when the base
        URL, TLS mode or CA file of an instance that has a password changes, or when the instance starts using a
        variable that is set; it must match the variable when one is set. If the instance is enabled and the change
        affects how it connects (base URL, TLS settings, env name or password), the new settings must pass a
        connection test first, or the change is refused; disable the instance to save settings that don't work yet.
        A rename keeps the instance's Pi-hole session.
      operationId: updateInstance
      x-permission: instances.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstanceInput"
      responses:
        "200":
          description: The instance as saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/InstanceConflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "502":
          $ref: "#/components/responses/PiholeFailed"
        "503":
          $ref: "#/components/responses/SetupRequired"
    delete:
      summary: Delete a Pi-hole instance
      description: >-
        Refused with 409 while a role grant, an instance group or a client-reset target refers to the instance; the
        message lists them, and `details` has `roles`, `groups` and `client_reset_targets`.
      operationId: deleteInstance
      x-permission: instances.manage
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/instances/{id}/password:
    parameters:
      - $ref: "#/components/parameters/InstanceID"
    put:
      summary: Store a new app password for a Pi-hole instance
      description: >-
        Stores the password encrypted under the master key, as when the Pi-hole's password is rotated. If the
        instance is enabled, the password must pass a connection test at its current address first, or nothing is
        changed. Refused with 409 conflict when the instance's variable is set (it overrides a stored password) or
        when no master key is set. The password is never returned.
      operationId: setInstancePassword
      x-permission: instances.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstancePassword"
      responses:
        "200":
          description: The instance, with its new password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/InstanceConflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "502":
          $ref: "#/components/responses/PiholeFailed"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/instances/{id}/test:
    parameters:
      - $ref: "#/components/parameters/InstanceID"
    post:
      summary: Test the connection to a Pi-hole instance
      description: >-
        Logs in to the Pi-hole with the stored settings and the current password, reads the blocking status and logs
        out, without changing anything. Works on disabled instances. A failed test is still a 200, with `ok` false.
      operationId: testInstance
      x-permission: instances.manage
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceTestResult"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/instances/{id}/enable:
    parameters:
      - $ref: "#/components/parameters/InstanceID"
    post:
      summary: Enable a Pi-hole instance
      description: >-
        Runs a connection test with the stored settings and enables the instance only if it passes. Enabling an
        enabled instance changes nothing.
      operationId: enableInstance
      x-permission: instances.manage
      responses:
        "200":
          description: The instance, now enabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/InstanceConflict"
        "502":
          $ref: "#/components/responses/PiholeFailed"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/instances/{id}/disable:
    parameters:
      - $ref: "#/components/parameters/InstanceID"
    post:
      summary: Disable a Pi-hole instance
      description: Stops all calls to the instance and logs its client out of the Pi-hole. Disabling a disabled instance changes nothing.
      operationId: disableInstance
      x-permission: instances.manage
      responses:
        "200":
          description: The instance, now disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/roles:
    get:
      summary: List the roles
      description: >-
        Every role with its grants, the local users that hold it and the LDAP groups mapped to it, sorted by name.
        Readable with users.manage as well as roles.manage, so someone who manages users can see which roles they can
        assign.
      operationId: listRoles
      x-permission: roles.manage|users.manage
      responses:
        "200":
          description: The roles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/SetupRequired"
    post:
      summary: Create a role
      description: >-
        Creates a role with the given grants. Every grant must be one the caller holds (no privilege escalation), and
        its scope one its permission allows.
      operationId: createRole
      x-permission: roles.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleCreate"
      responses:
        "201":
          description: The new role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/RoleConflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/roles/catalogue:
    get:
      summary: What grants can name
      description: >-
        The permission catalogue, with the scopes each permission can be granted at, and the instances and instance
        groups a grant's scope can name. For the grant editor.
      operationId: getRoleCatalogue
      x-permission: roles.manage
      responses:
        "200":
          description: The catalogue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleCatalogue"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/roles/{id}:
    parameters:
      - $ref: "#/components/parameters/RoleID"
    get:
      summary: One role
      operationId: getRole
      x-permission: roles.manage|users.manage
      responses:
        "200":
          description: The role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/SetupRequired"
    put:
      summary: Rename a role or change its description
      description: >-
        Needs every grant the role has. The builtin admin role can't be changed (code invariant_violated).
      operationId: updateRole
      x-permission: roles.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleInput"
      responses:
        "200":
          description: The role as saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/RoleConflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "503":
          $ref: "#/components/responses/SetupRequired"
    delete:
      summary: Delete a role
      description: >-
        Needs every grant the role has. Refused (code invariant_violated) for the builtin admin role and for a role
        that local users or LDAP mappings still use; `details` then has `users` and `ldap_groups`.
      operationId: deleteRole
      x-permission: roles.manage
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/RoleConflict"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/roles/{id}/grants:
    parameters:
      - $ref: "#/components/parameters/RoleID"
    put:
      summary: Replace a role's grants
      description: >-
        Replaces every grant of the role. The caller must hold every grant the role has before and after the change.
        If the change would take away the caller's own last route to roles.manage or users.manage, it is refused with
        code confirmation_required and `details.would_lose`, and goes ahead when repeated with `confirm=true`.
        Sessions need nothing: permissions are worked out on every request.
      operationId: setRoleGrants
      x-permission: roles.manage
      parameters:
        - $ref: "#/components/parameters/Confirm"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrantsInput"
      responses:
        "200":
          description: The role with its new grants.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/RoleConflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/targets/{target}/summary:
    parameters:
      - $ref: "#/components/parameters/TargetID"
    get:
      summary: Dashboard figures for a target
      description: >-
        The blocking status, totals for the last 24 hours from Pi-hole's long-term database, and the live counters
        since FTL last started. Needs any permission on the target. If any part can't be read, the whole request
        fails.
      operationId: getTargetSummary
      x-permission: target:any
      responses:
        "200":
          description: The figures.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TargetSummary"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/TargetUnavailable"
        "502":
          $ref: "#/components/responses/TargetPiholeFailed"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/targets/{target}/blocking:
    parameters:
      - $ref: "#/components/parameters/TargetID"
    get:
      summary: Whether blocking is on
      description: Needs any permission on the target.
      operationId: getBlocking
      x-permission: target:any
      responses:
        "200":
          description: The blocking status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockingStatus"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/TargetUnavailable"
        "502":
          $ref: "#/components/responses/TargetPiholeFailed"
        "503":
          $ref: "#/components/responses/SetupRequired"
    put:
      summary: Turn blocking on or off
      description: >-
        Sets blocking to the given state; setting the state it already has is allowed. With `timer`, which needs
        `enabled` false, Pi-hole turns blocking back on after that many seconds. Answers with a result per instance
        (see WriteResults under the schemas). Audited as blocking_set.
      operationId: setBlocking
      x-permission: target:blocking.toggle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlockingInput"
      responses:
        "200":
          description: Every instance succeeded; each result has the blocking status after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockingWriteResults"
        "207":
          description: >-
            The instances' results differ: some succeeded and some didn't. Only a mirrored group, which has several
            members, can answer this.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockingWriteResults"
        "400":
          $ref: "#/components/responses/InvalidOrRejected"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/TargetUnavailable"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "502":
          $ref: "#/components/responses/TargetPiholeFailed"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/targets/{target}/dns/restart:
    parameters:
      - $ref: "#/components/parameters/TargetID"
    post:
      summary: Restart Pi-hole's DNS resolver
      description: >-
        Checks that the Pi-hole is reachable, then asks it to restart its resolver. The API goes down with the
        resolver, so a connection that drops during the restart is an ok result with `confirmed` false rather than a
        failure. Answers with a result per instance (see WriteResults under the schemas). Audited as dns_restart.
      operationId: restartDNS
      x-permission: target:dns.restart
      responses:
        "200":
          description: The restart was requested on every instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DNSRestartResults"
        "207":
          description: >-
            The instances' results differ: some succeeded and some didn't. Only a mirrored group, which has several
            members, can answer this.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DNSRestartResults"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/TargetUnavailable"
        "502":
          $ref: "#/components/responses/TargetPiholeFailed"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/targets/{target}/domains:
    parameters:
      - $ref: "#/components/parameters/TargetID"
    get:
      summary: The allow and deny lists
      description: Every entry, unpaged, since Pi-hole returns the lists whole.
      operationId: listDomains
      x-permission: target:domains.view
      responses:
        "200":
          description: The entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainList"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/TargetUnavailable"
        "502":
          $ref: "#/components/responses/TargetPiholeFailed"
        "503":
          $ref: "#/components/responses/SetupRequired"
    post:
      summary: Add a domain to a list
      description: >-
        Adds an enabled entry. The groups must exist on the Pi-hole. Without `groups`, the entry goes in the Default
        group (ID 0), as in Pi-hole's own interface; an empty list puts it in no group. Pi-hole refusing the entry
        (already on that list, or not a valid domain or regex) is a pihole_rejected failure. Answers with a result
        per instance (see WriteResults under the schemas). Audited as domain_add.
      operationId: addDomain
      x-permission: target:domains.edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DomainInput"
      responses:
        "200":
          description: Every instance succeeded; each result has the entry as saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainWriteResults"
        "207":
          description: >-
            The instances' results differ: some succeeded and some didn't. Only a mirrored group, which has several
            members, can answer this.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainWriteResults"
        "400":
          $ref: "#/components/responses/InvalidOrRejected"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/TargetUnavailable"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "502":
          $ref: "#/components/responses/TargetPiholeFailed"
        "503":
          $ref: "#/components/responses/SetupRequired"
    patch:
      summary: Change a list entry's groups or comment
      description: >-
        The body names the entry by domain, type and kind, which must match it exactly, and gives the fields to
        change; fields left out keep their value, and so does whether the entry is enabled. An entry that doesn't
        exist is a 404: it is never created. Answers with a result per instance (see WriteResults under the schemas).
        Audited as domain_update, with the groups before and after.
      operationId: updateDomain
      x-permission: target:domains.edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DomainUpdate"
      responses:
        "200":
          description: Every instance succeeded; each result has the entry as saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainWriteResults"
        "207":
          description: >-
            The instances' results differ: some succeeded and some didn't. Only a mirrored group, which has several
            members, can answer this.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainWriteResults"
        "400":
          $ref: "#/components/responses/InvalidOrRejected"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/TargetUnavailable"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "502":
          $ref: "#/components/responses/TargetPiholeFailed"
        "503":
          $ref: "#/components/responses/SetupRequired"
    delete:
      summary: Delete a list entry
      description: >-
        The body names the entry by domain, type and kind, which must match it exactly. An entry that doesn't exist
        is a 404. Answers with a result per instance (see WriteResults under the schemas). Audited as domain_delete,
        with the entry's groups and comment.
      operationId: deleteDomain
      x-permission: target:domains.edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DomainKey"
      responses:
        "200":
          description: Deleted on every instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResults"
        "207":
          description: >-
            The instances' results differ: some succeeded and some didn't. Only a mirrored group, which has several
            members, can answer this.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResults"
        "400":
          $ref: "#/components/responses/InvalidOrRejected"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/TargetUnavailable"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "502":
          $ref: "#/components/responses/TargetPiholeFailed"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/targets/{target}/clients:
    parameters:
      - $ref: "#/components/parameters/TargetID"
    get:
      summary: The configured clients
      description: Every client, unpaged, since Pi-hole returns the list whole.
      operationId: listClients
      x-permission: target:clients.view
      responses:
        "200":
          description: The clients.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientList"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/TargetUnavailable"
        "502":
          $ref: "#/components/responses/TargetPiholeFailed"
        "503":
          $ref: "#/components/responses/SetupRequired"
    patch:
      summary: Change a client's groups or comment
      description: >-
        The body names the client by its identifier, which must match exactly, and gives the fields to change;
        fields left out keep their value. A client that doesn't exist is a 404: it is never created. Answers with a
        result per instance (see WriteResults under the schemas). Audited as client_update, with the groups before
        and after.
      operationId: updateClient
      x-permission: target:clients.edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientUpdate"
      responses:
        "200":
          description: Every instance succeeded; each result has the client as saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientWriteResults"
        "207":
          description: >-
            The instances' results differ: some succeeded and some didn't. Only a mirrored group, which has several
            members, can answer this.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientWriteResults"
        "400":
          $ref: "#/components/responses/InvalidOrRejected"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/TargetUnavailable"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "502":
          $ref: "#/components/responses/TargetPiholeFailed"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/targets/{target}/groups:
    parameters:
      - $ref: "#/components/parameters/TargetID"
    get:
      summary: The Pi-hole's groups
      description: >-
        Pi-hole's own groups (not instance groups), so group IDs on domains and clients can be shown by name. Needs
        any permission on the target.
      operationId: listPiholeGroups
      x-permission: target:any
      responses:
        "200":
          description: The groups.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PiholeGroupList"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/TargetUnavailable"
        "502":
          $ref: "#/components/responses/TargetPiholeFailed"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/targets/{target}/queries:
    parameters:
      - $ref: "#/components/parameters/TargetID"
    get:
      summary: The newest entries of the query log
      description: >-
        Reads the newest `length` entries, newest first, then keeps those matching the filters, so a filtered result
        can hold fewer than `length` entries.
      operationId: listQueries
      x-permission: target:querylog.view
      parameters:
        - name: length
          in: query
          description: How many of the newest entries to read, 1 to 1000. Default 100.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
        - name: domain
          in: query
          description: Keep entries whose domain contains this, ignoring case.
          schema:
            type: string
            maxLength: 255
        - name: client
          in: query
          description: Keep entries whose client address or name contains this, ignoring case.
          schema:
            type: string
            maxLength: 255
      responses:
        "200":
          description: The entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryLog"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/TargetUnavailable"
        "502":
          $ref: "#/components/responses/TargetPiholeFailed"
        "503":
          $ref: "#/components/responses/SetupRequired"

components:
  parameters:
    InstanceID:
      name: id
      in: path
      required: true
      description: The instance's ID.
      schema:
        type: integer
        format: int64
        minimum: 1

    RoleID:
      name: id
      in: path
      required: true
      description: The role's ID.
      schema:
        type: integer
        format: int64
        minimum: 1

    Confirm:
      name: confirm
      in: query
      required: false
      description: >-
        Go ahead with a change that answered 409 confirmation_required: one that would take away the caller's own
        roles.manage or users.manage, or disable or delete their own account.
      schema:
        type: boolean
        default: false

    TargetID:
      name: target
      in: path
      required: true
      description: >-
        `i-<instance id>` for one instance. `g-<group id>` (a mirrored group) is a 404 until mirrored groups are
        built.
      schema:
        type: string
        pattern: "^[ig]-[1-9][0-9]*$"
        examples: ["i-1"]

  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: pihole_rbac_session

  responses:
    Unauthenticated:
      description: No valid session (code unauthenticated).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: >-
        Not allowed (code forbidden, with `details.permission` naming the missing permission), or the CSRF or Origin
        check failed on a state-changing request (code csrf_failed).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationFailed:
      description: The request body is malformed or a field is invalid (code validation_failed).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnsupportedMediaType:
      description: The request body isn't application/json (code unsupported_media_type).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SetupRequired:
      description: First-run setup hasn't been completed yet (code setup_required).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No such resource (code not_found).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The change conflicts with existing data (code conflict); the message says how.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InstanceConflict:
      description: >-
        The change conflicts with existing data or with a change made at the same time (code conflict), or the
        connection test couldn't run: the password variable isn't set (code instance_password_missing) or the settings
        can't be used (code instance_misconfigured). `details.instance` names the instance for the last two.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RoleConflict:
      description: >-
        The change conflicts with existing data, such as a name already taken (code conflict); it would break an
        invariant, such as changing the builtin admin role or deleting a role in use (code invariant_violated); or it
        would take away the caller's own roles.manage or users.manage and needs `confirm=true` (code
        confirmation_required, with `details.would_lose`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PiholeFailed:
      description: >-
        The connection test failed (code pihole_unreachable, pihole_auth_rejected or pihole_status_error), so nothing
        was changed. `details.instance` names the instance and `details.detail` has the underlying error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidOrRejected:
      description: >-
        A field is invalid (code validation_failed), or the Pi-hole refused the request's content (code
        pihole_rejected): a duplicate entry, say, or a domain it doesn't accept. For pihole_rejected,
        `details.instance` names the instance and `details.pihole_message` has Pi-hole's reason, which is Pi-hole's
        text: show it as text. On a write, a pihole_rejected answer means no instance succeeded, and `details.results`
        has the result per instance, in the shape of the 200 response's `results`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TargetUnavailable:
      description: >-
        The instance can't be used: its password variable isn't set (code instance_password_missing) or its settings
        can't be used (code instance_misconfigured). `details.instance` names it. On a write, this answer means no instance
        succeeded, and `details.results` has the result per instance, in the shape of the 200 response's `results`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TargetPiholeFailed:
      description: >-
        The Pi-hole didn't respond (code pihole_unreachable), refused the app password (code pihole_auth_rejected)
        or answered unexpectedly (code pihole_status_error). `details.instance` names the instance. The underlying
        error goes to the server log only. On a write, this answer means no instance
        succeeded, and `details.results` has the result per instance, in the shape of the 200 response's `results`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Too many failed attempts (code rate_limited). Retry after the given number of seconds.
      headers:
        Retry-After:
          description: Seconds until another attempt is allowed.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    About:
      type: object
      additionalProperties: false
      required: [source_url, license]
      properties:
        source_url:
          type: string
          format: uri
          description: Where the source code of the running build can be obtained.
          examples: ["https://github.com/Kate-0713/pihole-rbac"]
        license:
          type: string
          description: SPDX licence identifier.
          examples: ["AGPL-3.0-or-later"]

    SetupStatus:
      type: object
      additionalProperties: false
      required: [setup_required]
      properties:
        setup_required:
          type: boolean
          description: True until the first admin has been created.

    SetupRequest:
      type: object
      additionalProperties: false
      required: [token, username, password]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 256
          description: The one-time setup token. Surrounding spaces are ignored.
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: >-
            The first admin's username: 1-64 lowercase letters, digits, '.', '_' or '-', starting with a letter or
            digit. Uppercase is folded to lowercase.
        password:
          type: string
          minLength: 12
          maxLength: 72
          description: At least 12 characters and at most 72 bytes.

    CSRFToken:
      type: object
      additionalProperties: false
      required: [csrf_token]
      properties:
        csrf_token:
          type: string
          description: Send as the X-CSRF-Token header on every state-changing request.

    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 256
          description: Case-insensitive; surrounding spaces are ignored.
        password:
          type: string
          minLength: 1
          maxLength: 1024

    SessionUser:
      type: object
      additionalProperties: false
      required: [id, username, source]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        source:
          type: string
          enum: [local, ldap]

    CurrentSession:
      type: object
      additionalProperties: false
      required: [user, public_id, expires_at, csrf_token, permissions]
      properties:
        user:
          $ref: "#/components/schemas/SessionUser"
        public_id:
          type: string
          description: Identifies this session in the sessions list and the audit log. Can't be used to authenticate.
        expires_at:
          type: string
          format: date-time
          description: When the session ends at the latest. It also ends after a period without requests.
        csrf_token:
          type: string
          description: Send as the X-CSRF-Token header on every state-changing request.
        permissions:
          $ref: "#/components/schemas/Permissions"

    Permissions:
      type: object
      additionalProperties: false
      required: [global, targets]
      description: >-
        What the user may do, worked out by the server from their roles and the current groups. The server checks
        every request again; this is for the UI.
      properties:
        global:
          type: array
          items:
            type: string
          description: The global permissions the user holds, sorted.
        targets:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: >-
            By target (`i-<instance id>` or `g-<mirrored group id>`): the permissions the user holds there, sorted.
            Lists every instance and mirrored group where the user holds at least one.
          examples:
            - { "i-1": ["domains.view"], "g-2": ["domains.view", "drift.view"] }

    SecretList:
      type: object
      additionalProperties: false
      required: [secrets]
      properties:
        secrets:
          type: array
          items:
            $ref: "#/components/schemas/SecretStatus"

    SecretStatus:
      type: object
      additionalProperties: false
      required: [name, kind, set]
      properties:
        name:
          type: string
          description: The environment variable, without a _FILE suffix.
        kind:
          type: string
          enum: [master_key, session_key, ldap_bind_password, instance_password, channel_secret]
        set:
          type: boolean
        source:
          type: string
          enum: [env, file, generated]
          description: Where the value came from. Absent when the secret isn't set. Only `file` can change on a reload.

    ReloadResult:
      type: object
      additionalProperties: false
      required: [changed, failed, session_ended]
      properties:
        changed:
          type: array
          items:
            type: string
          description: Variables whose value changed.
        failed:
          type: array
          items:
            $ref: "#/components/schemas/ReloadFailure"
        session_ended:
          type: boolean
          description: True when the session key changed, which ends every session including the caller's.

    ReloadFailure:
      type: object
      additionalProperties: false
      required: [name, message]
      properties:
        name:
          type: string
        message:
          type: string
          description: Why the secret couldn't be loaded. Never contains the value.

    TargetList:
      type: object
      additionalProperties: false
      required: [targets]
      properties:
        targets:
          type: array
          items:
            $ref: "#/components/schemas/Target"

    Target:
      type: object
      additionalProperties: false
      required: [id, kind, name]
      properties:
        id:
          type: string
          description: The target as used in URLs and the session's permissions, `i-<instance id>` or `g-<group id>`.
          examples: ["i-1"]
        kind:
          type: string
          enum: [instance, group]
        name:
          type: string
        health:
          $ref: "#/components/schemas/InstanceHealth"

    InstanceInput:
      type: object
      additionalProperties: false
      required: [name, base_url]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: Unique, ignoring case. Surrounding spaces are ignored.
        base_url:
          type: string
          maxLength: 2048
          description: >-
            http:// or https:// with a host and optional port; no username, password, query or fragment. A path prefix
            is allowed, but not one ending in /admin or /api. Stored without a trailing slash.
          examples: ["https://pihole1.lan"]
        env_name:
          type: string
          maxLength: 64
          pattern: "^[A-Z0-9_]*$"
          description: >-
            Optional. Names a variable, PIHOLE_RBAC_INSTANCE_<env_name>_PASSWORD, whose password overrides the stored
            one when it is set. Unique. Empty or absent means none.
          examples: ["PIHOLE1"]
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 1024
          description: >-
            The Pi-hole app password, used exactly as given. Stored encrypted (it needs the master key), or, when the
            instance's variable is set, checked against it. Required to confirm a new address or a newly used
            variable. Never returned.
        tls_mode:
          type: string
          enum: [verify, insecure]
          description: How the Pi-hole's certificate is checked. verify if absent; insecure is for labs only.
        ca_file:
          type: string
          maxLength: 4096
          description: >-
            Absolute path, on the server, of an extra CA bundle (PEM) to trust. Only with tls_mode verify and an
            https:// base URL. Checked when saved.

    Instance:
      type: object
      additionalProperties: false
      required: [id, name, base_url, tls_mode, enabled, created_at, password_source, password_set]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        base_url:
          type: string
        env_name:
          type: string
          description: Absent when the instance has none.
        tls_mode:
          type: string
          enum: [verify, insecure]
        ca_file:
          type: string
          description: Absent when no CA file is set.
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        password_variable:
          type: string
          description: >-
            The variable whose password overrides the stored one (or its _FILE form). Absent when the instance has no
            env name.
          examples: ["PIHOLE_RBAC_INSTANCE_PIHOLE1_PASSWORD"]
        password_source:
          type: string
          enum: [environment, stored, none]
          description: >-
            Where the password comes from: the variable (set when the server started or last reloaded its secrets),
            the database, or nowhere yet.
        password_set:
          type: boolean
          description: Whether the instance has a password, from either source.
        password_updated_at:
          type: string
          format: date-time
          description: When the stored password was last set. Absent when none is stored.
        password_updated_by:
          type: string
          description: Who last set the stored password. Absent when none is stored.
        health:
          $ref: "#/components/schemas/InstanceHealth"

    InstanceList:
      type: object
      additionalProperties: false
      required: [instances, can_store_passwords]
      properties:
        can_store_passwords:
          type: boolean
          description: Whether a master key is set, without which passwords can't be stored.
        instances:
          type: array
          items:
            $ref: "#/components/schemas/Instance"

    InstancePassword:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 1024
          description: The new Pi-hole app password, used exactly as given.

    InstanceHealth:
      type: object
      additionalProperties: false
      required: [state]
      description: Present only for enabled instances.
      properties:
        state:
          type: string
          enum: [unknown, up, down]
          description: >-
            unknown until the first call; up when Pi-hole last answered with the password accepted; down when it was
            unreachable or refused the password, or the password or settings can't be used.
        last_success:
          type: string
          format: date-time
        last_failure:
          type: string
          format: date-time
        last_error:
          type: string
          description: The error code of the last failure, kept after a later success.

    InstanceTestResult:
      type: object
      additionalProperties: false
      required: [ok]
      properties:
        ok:
          type: boolean
        error:
          $ref: "#/components/schemas/InstanceTestError"

    InstanceTestError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum: [pihole_unreachable, pihole_auth_rejected, pihole_status_error, instance_password_missing, instance_misconfigured]
        message:
          type: string
          description: What went wrong, for the admin.
        detail:
          type: string
          description: The underlying error, such as a TLS or connection error. Never contains the password.

    Grant:
      type: object
      additionalProperties: false
      required: [permission, scope]
      description: One permission within one scope.
      properties:
        permission:
          type: string
          description: A permission from the catalogue.
          examples: ["domains.edit"]
        scope:
          type: string
          enum: [all, group, instance]
        id:
          type: integer
          format: int64
          description: The instance or group, for scope instance or group. Absent for scope all.

    RoleInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: Unique, ignoring case. Surrounding spaces are ignored.
        description:
          type: string
          maxLength: 500

    RoleCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: Unique, ignoring case. Surrounding spaces are ignored.
        description:
          type: string
          maxLength: 500
        grants:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/Grant"

    GrantsInput:
      type: object
      additionalProperties: false
      required: [grants]
      properties:
        grants:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/Grant"

    Role:
      type: object
      additionalProperties: false
      required: [id, name, description, builtin, created_at, grants, users, ldap_groups, manageable]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        builtin:
          type: boolean
          description: The builtin admin role, which can't be changed or deleted.
        created_at:
          type: string
          format: date-time
        grants:
          type: array
          description: Sorted by permission, then scope.
          items:
            $ref: "#/components/schemas/Grant"
        users:
          type: array
          description: The local users who hold the role, by username.
          items:
            type: string
        ldap_groups:
          type: array
          description: The LDAP group DNs mapped to the role, as entered.
          items:
            type: string
        manageable:
          type: boolean
          description: >-
            Whether the caller holds every grant of the role, and so may give it to users, change it (unless it is
            builtin) or delete it. The server checks again on each change.

    RoleList:
      type: object
      additionalProperties: false
      required: [roles]
      properties:
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"

    RoleCatalogue:
      type: object
      additionalProperties: false
      required: [permissions, instances, groups]
      properties:
        permissions:
          type: array
          description: In the catalogue's order.
          items:
            $ref: "#/components/schemas/PermissionInfo"
        instances:
          type: array
          description: Every instance, enabled or not, sorted by name.
          items:
            $ref: "#/components/schemas/ScopeName"
        groups:
          type: array
          description: Every instance group, sorted by name.
          items:
            $ref: "#/components/schemas/GroupScopeName"

    PermissionInfo:
      type: object
      additionalProperties: false
      required: [name, class, description]
      properties:
        name:
          type: string
        class:
          type: string
          enum: [instance, group, global]
          description: >-
            instance permissions can be granted at scope all, on any group or on one instance; group permissions at
            scope all or on a mirrored group; global permissions at scope all only.
        description:
          type: string

    ScopeName:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string

    GroupScopeName:
      type: object
      additionalProperties: false
      required: [id, name, mode]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        mode:
          type: string
          enum: [independent, mirrored]

    TargetSummary:
      type: object
      additionalProperties: false
      required: [blocking, last_24h, live]
      properties:
        blocking:
          $ref: "#/components/schemas/BlockingStatus"
        last_24h:
          $ref: "#/components/schemas/DatabaseTotals"
        live:
          $ref: "#/components/schemas/LiveCounters"

    DatabaseTotals:
      type: object
      additionalProperties: false
      description: Totals for the last 24 hours from Pi-hole's long-term database, unaffected by FTL restarts.
      required: [queries, blocked, percent_blocked, clients]
      properties:
        queries:
          type: integer
        blocked:
          type: integer
        percent_blocked:
          type: number
          format: double
        clients:
          type: integer

    LiveCounters:
      type: object
      additionalProperties: false
      description: Counters since FTL last started.
      required:
        [queries, blocked, percent_blocked, unique_domains, forwarded, cached, active_clients, total_clients, domains_on_blocklist, status, replies]
      properties:
        queries:
          type: integer
        blocked:
          type: integer
        percent_blocked:
          type: number
          format: double
        unique_domains:
          type: integer
        forwarded:
          type: integer
        cached:
          type: integer
        active_clients:
          type: integer
        total_clients:
          type: integer
        domains_on_blocklist:
          type: integer
          description: Domains on the Pi-hole's blocklists (gravity).
        status:
          type: object
          description: Queries by FTL's result code (GRAVITY, FORWARDED, CACHE and so on).
          additionalProperties:
            type: integer
        replies:
          type: object
          description: Queries by reply type (IP, NXDOMAIN, CNAME and so on).
          additionalProperties:
            type: integer

    BlockingStatus:
      type: object
      additionalProperties: false
      required: [blocking]
      properties:
        blocking:
          type: string
          enum: [enabled, disabled, failed, unknown]
          description: failed and unknown mean Pi-hole couldn't tell.
        timer:
          type: integer
          description: Seconds until blocking changes back, rounded up. Absent when no timer is running.

    BlockingInput:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled:
          type: boolean
        timer:
          type: integer
          minimum: 1
          maximum: 86400
          description: Only with `enabled` false. Seconds until Pi-hole turns blocking back on.

    # WriteResults: every Pi-hole write (blocking, DNS restart, domain and client changes) answers with one result per
    # instance it acted on: one for an instance target, one per member for a mirrored group. 200 when every result is
    # ok, 207 when they differ; when none is ok, the error envelope of the first failure, with the results in
    # details.results. Requests refused before any Pi-hole is changed (bad input, no permission, an entry that doesn't
    # exist) answer with the error envelope as usual.
    WriteStatus:
      type: string
      enum: [ok, failed, skipped]
      description: >-
        ok: the change was made. failed: the Pi-hole was asked and the change failed (see `error`). skipped: the
        instance wasn't asked, because it was found down moments ago or can't be used (see `error`).

    WriteError:
      type: object
      additionalProperties: false
      required: [code, message]
      description: Why an instance failed or was skipped. Present exactly when the status isn't ok.
      properties:
        code:
          type: string
          description: >-
            pihole_unreachable, pihole_auth_rejected, pihole_status_error, pihole_rejected, instance_password_missing
            or instance_misconfigured.
        message:
          type: string
          description: Safe to show to the user.
        pihole_message:
          type: string
          description: For pihole_rejected, Pi-hole's own reason, when it gave one. Pi-hole's text; show it as text.

    BlockingWriteResults:
      type: object
      additionalProperties: false
      required: [results]
      description: The result per instance of turning blocking on or off.
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/BlockingWriteResult"

    BlockingWriteResult:
      type: object
      additionalProperties: false
      required: [instance, instance_id, status]
      properties:
        instance:
          type: string
          description: The instance's name.
        instance_id:
          type: integer
          format: int64
        status:
          $ref: "#/components/schemas/WriteStatus"
        error:
          $ref: "#/components/schemas/WriteError"
        blocking:
          $ref: "#/components/schemas/BlockingStatus"
          description: Present when ok.

    DNSRestartResults:
      type: object
      additionalProperties: false
      required: [results]
      description: The result per instance of a DNS restart.
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/DNSRestartResult"

    DNSRestartResult:
      type: object
      additionalProperties: false
      required: [instance, instance_id, status]
      properties:
        instance:
          type: string
          description: The instance's name.
        instance_id:
          type: integer
          format: int64
        status:
          $ref: "#/components/schemas/WriteStatus"
        error:
          $ref: "#/components/schemas/WriteError"
        confirmed:
          type: boolean
          description: >-
            Present when ok. False when the connection dropped while the restart was being requested, which happens
            when the restart goes ahead: check the dashboard in a few seconds.

    DomainWriteResults:
      type: object
      additionalProperties: false
      required: [results]
      description: The result per instance of adding or changing a list entry.
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/DomainWriteResult"

    DomainWriteResult:
      type: object
      additionalProperties: false
      required: [instance, instance_id, status]
      properties:
        instance:
          type: string
          description: The instance's name.
        instance_id:
          type: integer
          format: int64
        status:
          $ref: "#/components/schemas/WriteStatus"
        error:
          $ref: "#/components/schemas/WriteError"
        entry:
          $ref: "#/components/schemas/Domain"
          description: Present when ok. The entry as saved.

    ClientWriteResults:
      type: object
      additionalProperties: false
      required: [results]
      description: The result per instance of changing a client.
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/ClientWriteResult"

    ClientWriteResult:
      type: object
      additionalProperties: false
      required: [instance, instance_id, status]
      properties:
        instance:
          type: string
          description: The instance's name.
        instance_id:
          type: integer
          format: int64
        status:
          $ref: "#/components/schemas/WriteStatus"
        error:
          $ref: "#/components/schemas/WriteError"
        entry:
          $ref: "#/components/schemas/PiholeClient"
          description: Present when ok. The client as saved.

    DeleteResults:
      type: object
      additionalProperties: false
      required: [results]
      description: The result per instance of deleting a list entry.
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/DeleteResult"

    DeleteResult:
      type: object
      additionalProperties: false
      required: [instance, instance_id, status]
      properties:
        instance:
          type: string
          description: The instance's name.
        instance_id:
          type: integer
          format: int64
        status:
          $ref: "#/components/schemas/WriteStatus"
        error:
          $ref: "#/components/schemas/WriteError"

    DomainList:
      type: object
      additionalProperties: false
      required: [domains]
      properties:
        domains:
          type: array
          items:
            $ref: "#/components/schemas/Domain"

    Domain:
      type: object
      additionalProperties: false
      required: [domain, type, kind, comment, groups, enabled]
      properties:
        domain:
          type: string
        type:
          type: string
          enum: [allow, deny]
        kind:
          type: string
          enum: [exact, regex]
        comment:
          type: string
        groups:
          type: array
          description: IDs of the Pi-hole groups the entry is in. See the target's groups for their names.
          items:
            type: integer
        enabled:
          type: boolean
          description: Read-only here.
        added_at:
          type: string
          format: date-time
          description: Absent if Pi-hole didn't report it.
        modified_at:
          type: string
          format: date-time
          description: Absent if Pi-hole didn't report it.

    DomainKey:
      type: object
      additionalProperties: false
      required: [domain, type, kind]
      description: Names a list entry. The same domain can be on both lists, and be both an exact and a regex entry.
      properties:
        domain:
          type: string
          minLength: 1
          maxLength: 1024
        type:
          type: string
          enum: [allow, deny]
        kind:
          type: string
          enum: [exact, regex]

    DomainInput:
      type: object
      additionalProperties: false
      required: [domain, type, kind]
      properties:
        domain:
          type: string
          minLength: 1
          maxLength: 1024
          description: >-
            Surrounding spaces are ignored. An exact domain is at most 255 bytes; a regex at most 1024. Pi-hole checks
            the rest.
        type:
          type: string
          enum: [allow, deny]
        kind:
          type: string
          enum: [exact, regex]
        comment:
          type: string
          maxLength: 500
        groups:
          type: array
          maxItems: 1000
          items:
            type: integer
            minimum: 0

    DomainUpdate:
      type: object
      additionalProperties: false
      required: [domain, type, kind]
      description: Names the entry and gives at least one of comment and groups.
      properties:
        domain:
          type: string
          minLength: 1
          maxLength: 1024
        type:
          type: string
          enum: [allow, deny]
        kind:
          type: string
          enum: [exact, regex]
        comment:
          type: string
          maxLength: 500
        groups:
          type: array
          maxItems: 1000
          description: Replaces the entry's groups.
          items:
            type: integer
            minimum: 0

    ClientList:
      type: object
      additionalProperties: false
      required: [clients]
      properties:
        clients:
          type: array
          items:
            $ref: "#/components/schemas/PiholeClient"

    PiholeClient:
      type: object
      additionalProperties: false
      required: [client, comment, groups]
      properties:
        client:
          type: string
          description: The IP address, MAC address, hostname or subnet the client was added with. Identifies it.
        name:
          type: string
          description: The hostname Pi-hole resolved, if any.
        comment:
          type: string
        groups:
          type: array
          items:
            type: integer
        added_at:
          type: string
          format: date-time
        modified_at:
          type: string
          format: date-time

    ClientUpdate:
      type: object
      additionalProperties: false
      required: [client]
      description: Names the client and gives at least one of comment and groups.
      properties:
        client:
          type: string
          minLength: 1
          maxLength: 255
        comment:
          type: string
          maxLength: 500
        groups:
          type: array
          maxItems: 1000
          description: Replaces the client's groups.
          items:
            type: integer
            minimum: 0

    PiholeGroupList:
      type: object
      additionalProperties: false
      required: [groups]
      properties:
        groups:
          type: array
          items:
            $ref: "#/components/schemas/PiholeGroup"

    PiholeGroup:
      type: object
      additionalProperties: false
      required: [id, name, comment, enabled]
      properties:
        id:
          type: integer
          description: Pi-hole's ID for the group, which differs between Pi-holes.
        name:
          type: string
        comment:
          type: string
        enabled:
          type: boolean

    QueryLog:
      type: object
      additionalProperties: false
      required: [queries]
      properties:
        queries:
          type: array
          items:
            $ref: "#/components/schemas/QueryLogEntry"

    QueryLogEntry:
      type: object
      additionalProperties: false
      required: [time, type, domain, client_ip, status, reply_type]
      properties:
        time:
          type: string
          format: date-time
        type:
          type: string
          description: The record type asked for (A, AAAA, PTR and so on).
        domain:
          type: string
        client_ip:
          type: string
        client_name:
          type: string
          description: Absent when Pi-hole has no name for the client.
        status:
          type: string
          description: FTL's result (GRAVITY, FORWARDED, CACHE, DENYLIST and so on).
        reply_type:
          type: string
        reply_time_ms:
          type: number
          format: double
          description: Absent when there was no reply.
        upstream:
          type: string
          description: Absent when the query wasn't forwarded.
        dnssec:
          type: string
          description: Absent when Pi-hole didn't report a DNSSEC status.

    # The standard error envelope returned by every /api/v1 endpoint on failure.
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"

    ErrorBody:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          description: >-
            Stable machine-readable code: unauthenticated, forbidden, csrf_failed, validation_failed, method_not_allowed,
            unsupported_media_type, not_found, conflict, invariant_violated, confirmation_required, rate_limited, setup_required,
            invalid_credentials, no_access, invalid_setup_token, setup_complete, internal, pihole_unreachable, pihole_auth_rejected,
            pihole_status_error, pihole_rejected, instance_password_missing, instance_misconfigured.
        message:
          type: string
          description: Human-readable message, safe to show to the user.
        details:
          type: object
          additionalProperties: true
          description: Optional structured context, e.g. which instance failed.
