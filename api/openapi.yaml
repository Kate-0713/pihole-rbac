        detail:
          type: object
          additionalProperties: true
          description: What the action changed, per action; `error` on a failure. Never secret values.
        ip:
          type: string
          description: The client address, or empty for the CLI and the app itself.

    GeneralSettingsInput:
      type: object
      additionalProperties: false
      required: [session_lifetime_minutes, idle_timeout_minutes]
      properties:
        session_lifetime_minutes:
          type: integer
          minimum: 15
          maximum: 43200
          description: How long a session lasts at most, from login. 15 minutes to 30 days.
        idle_timeout_minutes:
          type: integer
          minimum: 5
          maximum: 1440
          description: How long a session lasts without requests. 5 minutes to 24 hours, and at most the lifetime.
        audit_retention_days:
          type: integer
          minimum: 30
          maximum: 3650
          description: How many days audit entries are kept, 30 to 3650. Absent leaves it as it is.

    GeneralSettings:
      type: object
      additionalProperties: false
      required: [session_lifetime_minutes, idle_timeout_minutes, audit_retention_days]
      properties:
        session_lifetime_minutes:
          type: integer
        idle_timeout_minutes:
          type: integer
        audit_retention_days:
          type: integer
          description: How many days audit entries are kept; 365 until saved.
        updated_at:
          type: string
          format: date-time
          description: Absent until the settings are first saved.
        updated_by:
          type: string

    TargetSummary:
      type: object
      additionalProperties: false
      required: [blocking, last_24h, live]
      description: >-
        For a mirrored group, the counters are summed over the members that answered (counts of distinct clients and
        domains are sums too, so a client seen by two members counts twice), the percentages are worked out from the
        sums, and the blocklist size is the primary's (or the largest, if the primary didn't answer). `blocking` is
        the members' common state, or mixed. `members` says how each member answered, with its own blocking state; a
        member that didn't answer leaves the totals, and the request fails only when none answered.
      properties:
        blocking:
          $ref: "#/components/schemas/BlockingStatus"
        last_24h:
          $ref: "#/components/schemas/DatabaseTotals"
        live:
          $ref: "#/components/schemas/LiveCounters"
        members:
          type: array
          description: For a mirrored group, its enabled members, the primary first. Absent for an instance.
          items:
            $ref: "#/components/schemas/MemberRead"

    DatabaseTotals:
      type: object
      additionalProperties: false
      description: Totals for the last 24 hours from Pi-hole's long-term database, unaffected by FTL restarts.
      required: [queries, blocked, percent_blocked, clients]
      properties:
        queries:
          type: integer
        blocked:
          type: integer
        percent_blocked:
          type: number
          format: double
        clients:
          type: integer

    LiveCounters:
      type: object
      additionalProperties: false
      description: Counters since FTL last started.
      required:
        [queries, blocked, percent_blocked, unique_domains, forwarded, cached, active_clients, total_clients, domains_on_blocklist, status, replies]
      properties:
        queries:
          type: integer
        blocked:
          type: integer
        percent_blocked:
          type: number
          format: double
        unique_domains:
          type: integer
        forwarded:
          type: integer
        cached:
          type: integer
        active_clients:
          type: integer
        total_clients:
          type: integer
        domains_on_blocklist:
          type: integer
          description: Domains on the Pi-hole's blocklists (gravity).
        status:
          type: object
          description: Queries by FTL's result code (GRAVITY, FORWARDED, CACHE and so on).
          additionalProperties:
            type: integer
        replies:
          type: object
          description: Queries by reply type (IP, NXDOMAIN, CNAME and so on).
          additionalProperties:
            type: integer

    BlockingStatus:
      type: object
      additionalProperties: false
      required: [blocking]
      properties:
        blocking:
          type: string
          enum: [enabled, disabled, mixed, failed, unknown]
          description: >-
            failed and unknown mean Pi-hole couldn't tell. mixed is only for a mirrored group whose members differ.
        timer:
          type: integer
          description: >-
            Seconds until blocking changes back, rounded up. Absent when no timer is running. For a mirrored group, the
            soonest of its members' timers.

    BlockingInput:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled:
          type: boolean
        timer:
          type: integer
          minimum: 1
          maximum: 86400
          description: Only with `enabled` false. Seconds until Pi-hole turns blocking back on.

    # WriteResults: every Pi-hole write (blocking, DNS restart, domain and client changes) answers with one result per
    # instance it acted on: one for an instance target, one per member for a mirrored group. 200 when every result is
    # ok, 207 when they differ; when none is ok, the error envelope of the first failure, with the results in
    # details.results. Requests refused before any Pi-hole is changed (bad input, no permission, an entry that doesn't
    # exist) answer with the error envelope as usual.
    #
    # Through a mirrored group, the write goes to every enabled member at once, the primary first in the results, and
    # is audited once per member. Pi-hole group IDs in the request are the primary's; each member gets its own IDs
    # for the same names, and a member without one of them fails with pihole_group_missing (if the request names
    # groups other than Default and the primary can't be read, nothing is sent). A change or delete of an entry the
    # primary doesn't have is a 404; if the primary can't be read, the write still goes to the other members. Each
    # member reads its own entry first: a change to an entry a member doesn't have fails there with not_found, and a
    # delete of one is ok, since the entry is already gone.
    WriteStatus:
      type: string
      enum: [ok, failed, skipped]
      description: >-
        ok: the change was made. failed: the Pi-hole was asked and the change failed (see `error`). skipped: the
        instance wasn't asked, because it was found down moments ago or can't be used (see `error`).

    WriteError:
      type: object
      additionalProperties: false
      required: [code, message]
      description: Why an instance failed or was skipped. Present exactly when the status isn't ok.
      properties:
        code:
          type: string
          description: >-
            pihole_unreachable, pihole_auth_rejected, pihole_status_error, pihole_rejected, instance_password_missing
            or instance_misconfigured; and, for a member of a mirrored group, not_found (the entry a change names isn't
            on that member) or pihole_group_missing (it has no Pi-hole group with a name the change uses).
        message:
          type: string
          description: Safe to show to the user.
        pihole_message:
          type: string
          description: For pihole_rejected, Pi-hole's own reason, when it gave one. Pi-hole's text; show it as text.

    BlockingWriteResults:
      type: object
      additionalProperties: false
      required: [results]
      description: The result per instance of turning blocking on or off.
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/BlockingWriteResult"

    BlockingWriteResult:
      type: object
      additionalProperties: false
      required: [instance, instance_id, status]
      properties:
        instance:
          type: string
          description: The instance's name.
        instance_id:
          type: integer
          format: int64
        status:
          $ref: "#/components/schemas/WriteStatus"
        error:
          $ref: "#/components/schemas/WriteError"
        blocking:
          $ref: "#/components/schemas/BlockingStatus"
          description: Present when ok.

    DNSRestartResults:
      type: object
      additionalProperties: false
      required: [results]
      description: The result per instance of a DNS restart.
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/DNSRestartResult"

    DNSRestartResult:
      type: object
      additionalProperties: false
      required: [instance, instance_id, status]
      properties:
        instance:
          type: string
          description: The instance's name.
        instance_id:
          type: integer
          format: int64
        status:
          $ref: "#/components/schemas/WriteStatus"
        error:
          $ref: "#/components/schemas/WriteError"
        confirmed:
          type: boolean
          description: >-
            Present when ok. False when the connection dropped while the restart was being requested, which happens
            when the restart goes ahead: check the dashboard in a few seconds.

    DomainWriteResults:
      type: object
      additionalProperties: false
      required: [results]
      description: The result per instance of adding or changing a list entry.
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/DomainWriteResult"

    DomainWriteResult:
      type: object
      additionalProperties: false
      required: [instance, instance_id, status]
      properties:
        instance:
          type: string
          description: The instance's name.
        instance_id:
          type: integer
          format: int64
        status:
          $ref: "#/components/schemas/WriteStatus"
        error:
          $ref: "#/components/schemas/WriteError"
        entry:
          $ref: "#/components/schemas/Domain"
          description: Present when ok. The entry as saved.

    ClientWriteResults:
      type: object
      additionalProperties: false
      required: [results]
      description: The result per instance of changing a client.
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/ClientWriteResult"

    ClientWriteResult:
      type: object
      additionalProperties: false
      required: [instance, instance_id, status]
      properties:
        instance:
          type: string
          description: The instance's name.
        instance_id:
          type: integer
          format: int64
        status:
          $ref: "#/components/schemas/WriteStatus"
        error:
          $ref: "#/components/schemas/WriteError"
        entry:
          $ref: "#/components/schemas/PiholeClient"
          description: Present when ok. The client as saved.

    DeleteResults:
      type: object
      additionalProperties: false
      required: [results]
      description: The result per instance of deleting a list entry.
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/DeleteResult"

    DeleteResult:
      type: object
      additionalProperties: false
      required: [instance, instance_id, status]
      properties:
        instance:
          type: string
          description: The instance's name.
        instance_id:
          type: integer
          format: int64
        status:
          $ref: "#/components/schemas/WriteStatus"
        error:
          $ref: "#/components/schemas/WriteError"

    DomainList:
      type: object
      additionalProperties: false
      required: [domains]
      properties:
        drifted:
          type: boolean
          description: >-
            For a mirrored group: whether its members' domain lists differed from the primary's at the last drift check.
            Absent for an instance, and until a check has compared them.
        domains:
          type: array
          items:
            $ref: "#/components/schemas/Domain"

    Domain:
      type: object
      additionalProperties: false
      required: [domain, type, kind, comment, groups, enabled]
      properties:
        domain:
          type: string
        type:
          type: string
          enum: [allow, deny]
        kind:
          type: string
          enum: [exact, regex]
        comment:
          type: string
        groups:
          type: array
          description: IDs of the Pi-hole groups the entry is in. See the target's groups for their names.
          items:
            type: integer
        enabled:
          type: boolean
          description: Read-only here.
        added_at:
          type: string
          format: date-time
          description: Absent if Pi-hole didn't report it.
        modified_at:
          type: string
          format: date-time
          description: Absent if Pi-hole didn't report it.

    DomainKey:
      type: object
      additionalProperties: false
      required: [domain, type, kind]
      description: Names a list entry. The same domain can be on both lists, and be both an exact and a regex entry.
      properties:
        domain:
          type: string
          minLength: 1
          maxLength: 1024
        type:
          type: string
          enum: [allow, deny]
        kind:
          type: string
          enum: [exact, regex]

    DomainInput:
      type: object
      additionalProperties: false
      required: [domain, type, kind]
      properties:
        domain:
          type: string
          minLength: 1
          maxLength: 1024
          description: >-
            Surrounding spaces are ignored. An exact domain is at most 255 bytes; a regex at most 1024. Pi-hole checks
            the rest.
        type:
          type: string
          enum: [allow, deny]
        kind:
          type: string
          enum: [exact, regex]
        comment:
          type: string
          maxLength: 500
        groups:
          type: array
          maxItems: 1000
          items:
            type: integer
            minimum: 0

    DomainUpdate:
      type: object
      additionalProperties: false
      required: [domain, type, kind]
      description: Names the entry and gives at least one of comment and groups.
      properties:
        domain:
          type: string
          minLength: 1
          maxLength: 1024
        type:
          type: string
          enum: [allow, deny]
        kind:
          type: string
          enum: [exact, regex]
        comment:
          type: string
          maxLength: 500
        groups:
          type: array
          maxItems: 1000
          description: Replaces the entry's groups.
          items:
            type: integer
            minimum: 0

    ClientList:
      type: object
      additionalProperties: false
      required: [clients]
      properties:
        drifted:
          type: boolean
          description: >-
            For a mirrored group: whether its members' clients differed from the primary's at the last drift check.
            Absent for an instance, and until a check has compared them.
        clients:
          type: array
          items:
            $ref: "#/components/schemas/PiholeClient"

    PiholeClient:
      type: object
      additionalProperties: false
      required: [client, comment, groups]
      properties:
        client:
          type: string
          description: The IP address, MAC address, hostname or subnet the client was added with. Identifies it.
        name:
          type: string
          description: The hostname Pi-hole resolved, if any.
        comment:
          type: string
        groups:
          type: array
          items:
            type: integer
        added_at:
          type: string
          format: date-time
        modified_at:
          type: string
          format: date-time

    ClientUpdate:
      type: object
      additionalProperties: false
      required: [client]
      description: Names the client and gives at least one of comment and groups.
      properties:
        client:
          type: string
          minLength: 1
          maxLength: 255
        comment:
          type: string
          maxLength: 500
        groups:
          type: array
          maxItems: 1000
          description: Replaces the client's groups.
          items:
            type: integer
            minimum: 0

    PiholeGroupList:
      type: object
      additionalProperties: false
      required: [groups]
      properties:
        groups:
          type: array
          items:
            $ref: "#/components/schemas/PiholeGroup"

    PiholeGroup:
      type: object
      additionalProperties: false
      required: [id, name, comment, enabled]
      properties:
        id:
          type: integer
          description: Pi-hole's ID for the group, which differs between Pi-holes.
        name:
          type: string
        comment:
          type: string
        enabled:
          type: boolean

    QueryLog:
      type: object
      additionalProperties: false
      required: [queries]
      description: >-
        For a mirrored group, each enabled member's newest `length` entries are read, merged newest first and cut to
        `length`, then filtered; `members` says how each member answered. A member that didn't answer leaves the
        log, and the request fails only when none answered.
      properties:
        queries:
          type: array
          items:
            $ref: "#/components/schemas/QueryLogEntry"
        members:
          type: array
          description: For a mirrored group, its enabled members, the primary first. Absent for an instance.
          items:
            $ref: "#/components/schemas/MemberRead"

    QueryLogEntry:
      type: object
      additionalProperties: false
      required: [instance, time, type, domain, client_ip, status, reply_type]
      properties:
        instance:
          type: string
          description: The instance that answered the query.
        time:
          type: string
          format: date-time
        type:
          type: string
          description: The record type asked for (A, AAAA, PTR and so on).
        domain:
          type: string
        client_ip:
          type: string
        client_name:
          type: string
          description: Absent when Pi-hole has no name for the client.
        status:
          type: string
          description: FTL's result (GRAVITY, FORWARDED, CACHE, DENYLIST and so on).
        reply_type:
          type: string
        reply_time_ms:
          type: number
          format: double
          description: Absent when there was no reply.
        upstream:
          type: string
          description: Absent when the query wasn't forwarded.
        dnssec:
          type: string
          description: Absent when Pi-hole didn't report a DNSSEC status.

    # The standard error envelope returned by every /api/v1 endpoint on failure.
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"

    ErrorBody:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          description: >-
            Stable machine-readable code: unauthenticated, forbidden, csrf_failed, validation_failed, method_not_allowed,
            unsupported_media_type, not_found, conflict, invariant_violated, confirmation_required, rate_limited, setup_required,
            invalid_credentials, no_access, invalid_setup_token, setup_complete, internal, pihole_unreachable, pihole_auth_rejected,
            pihole_status_error, pihole_rejected, instance_password_missing, instance_misconfigured, ldap_failed.
        message:
          type: string
          description: Human-readable message, safe to show to the user.
        details:
          type: object
          additionalProperties: true
          description: Optional structured context, e.g. which instance failed.
