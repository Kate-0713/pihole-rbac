          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/UserConflict"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/users/{id}/enable:
    parameters:
      - $ref: "#/components/parameters/UserID"
    post:
      summary: Enable a user
      description: Needs every grant of every role the user has. Enabling an enabled user changes nothing.
      operationId: enableUser
      x-permission: users.manage
      responses:
        "200":
          description: The user, now enabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/users/{id}/disable:
    parameters:
      - $ref: "#/components/parameters/UserID"
    post:
      summary: Disable a user
      description: >-
        Ends the user's sessions and stops them logging in, by any method. Needs every grant of every role the user
        has. At least one enabled local admin must remain (code invariant_violated). Disabling your own account needs
        `confirm=true` (code confirmation_required). Disabling a disabled user changes nothing.
      operationId: disableUser
      x-permission: users.manage
      parameters:
        - $ref: "#/components/parameters/Confirm"
      responses:
        "200":
          description: The user, now disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/UserConflict"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/users/{id}/password:
    parameters:
      - $ref: "#/components/parameters/UserID"
    post:
      summary: Set a local user's password
      description: >-
        Sets a new password for a local user without the current one, and ends their sessions (except the caller's own
        current session, when it is their own account). Needs every grant of every role the user has, so nobody can
        take over an account more privileged than their own. LDAP users are refused (code validation_failed).
      operationId: setUserPassword
      x-permission: users.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserPassword"
      responses:
        "204":
          description: Set.
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/users/{id}/totp:
    parameters:
      - $ref: "#/components/parameters/UserID"
    delete:
      summary: Remove a user's two-factor login
      description: >-
        For someone who has lost their authenticator and their recovery codes: removes the user's secret and recovery
        codes and ends their sessions, so their next login asks for the password alone. Needs every grant of every
        role the user has, so nobody can weaken the login of an account more privileged than their own. Your own is
        refused (code validation_failed): turn it off from your account, which asks for your password and a code. A
        user without two-factor login is returned unchanged.
      operationId: removeUserTOTP
      x-permission: users.manage
      responses:
        "200":
          description: The user, now without two-factor login.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/users/{id}/roles:
    parameters:
      - $ref: "#/components/parameters/UserID"
    put:
      summary: Replace a local user's roles
      description: >-
        Needs every grant of every role the user has now, and of every role given or taken away. The user's sessions
        get the new roles at once, or end if none is left. At least one enabled local admin must remain (code
        invariant_violated). If the change would take away the caller's own last route to roles.manage or
        users.manage, it is refused with code confirmation_required and `details.would_lose`, and goes ahead when
        repeated with `confirm=true`. LDAP users are refused (code validation_failed): their roles come from group
        mappings.
      operationId: setUserRoles
      x-permission: users.manage
      parameters:
        - $ref: "#/components/parameters/Confirm"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRoles"
      responses:
        "200":
          description: The user with their new roles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/UserConflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/settings/auth:
    get:
      summary: The login methods
      description: The enabled login methods, in the order they are tried.
      operationId: getLoginMethods
      x-permission: settings.manage
      responses:
        "200":
          description: The login methods.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginMethods"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/SetupRequired"
    put:
      summary: Change the login methods
      description: >-
        Sets the enabled login methods and their order. Local login must stay enabled: it is the way in when LDAP fails
        (400 validation_failed otherwise). Turning LDAP on needs saved LDAP settings and a bind password, and a service
        bind with them that works (502 ldap_failed otherwise). Applies at once, without a restart. Audited as
        settings_update.
      operationId: setLoginMethods
      x-permission: settings.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginMethods"
      responses:
        "200":
          description: The login methods as saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginMethods"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "502":
          $ref: "#/components/responses/LDAPFailed"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/settings/ldap:
    get:
      summary: The LDAP settings
      description: >-
        The LDAP connection settings (absent until saved), whether LDAP login is enabled, and where the bind password
        comes from. Never the password.
      operationId: getLDAPSettings
      x-permission: settings.manage
      responses:
        "200":
          description: The LDAP settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LDAPSettingsView"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/SetupRequired"
    put:
      summary: Save the LDAP settings
      description: >-
        Saves the LDAP connection settings and, if given, the bind password (write-only). The bind password is only
        sent to a server it was entered for: the first save, a new URL, or a change to the TLS mode or the Common Name
        fallback needs `bind_password` whenever a password is already stored or PIHOLE_RBAC_LDAP_BIND_PASSWORD is set
        (400 validation_failed with `details.field` bind_password otherwise). When the variable is set, the password
        given must match it and isn't stored. While LDAP login is enabled, the new settings must pass a service bind
        first (502 ldap_failed otherwise), and nothing is saved if they don't. Applies at once. Audited as
        settings_update with the fields that changed.
      operationId: setLDAPSettings
      x-permission: settings.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LDAPSettingsInput"
      responses:
        "200":
          description: The LDAP settings as saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LDAPSettingsView"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "502":
          $ref: "#/components/responses/LDAPFailed"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/ldap/test-user:
    post:
      summary: Test how an LDAP user would log in
      description: >-
        Looks a username up with the service account, as the session recheck does (no password needed), and reports
        the user's DN, the groups the directory returned, which mappings matched, the roles they give and the
        permissions those add up to. Uses the saved LDAP settings whether or not LDAP login is enabled. A username the
        directory doesn't have is a 200 with `found` false. 409 conflict if no LDAP settings are saved.
      operationId: testLDAPUser
      x-permission: roles.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LDAPUserTestInput"
      responses:
        "200":
          description: What the directory says, and what it would mean here.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LDAPUserTest"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "502":
          $ref: "#/components/responses/LDAPFailed"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/ldap/check-group:
    post:
      summary: Check an LDAP group DN
      description: >-
        Looks a group DN up with the service account: whether it exists and how many members it lists. Audited as
        ldap_mapping_check. 409 conflict if no LDAP settings are saved.
      operationId: checkLDAPGroup
      x-permission: roles.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LDAPGroupInput"
      responses:
        "200":
          description: What the directory says about the group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LDAPGroupCheck"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "502":
          $ref: "#/components/responses/LDAPFailed"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/sessions:
    get:
      summary: List active sessions
      description: >-
        Active sessions, newest first: every user's with sessions.manage, otherwise only the caller's own. `mine=true`
        asks for only the caller's own either way. `all` in the answer says which you got. Paged with `limit` and
        `cursor`: pass the previous answer's `next_cursor` to get the next page; it is absent on the last page.
      operationId: listSessions
      x-permission: session
      parameters:
        - name: limit
          in: query
          required: false
          description: How many sessions to return, 1 to 200.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` of the previous page.
          schema:
            type: string
            maxLength: 128
        - name: mine
          in: query
          required: false
          description: Only the caller's own sessions, even with sessions.manage.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: The sessions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/sessions/{public_id}:
    parameters:
      - name: public_id
        in: path
        required: true
        description: The session's public ID.
        schema:
          type: string
          pattern: "^[A-Za-z0-9_-]{22}$"
    delete:
      summary: End a session
      description: >-
        Ends one of the caller's own sessions, or anyone's with sessions.manage. Ending the caller's current session
        logs them out. A session that doesn't exist, or that the caller may not end, is 404 either way, so the answer
        doesn't say whether another user's session exists. Audited as session_revoke.
      operationId: revokeSession
      x-permission: session
      responses:
        "204":
          description: Ended.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/notifications/channels:
    get:
      summary: List the notification channels
      description: Every channel, by name, with its events and where its secret comes from; never the secret.
      operationId: listChannels
      x-permission: notifications.manage
      responses:
        "200":
          description: The channels.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/SetupRequired"
    post:
      summary: Add a notification channel
      description: >-
        A Discord channel's secret is its webhook URL, which must be https://discord.com/api/webhooks/<id>/<token>
        (or discordapp.com). A Matrix channel's secret is the access token of the account that posts, and `matrix`
        gives the homeserver and room. The secret is stored, encrypted under the master key, from `secret`, or read
        from PIHOLE_RBAC_NOTIFY_<env_name>_SECRET (or _FILE), which overrides a stored one; if that variable is
        already set, `secret` is required and must match it. A channel without a secret can't send until it has one.
        Audited as channel_create.
      operationId: createChannel
      x-permission: notifications.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelInput"
      responses:
        "201":
          description: The new channel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/notifications/channels/{id}:
    parameters:
      - $ref: "#/components/parameters/ChannelID"
    get:
      summary: One notification channel
      operationId: getChannel
      x-permission: notifications.manage
      responses:
        "200":
          description: The channel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/SetupRequired"
    put:
      summary: Change a notification channel
      description: >-
        Replaces the channel's settings and events; its kind can't change. A Matrix channel with a token needs
        `secret` again when its homeserver or `allow_http` changes, and any channel needs it when it starts using a
        variable that is set (400 validation_failed with details.field secret otherwise). When the destination or
        secret changes, the channel is disabled, or events are taken away from an enabled channel, a warning goes
        to the old destination with the old secret. Audited as channel_update.
      operationId: updateChannel
      x-permission: notifications.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelInput"
      responses:
        "200":
          description: The channel as saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "503":
          $ref: "#/components/responses/SetupRequired"
    delete:
      summary: Delete a notification channel
      description: Deletes the channel and its events. An enabled channel is told first. Audited as channel_delete.
      operationId: deleteChannel
      x-permission: notifications.manage
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/notifications/channels/{id}/secret:
    parameters:
      - $ref: "#/components/parameters/ChannelID"
    put:
      summary: Store a new secret for a notification channel
      description: >-
        Stores a new webhook URL or access token, encrypted under the master key, and tells the old destination.
        Refused with 409 conflict when the channel's variable is set (it overrides a stored secret) or when no
        master key is set. Audited as channel_secret. The secret is never returned.
      operationId: setChannelSecret
      x-permission: notifications.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelSecret"
      responses:
        "200":
          description: The channel, with its new secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/notifications/channels/{id}/test:
    parameters:
      - $ref: "#/components/parameters/ChannelID"
    post:
      summary: Send a test message
      description: >-
        Posts a test message to the channel's saved destination and waits for the answer, enabled or not. A
        destination that refuses it is a 200 with ok false, the status and, for Matrix, the errcode; never the
        destination's answer. 409 conflict when the channel has no secret it can use. Not audited.
      operationId: testChannel
      x-permission: notifications.manage
      responses:
        "200":
          description: How it went.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelTestResult"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/notifications/events:
    get:
      summary: The events a channel can receive
      description: >-
        Every audit action, grouped, plus the two events that aren't audit actions: protected_group_add, and
        client_reset_scheduled (a scheduled client reset run, while client_reset is a manual one).
      operationId: listNotificationEvents
      x-permission: notifications.manage
      responses:
        "200":
          description: The events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationEventList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/notifications/protected-groups:
    get:
      summary: The protected Pi-hole groups
      description: >-
        Per instance or mirrored group, the Pi-hole groups whose new clients raise the protected_group_add alert, with
        the instances and mirrored groups they can be set on. An instance's own protected groups and its mirrored
        group's both apply to it, however a client is changed.
      operationId: getProtectedGroups
      x-permission: notifications.manage
      responses:
        "200":
          description: The protected groups.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProtectedGroupSettings"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/SetupRequired"
    put:
      summary: Replace the protected Pi-hole groups
      description: >-
        Replaces them all. Names match ignoring case; a scope with no names is dropped. An independent group can't be a
        scope. Removing any tells the channels that receive protected_group_add. Audited as protected_groups_update,
        with what was added and removed; a save that changes nothing isn't.
      operationId: setProtectedGroups
      x-permission: notifications.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProtectedGroupsInput"
      responses:
        "200":
          description: The protected groups as saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProtectedGroupSettings"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/audit:
    get:
      summary: Read the audit log
      description: >-
        Audit entries, newest first, matching every filter given. Paged with `limit` and `cursor`: pass the previous
        answer's `next_cursor` to get the next page; it is absent on the last page. Reading isn't audited.
      operationId: listAudit
      x-permission: audit.view
      parameters:
        - $ref: "#/components/parameters/AuditUser"
        - $ref: "#/components/parameters/AuditAction"
        - $ref: "#/components/parameters/AuditTarget"
        - $ref: "#/components/parameters/AuditInstance"
        - $ref: "#/components/parameters/AuditResult"
        - $ref: "#/components/parameters/AuditFrom"
        - $ref: "#/components/parameters/AuditTo"
        - name: limit
          in: query
          required: false
          description: How many entries to return, 1 to 200.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` of the previous page.
          schema:
            type: string
            maxLength: 128
      responses:
        "200":
          description: The entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditList"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/audit/export:
    get:
      summary: Export the audit log as CSV
      description: >-
        The entries matching the same filters as the list, newest first, as a CSV download: at most the newest 50,000.
        Columns: id, time, user, action, target, instance_id, instance, result, ip, detail (JSON). A cell that starts
        with =, +, -, @, a tab or a carriage return gets a leading apostrophe, so a spreadsheet shows it as text rather
        than running it as a formula. Reading isn't audited.
      operationId: exportAudit
      x-permission: audit.view
      parameters:
