          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "502":
          $ref: "#/components/responses/LDAPFailed"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/sessions:
    get:
      summary: List active sessions
      description: >-
        Active sessions, newest first: every user's with sessions.manage, otherwise only the caller's own. `mine=true`
        asks for only the caller's own either way. `all` in the answer says which you got. Paged with `limit` and
        `cursor`: pass the previous answer's `next_cursor` to get the next page; it is absent on the last page.
      operationId: listSessions
      x-permission: session
      parameters:
        - name: limit
          in: query
          required: false
          description: How many sessions to return, 1 to 200.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` of the previous page.
          schema:
            type: string
            maxLength: 128
        - name: mine
          in: query
          required: false
          description: Only the caller's own sessions, even with sessions.manage.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: The sessions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/sessions/{public_id}:
    parameters:
      - name: public_id
        in: path
        required: true
        description: The session's public ID.
        schema:
          type: string
          pattern: "^[A-Za-z0-9_-]{22}$"
    delete:
      summary: End a session
      description: >-
        Ends one of the caller's own sessions, or anyone's with sessions.manage. Ending the caller's current session
        logs them out. A session that doesn't exist, or that the caller may not end, is 404 either way, so the answer
        doesn't say whether another user's session exists. Audited as session_revoke.
      operationId: revokeSession
      x-permission: session
      responses:
        "204":
          description: Ended.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/notifications/channels:
    get:
      summary: List the notification channels
      description: Every channel, by name, with its events and where its secret comes from; never the secret.
      operationId: listChannels
      x-permission: notifications.manage
      responses:
        "200":
          description: The channels.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/SetupRequired"
    post:
      summary: Add a notification channel
      description: >-
        A Discord channel's secret is its webhook URL, which must be https://discord.com/api/webhooks/<id>/<token>
        (or discordapp.com). A Matrix channel's secret is the access token of the account that posts, and `matrix`
        gives the homeserver and room. The secret is stored, encrypted under the master key, from `secret`, or read
        from PIHOLE_RBAC_NOTIFY_<env_name>_SECRET (or _FILE), which overrides a stored one; if that variable is
        already set, `secret` is required and must match it. A channel without a secret can't send until it has one.
        Audited as channel_create.
      operationId: createChannel
      x-permission: notifications.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelInput"
      responses:
        "201":
          description: The new channel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/notifications/channels/{id}:
    parameters:
      - $ref: "#/components/parameters/ChannelID"
    get:
      summary: One notification channel
      operationId: getChannel
      x-permission: notifications.manage
      responses:
        "200":
          description: The channel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/SetupRequired"
    put:
      summary: Change a notification channel
      description: >-
        Replaces the channel's settings and events; its kind can't change. A Matrix channel with a token needs
        `secret` again when its homeserver or `allow_http` changes, and any channel needs it when it starts using a
        variable that is set (400 validation_failed with details.field secret otherwise). When the destination or
        secret changes, the channel is disabled, or events are taken away from an enabled channel, a warning goes
        to the old destination with the old secret. Audited as channel_update.
      operationId: updateChannel
      x-permission: notifications.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelInput"
      responses:
        "200":
          description: The channel as saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "503":
          $ref: "#/components/responses/SetupRequired"
    delete:
      summary: Delete a notification channel
      description: Deletes the channel and its events. An enabled channel is told first. Audited as channel_delete.
      operationId: deleteChannel
      x-permission: notifications.manage
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/notifications/channels/{id}/secret:
    parameters:
      - $ref: "#/components/parameters/ChannelID"
    put:
      summary: Store a new secret for a notification channel
      description: >-
        Stores a new webhook URL or access token, encrypted under the master key, and tells the old destination.
        Refused with 409 conflict when the channel's variable is set (it overrides a stored secret) or when no
        master key is set. Audited as channel_secret. The secret is never returned.
      operationId: setChannelSecret
      x-permission: notifications.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelSecret"
      responses:
        "200":
          description: The channel, with its new secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/notifications/channels/{id}/test:
    parameters:
      - $ref: "#/components/parameters/ChannelID"
    post:
      summary: Send a test message
      description: >-
        Posts a test message to the channel's saved destination and waits for the answer, enabled or not. A
        destination that refuses it is a 200 with ok false, the status and, for Matrix, the errcode; never the
        destination's answer. 409 conflict when the channel has no secret it can use. Not audited.
      operationId: testChannel
      x-permission: notifications.manage
      responses:
        "200":
          description: How it went.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelTestResult"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/notifications/events:
    get:
      summary: The events a channel can receive
      description: Every audit action, grouped, plus protected_group_add.
      operationId: listNotificationEvents
      x-permission: notifications.manage
      responses:
        "200":
          description: The events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationEventList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/notifications/protected-groups:
    get:
      summary: The protected Pi-hole groups
      description: >-
        Per instance or mirrored group, the Pi-hole groups whose new clients raise the protected_group_add alert, with
        the instances and mirrored groups they can be set on. An instance's own protected groups and its mirrored
        group's both apply to it, however a client is changed.
      operationId: getProtectedGroups
      x-permission: notifications.manage
      responses:
        "200":
          description: The protected groups.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProtectedGroupSettings"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/SetupRequired"
    put:
      summary: Replace the protected Pi-hole groups
      description: >-
        Replaces them all. Names match ignoring case; a scope with no names is dropped. An independent group can't be a
        scope. Removing any tells the channels that receive protected_group_add. Audited as protected_groups_update,
        with what was added and removed; a save that changes nothing isn't.
      operationId: setProtectedGroups
      x-permission: notifications.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProtectedGroupsInput"
      responses:
        "200":
          description: The protected groups as saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProtectedGroupSettings"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/audit:
    get:
      summary: Read the audit log
      description: >-
        Audit entries, newest first, matching every filter given. Paged with `limit` and `cursor`: pass the previous
        answer's `next_cursor` to get the next page; it is absent on the last page. Reading isn't audited.
      operationId: listAudit
      x-permission: audit.view
      parameters:
        - $ref: "#/components/parameters/AuditUser"
        - $ref: "#/components/parameters/AuditAction"
        - $ref: "#/components/parameters/AuditTarget"
        - $ref: "#/components/parameters/AuditInstance"
        - $ref: "#/components/parameters/AuditResult"
        - $ref: "#/components/parameters/AuditFrom"
        - $ref: "#/components/parameters/AuditTo"
        - name: limit
          in: query
          required: false
          description: How many entries to return, 1 to 200.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` of the previous page.
          schema:
            type: string
            maxLength: 128
      responses:
        "200":
          description: The entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditList"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/audit/export:
    get:
      summary: Export the audit log as CSV
      description: >-
        The entries matching the same filters as the list, newest first, as a CSV download: at most the newest 50,000.
        Columns: id, time, user, action, target, instance_id, instance, result, ip, detail (JSON). A cell that starts
        with =, +, -, @, a tab or a carriage return gets a leading apostrophe, so a spreadsheet shows it as text rather
        than running it as a formula. Reading isn't audited.
      operationId: exportAudit
      x-permission: audit.view
      parameters:
        - $ref: "#/components/parameters/AuditUser"
        - $ref: "#/components/parameters/AuditAction"
        - $ref: "#/components/parameters/AuditTarget"
        - $ref: "#/components/parameters/AuditInstance"
        - $ref: "#/components/parameters/AuditResult"
        - $ref: "#/components/parameters/AuditFrom"
        - $ref: "#/components/parameters/AuditTo"
      responses:
        "200":
          description: The CSV file.
          headers:
            Content-Disposition:
              description: attachment, with a file name holding the time of the export.
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/settings/general:
    get:
      summary: The general settings
      description: How long sessions last and how long audit entries are kept. Defaults until saved.
      operationId: getGeneralSettings
      x-permission: settings.manage
      responses:
        "200":
          description: The general settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneralSettings"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/SetupRequired"
    put:
      summary: Change the general settings
      description: >-
        A new session lifetime applies to sessions started from now on; a new idle timeout applies to every session at
        once; a new audit retention applies at a prune a few seconds later. Audited as settings_update.
      operationId: setGeneralSettings
      x-permission: settings.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeneralSettingsInput"
      responses:
        "200":
          description: The general settings as saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneralSettings"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/targets/{target}/summary:
    parameters:
      - $ref: "#/components/parameters/TargetID"
    get:
      summary: Dashboard figures for a target
      description: >-
        The blocking status, totals for the last 24 hours from Pi-hole's long-term database, and the live counters
        since FTL last started. Needs any permission on the target. If any part can't be read, the whole request
        fails.
      operationId: getTargetSummary
      x-permission: target:any
      responses:
        "200":
          description: The figures.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TargetSummary"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/TargetUnavailable"
        "502":
          $ref: "#/components/responses/TargetPiholeFailed"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/targets/{target}/blocking:
    parameters:
      - $ref: "#/components/parameters/TargetID"
    get:
      summary: Whether blocking is on
      description: Needs any permission on the target.
      operationId: getBlocking
      x-permission: target:any
      responses:
        "200":
          description: The blocking status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockingStatus"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/TargetUnavailable"
        "502":
          $ref: "#/components/responses/TargetPiholeFailed"
        "503":
          $ref: "#/components/responses/SetupRequired"
    put:
      summary: Turn blocking on or off
      description: >-
        Sets blocking to the given state; setting the state it already has is allowed. With `timer`, which needs
        `enabled` false, Pi-hole turns blocking back on after that many seconds. Answers with a result per instance
        (see WriteResults under the schemas). Audited as blocking_set.
      operationId: setBlocking
      x-permission: target:blocking.toggle
      parameters:
        - $ref: "#/components/parameters/Members"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlockingInput"
      responses:
        "200":
          description: Every instance succeeded; each result has the blocking status after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockingWriteResults"
        "207":
          description: >-
            The instances' results differ: some succeeded and some didn't. Only a mirrored group, which has several
            members, can answer this.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockingWriteResults"
        "400":
          $ref: "#/components/responses/InvalidOrRejected"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/TargetUnavailable"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "502":
          $ref: "#/components/responses/TargetPiholeFailed"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/targets/{target}/dns/restart:
    parameters:
      - $ref: "#/components/parameters/TargetID"
    post:
      summary: Restart Pi-hole's DNS resolver
      description: >-
        Checks that the Pi-hole is reachable, then asks it to restart its resolver. The API goes down with the
        resolver, so a connection that drops during the restart is an ok result with `confirmed` false rather than a
        failure. Answers with a result per instance (see WriteResults under the schemas). Audited as dns_restart.
      operationId: restartDNS
      x-permission: target:dns.restart
      parameters:
        - $ref: "#/components/parameters/Members"
      responses:
        "200":
          description: The restart was requested on every instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DNSRestartResults"
        "207":
          description: >-
            The instances' results differ: some succeeded and some didn't. Only a mirrored group, which has several
            members, can answer this.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DNSRestartResults"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/TargetUnavailable"
        "502":
          $ref: "#/components/responses/TargetPiholeFailed"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/targets/{target}/domains:
    parameters:
      - $ref: "#/components/parameters/TargetID"
    get:
      summary: The allow and deny lists
      description: Every entry, unpaged, since Pi-hole returns the lists whole.
      operationId: listDomains
      x-permission: target:domains.view
      responses:
        "200":
          description: The entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainList"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/TargetUnavailable"
        "502":
          $ref: "#/components/responses/TargetPiholeFailed"
        "503":
          $ref: "#/components/responses/SetupRequired"
    post:
      summary: Add a domain to a list
      description: >-
        Adds an enabled entry. The groups must exist on the Pi-hole. Without `groups`, the entry goes in the Default
        group (ID 0), as in Pi-hole's own interface; an empty list puts it in no group. Pi-hole refusing the entry
        (already on that list, or not a valid domain or regex) is a pihole_rejected failure. Answers with a result
        per instance (see WriteResults under the schemas). Audited as domain_add.
      operationId: addDomain
      x-permission: target:domains.edit
      parameters:
        - $ref: "#/components/parameters/Members"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DomainInput"
      responses:
        "200":
          description: Every instance succeeded; each result has the entry as saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainWriteResults"
        "207":
          description: >-
            The instances' results differ: some succeeded and some didn't. Only a mirrored group, which has several
            members, can answer this.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainWriteResults"
        "400":
          $ref: "#/components/responses/InvalidOrRejected"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/TargetUnavailable"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "502":
          $ref: "#/components/responses/TargetPiholeFailed"
        "503":
          $ref: "#/components/responses/SetupRequired"
    patch:
      summary: Change a list entry's groups or comment
      description: >-
        The body names the entry by domain, type and kind, which must match it exactly, and gives the fields to
        change; fields left out keep their value, and so does whether the entry is enabled. An entry that doesn't
        exist is a 404: it is never created. Answers with a result per instance (see WriteResults under the schemas).
        Audited as domain_update, with the groups before and after.
      operationId: updateDomain
      x-permission: target:domains.edit
      parameters:
        - $ref: "#/components/parameters/Members"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DomainUpdate"
      responses:
        "200":
          description: Every instance succeeded; each result has the entry as saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainWriteResults"
        "207":
          description: >-
            The instances' results differ: some succeeded and some didn't. Only a mirrored group, which has several
            members, can answer this.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainWriteResults"
        "400":
          $ref: "#/components/responses/InvalidOrRejected"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/TargetUnavailable"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "502":
          $ref: "#/components/responses/TargetPiholeFailed"
        "503":
          $ref: "#/components/responses/SetupRequired"
    delete:
      summary: Delete a list entry
      description: >-
        The body names the entry by domain, type and kind, which must match it exactly. An entry that doesn't exist
        is a 404. Answers with a result per instance (see WriteResults under the schemas). Audited as domain_delete,
        with the entry's groups and comment.
      operationId: deleteDomain
      x-permission: target:domains.edit
      parameters:
        - $ref: "#/components/parameters/Members"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DomainKey"
      responses:
        "200":
          description: Deleted on every instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResults"
        "207":
          description: >-
            The instances' results differ: some succeeded and some didn't. Only a mirrored group, which has several
            members, can answer this.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResults"
        "400":
          $ref: "#/components/responses/InvalidOrRejected"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/TargetUnavailable"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "502":
          $ref: "#/components/responses/TargetPiholeFailed"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/targets/{target}/clients:
    parameters:
      - $ref: "#/components/parameters/TargetID"
    get:
      summary: The configured clients
      description: Every client, unpaged, since Pi-hole returns the list whole.
      operationId: listClients
      x-permission: target:clients.view
      responses:
        "200":
          description: The clients.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientList"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/TargetUnavailable"
        "502":
          $ref: "#/components/responses/TargetPiholeFailed"
        "503":
          $ref: "#/components/responses/SetupRequired"
    patch:
      summary: Change a client's groups or comment
      description: >-
        The body names the client by its identifier, which must match exactly, and gives the fields to change;
        fields left out keep their value. A client that doesn't exist is a 404: it is never created. Answers with a
        result per instance (see WriteResults under the schemas). Audited as client_update, with the groups before
        and after.
      operationId: updateClient
      x-permission: target:clients.edit
      parameters:
        - $ref: "#/components/parameters/Members"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientUpdate"
      responses:
        "200":
          description: Every instance succeeded; each result has the client as saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientWriteResults"
        "207":
          description: >-
            The instances' results differ: some succeeded and some didn't. Only a mirrored group, which has several
            members, can answer this.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientWriteResults"
        "400":
          $ref: "#/components/responses/InvalidOrRejected"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/TargetUnavailable"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "502":
          $ref: "#/components/responses/TargetPiholeFailed"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/targets/{target}/groups:
    parameters:
      - $ref: "#/components/parameters/TargetID"
    get:
      summary: The Pi-hole's groups
      description: >-
        Pi-hole's own groups (not instance groups), so group IDs on domains and clients can be shown by name. Needs
        any permission on the target.
      operationId: listPiholeGroups
      x-permission: target:any
      responses:
        "200":
          description: The groups.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PiholeGroupList"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/TargetUnavailable"
        "502":
          $ref: "#/components/responses/TargetPiholeFailed"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/v1/targets/{target}/queries:
    parameters:
      - $ref: "#/components/parameters/TargetID"
    get:
      summary: The newest entries of the query log
      description: >-
        Reads the newest `length` entries, newest first, then keeps those matching the filters, so a filtered result
        can hold fewer than `length` entries.
      operationId: listQueries
      x-permission: target:querylog.view
      parameters:
        - name: length
          in: query
          description: How many of the newest entries to read, 1 to 1000. Default 100.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
        - name: domain
          in: query
          description: Keep entries whose domain contains this, ignoring case.
          schema:
            type: string
            maxLength: 255
        - name: client
          in: query
          description: Keep entries whose client address or name contains this, ignoring case.
          schema:
            type: string
            maxLength: 255
      responses:
        "200":
          description: The entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryLog"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/TargetUnavailable"
        "502":
          $ref: "#/components/responses/TargetPiholeFailed"
        "503":
          $ref: "#/components/responses/SetupRequired"

components:
  parameters:
    AuditUser:
      name: user
      in: query
      required: false
      description: Only entries by this username (exact). Names are copied into each entry, so deleted users still match.
      schema:
        type: string
        maxLength: 256
    AuditAction:
      name: action
      in: query
      required: false
      description: Only entries with one of these actions. Repeat for several.
      schema:
        type: array
        maxItems: 50
        items:
          type: string
          pattern: "^[a-z][a-z_]{0,63}$"
    AuditTarget:
      name: target
      in: query
      required: false
      description: Only entries with this target (exact), such as `i-1`, `g-2`, `user:alice` or `settings:general`.
      schema:
        type: string
        maxLength: 512
    AuditInstance:
      name: instance_id
      in: query
      required: false
      description: Only entries about this Pi-hole instance.
      schema:
        type: integer
        format: int64
        minimum: 1
    AuditResult:
      name: result
      in: query
      required: false
      description: Only successes or only failures.
      schema:
        type: string
        enum: [success, failure]
    AuditFrom:
      name: from
      in: query
      required: false
      description: Only entries at or after this time.
      schema:
        type: string
        format: date-time
    AuditTo:
      name: to
      in: query
      required: false
      description: Only entries before this time. Must be after `from` when both are given.
      schema:
        type: string
        format: date-time

    ChannelID:
      name: id
      in: path
      required: true
      description: The notification channel's ID.
      schema:
        type: integer
        format: int64
        minimum: 1

    InstanceID:
      name: id
      in: path
      required: true
      description: The instance's ID.
      schema:
        type: integer
        format: int64
        minimum: 1

    GroupID:
      name: id
      in: path
      required: true
      description: The instance group's ID.
      schema:
        type: integer
        format: int64
        minimum: 1

    Members:
      name: members
      in: query
      required: false
      description: >-
        Only for a mirrored group: send the write to these members alone (instance IDs, each an enabled member of the
        group), to retry the members that failed last time. The results list only them, and the write is still made
        through the group: it is audited with the group as its target, and the group's rules apply (the primary's
        Pi-hole group IDs, and the check that the primary has the entry). A 400 for an instance target, or for an ID that
        isn't an enabled member.
      schema:
        type: array
        minItems: 1
        maxItems: 100
        items:
          type: integer
          format: int64
          minimum: 1

    RoleID:
      name: id
      in: path
      required: true
      description: The role's ID.
      schema:
        type: integer
        format: int64
        minimum: 1

    Confirm:
      name: confirm
      in: query
      required: false
      description: >-
        Go ahead with a change that answered 409 confirmation_required: one that would take away the caller's own
        roles.manage or users.manage, or disable or delete their own account.
      schema:
        type: boolean
        default: false

    UserID:
      name: id
      in: path
      required: true
      description: The user's ID.
      schema:
        type: integer
        format: int64
        minimum: 1

    MappingID:
      name: mapping_id
      in: path
      required: true
      description: The LDAP group mapping's ID.
      schema:
        type: integer
        format: int64
        minimum: 1

    TargetID:
      name: target
      in: path
      required: true
      description: >-
        `i-<instance id>` for one instance, or `g-<group id>` for a mirrored group, which reads its domains, clients
        and Pi-hole groups from its primary, reads its dashboard and query log from every enabled member, and sends
        writes to every enabled member. A target that doesn't exist, including an independent group, is a 403 like
        one the user holds nothing on; a disabled instance, or a mirrored group whose primary is disabled, is a 404.
      schema:
        type: string
        pattern: "^[ig]-[1-9][0-9]*$"
        examples: ["i-1"]

  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: pihole_rbac_session

  responses:
    Unauthenticated:
      description: No valid session (code unauthenticated).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: >-
        Not allowed (code forbidden, with `details.permission` naming the missing permission), or the CSRF or Origin
        check failed on a state-changing request (code csrf_failed).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationFailed:
      description: The request body is malformed or a field is invalid (code validation_failed).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnsupportedMediaType:
      description: The request body isn't application/json (code unsupported_media_type).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SetupRequired:
      description: First-run setup hasn't been completed yet (code setup_required).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No such resource (code not_found).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The change conflicts with existing data (code conflict); the message says how.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InstanceConflict:
      description: >-
        The change conflicts with existing data or with a change made at the same time (code conflict), or the
        connection test couldn't run: the password variable isn't set (code instance_password_missing) or the settings
        can't be used (code instance_misconfigured). `details.instance` names the instance for the last two.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InstanceGroupConflict:
      description: >-
        The change conflicts with existing data (code conflict): the name is taken, or an instance is already in
        another mirrored group (`details.field` members, `details.instance` and `details.group` name them); or a
        mirrored group would become independent while roles hold mirrored-group permissions on it (code
        invariant_violated, with `details.roles`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RoleConflict:
      description: >-
        The change conflicts with existing data, such as a name already taken (code conflict); it would break an
        invariant, such as changing the builtin admin role or deleting a role in use (code invariant_violated); or it
        would take away the caller's own roles.manage or users.manage and needs `confirm=true` (code
        confirmation_required, with `details.would_lose`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UserConflict:
      description: >-
        The change conflicts with existing data, such as a username already taken (code conflict); it would leave no
        enabled local admin (code invariant_violated); or it would disable or delete the caller's own account, or take
        away their own roles.manage or users.manage, and needs `confirm=true` (code confirmation_required, with
        `details.would_lose`: "account", or the permissions).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    LDAPFailed:
      description: >-
        The LDAP server couldn't be used (code ldap_failed): it didn't answer, refused the service account's bind, or a
        search failed. Nothing was saved. `details.detail` has the underlying error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PiholeFailed:
      description: >-
        The connection test failed (code pihole_unreachable, pihole_auth_rejected or pihole_status_error), so nothing
        was changed. `details.instance` names the instance and `details.detail` has the underlying error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidOrRejected:
      description: >-
        A field is invalid (code validation_failed), or the Pi-hole refused the request's content (code
        pihole_rejected): a duplicate entry, say, or a domain it doesn't accept. For pihole_rejected,
        `details.instance` names the instance and `details.pihole_message` has Pi-hole's reason, which is Pi-hole's
        text: show it as text. On a write, a pihole_rejected answer means no instance succeeded, and `details.results`
        has the result per instance, in the shape of the 200 response's `results`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TargetUnavailable:
      description: >-
        The instance can't be used: its password variable isn't set (code instance_password_missing) or its settings
        can't be used (code instance_misconfigured). `details.instance` names it. Through a mirrored group, also a
        member without a Pi-hole group the change uses (code pihole_group_missing). On a write, this answer means no instance
        succeeded, and `details.results` has the result per instance, in the shape of the 200 response's `results`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TargetPiholeFailed:
      description: >-
        The Pi-hole didn't respond (code pihole_unreachable), refused the app password (code pihole_auth_rejected)
        or answered unexpectedly (code pihole_status_error). `details.instance` names the instance. When it is a
        mirrored group's primary, `details.group` names the group and `details.primary` is true: reads of domains,
        clients and Pi-hole groups come from the primary alone. The underlying error goes to the server log only. On a write, this answer means no instance
        succeeded, and `details.results` has the result per instance, in the shape of the 200 response's `results`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Too many failed attempts (code rate_limited). Retry after the given number of seconds.
      headers:
        Retry-After:
          description: Seconds until another attempt is allowed.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    About:
      type: object
      additionalProperties: false
      required: [source_url, license]
      properties:
        source_url:
          type: string
          format: uri
          description: Where the source code of the running build can be obtained.
          examples: ["https://github.com/Kate-0713/pihole-rbac"]
        license:
          type: string
          description: SPDX licence identifier.
          examples: ["AGPL-3.0-or-later"]

    SetupStatus:
      type: object
      additionalProperties: false
      required: [setup_required]
      properties:
        setup_required:
          type: boolean
          description: True until the first admin has been created.

    SetupRequest:
      type: object
      additionalProperties: false
      required: [token, username, password]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 256
          description: The one-time setup token. Surrounding spaces are ignored.
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: >-
            The first admin's username: 1-64 lowercase letters, digits, '.', '_' or '-', starting with a letter or
            digit. Uppercase is folded to lowercase.
        password:
          type: string
          minLength: 12
          maxLength: 72
          description: At least 12 characters and at most 72 bytes.

    CSRFToken:
      type: object
      additionalProperties: false
      required: [csrf_token]
      properties:
        csrf_token:
          type: string
          description: Send as the X-CSRF-Token header on every state-changing request.

    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 256
          description: Case-insensitive; surrounding spaces are ignored.
        password:
          type: string
          minLength: 1
          maxLength: 1024

    SessionUser:
      type: object
      additionalProperties: false
      required: [id, username, source]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        source:
          type: string
          enum: [local, ldap]

    CurrentSession:
      type: object
      additionalProperties: false
      required: [user, public_id, expires_at, csrf_token, permissions]
      properties:
        user:
          $ref: "#/components/schemas/SessionUser"
        public_id:
          type: string
          description: Identifies this session in the sessions list and the audit log. Can't be used to authenticate.
        expires_at:
          type: string
          format: date-time
          description: When the session ends at the latest. It also ends after a period without requests.
        csrf_token:
          type: string
          description: Send as the X-CSRF-Token header on every state-changing request.
        permissions:
          $ref: "#/components/schemas/Permissions"

    Permissions:
      type: object
      additionalProperties: false
      required: [global, targets]
      description: >-
        What the user may do, worked out by the server from their roles and the current groups. The server checks
        every request again; this is for the UI.
      properties:
        global:
          type: array
          items:
            type: string
          description: The global permissions the user holds, sorted.
        targets:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: >-
            By target (`i-<instance id>` or `g-<mirrored group id>`): the permissions the user holds there, sorted.
            Lists every instance and mirrored group where the user holds at least one.
          examples:
            - { "i-1": ["domains.view"], "g-2": ["domains.view", "drift.view"] }

    SecretList:
      type: object
      additionalProperties: false
      required: [secrets]
      properties:
        secrets:
          type: array
          items:
            $ref: "#/components/schemas/SecretStatus"

    SecretStatus:
      type: object
      additionalProperties: false
      required: [name, kind, set]
      properties:
        name:
          type: string
          description: The environment variable, without a _FILE suffix.
        kind:
          type: string
          enum: [master_key, session_key, ldap_bind_password, instance_password, channel_secret]
        set:
          type: boolean
        source:
          type: string
          enum: [env, file, generated]
          description: Where the value came from. Absent when the secret isn't set. Only `file` can change on a reload.

    ReloadResult:
      type: object
      additionalProperties: false
      required: [changed, failed, session_ended]
      properties:
        changed:
          type: array
          items:
            type: string
          description: Variables whose value changed.
        failed:
          type: array
          items:
            $ref: "#/components/schemas/ReloadFailure"
        session_ended:
          type: boolean
          description: True when the session key changed, which ends every session including the caller's.

    ReloadFailure:
      type: object
      additionalProperties: false
      required: [name, message]
      properties:
        name:
          type: string
        message:
          type: string
          description: Why the secret couldn't be loaded. Never contains the value.

    TargetList:
      type: object
      additionalProperties: false
      required: [targets]
      properties:
        targets:
          type: array
          items:
            $ref: "#/components/schemas/Target"

    Target:
      type: object
      additionalProperties: false
      required: [id, kind, name]
      properties:
        id:
          type: string
          description: The target as used in URLs and the session's permissions, `i-<instance id>` or `g-<group id>`.
          examples: ["i-1"]
        kind:
          type: string
          enum: [instance, group]
        name:
          type: string
        health:
          $ref: "#/components/schemas/TargetHealth"
        members:
          type: array
          description: >-
            For a mirrored group: its enabled members, the primary first, then by name. Absent for an instance.
          items:
            $ref: "#/components/schemas/TargetMember"
        mirrored_group:
          $ref: "#/components/schemas/MirroredGroupRef"
        drifted:
          type: boolean
          description: >-
            For a mirrored group: whether its members differed from the primary at the last drift check. Absent until
            a check has compared them (see GET /instance-groups/{id}/drift).

    TargetHealth:
      type: object
      additionalProperties: false
      required: [state]
      description: >-
        An instance's health (see InstanceHealth), or a mirrored group's overall state, worked out from its enabled
        members: up when all are up, down when all are down, unknown when none has been checked yet, and degraded
        otherwise. A group's health has no times or error; its members carry their own.
      properties:
        state:
          type: string
          enum: [unknown, up, down, degraded]
        last_success:
          type: string
          format: date-time
        last_failure:
          type: string
          format: date-time
        last_error:
          type: string

    TargetMember:
      type: object
      additionalProperties: false
      required: [instance_id, name, primary, health]
      properties:
        instance_id:
          type: integer
          format: int64
        name:
          type: string
        primary:
          type: boolean
        health:
          $ref: "#/components/schemas/InstanceHealth"

    MirroredGroupRef:
      type: object
      additionalProperties: false
      required: [id, name]
      description: >-
        The mirrored group an instance belongs to. Editing the instance on its own makes it differ from the group;
        such edits are allowed to anyone whose grants cover the instance, and are flagged in the audit log.
      properties:
        id:
          type: string
          description: The group's target, `g-<group id>`.
          examples: ["g-1"]
        name:
          type: string

    MemberRead:
      type: object
      additionalProperties: false
      required: [instance, instance_id, primary, status]
      description: How one member of a mirrored group answered a read made through the group.
      properties:
        instance:
          type: string
        instance_id:
          type: integer
          format: int64
        primary:
          type: boolean
        status:
          $ref: "#/components/schemas/WriteStatus"
        error:
          $ref: "#/components/schemas/WriteError"
        blocking:
          $ref: "#/components/schemas/BlockingStatus"

    InstanceInput:
      type: object
      additionalProperties: false
      required: [name, base_url]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: Unique, ignoring case. Surrounding spaces are ignored.
        base_url:
          type: string
          maxLength: 2048
          description: >-
            http:// or https:// with a host and optional port; no username, password, query or fragment. A path prefix
            is allowed, but not one ending in /admin or /api. Stored without a trailing slash.
          examples: ["https://pihole1.lan"]
        env_name:
          type: string
          maxLength: 64
          pattern: "^[A-Z0-9_]*$"
          description: >-
            Optional. Names a variable, PIHOLE_RBAC_INSTANCE_<env_name>_PASSWORD, whose password overrides the stored
            one when it is set. Unique. Empty or absent means none.
          examples: ["PIHOLE1"]
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 1024
          description: >-
            The Pi-hole app password, used exactly as given. Stored encrypted (it needs the master key), or, when the
            instance's variable is set, checked against it. Required to confirm a new address or a newly used
            variable. Never returned.
        tls_mode:
          type: string
          enum: [verify, insecure]
          description: How the Pi-hole's certificate is checked. verify if absent; insecure is for labs only.
        ca_file:
          type: string
          maxLength: 4096
          description: >-
            Absolute path, on the server, of an extra CA bundle (PEM) to trust. Only with tls_mode verify and an
            https:// base URL. Checked when saved.

    Instance:
      type: object
      additionalProperties: false
      required: [id, name, base_url, tls_mode, enabled, created_at, password_source, password_set]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        base_url:
          type: string
        env_name:
          type: string
          description: Absent when the instance has none.
        tls_mode:
          type: string
          enum: [verify, insecure]
        ca_file:
          type: string
          description: Absent when no CA file is set.
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        password_variable:
          type: string
          description: >-
            The variable whose password overrides the stored one (or its _FILE form). Absent when the instance has no
            env name.
          examples: ["PIHOLE_RBAC_INSTANCE_PIHOLE1_PASSWORD"]
        password_source:
          type: string
          enum: [environment, stored, none]
          description: >-
            Where the password comes from: the variable (set when the server started or last reloaded its secrets),
            the database, or nowhere yet.
        password_set:
          type: boolean
          description: Whether the instance has a password, from either source.
        password_updated_at:
          type: string
          format: date-time
          description: When the stored password was last set. Absent when none is stored.
        password_updated_by:
          type: string
          description: Who last set the stored password. Absent when none is stored.
        health:
          $ref: "#/components/schemas/InstanceHealth"

    InstanceList:
      type: object
      additionalProperties: false
      required: [instances, can_store_passwords]
      properties:
        can_store_passwords:
          type: boolean
          description: Whether a master key is set, without which passwords can't be stored.
        instances:
          type: array
          items:
            $ref: "#/components/schemas/Instance"

    InstancePassword:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 1024
          description: The new Pi-hole app password, used exactly as given.

    InstanceHealth:
      type: object
      additionalProperties: false
      required: [state]
      description: Present only for enabled instances.
      properties:
        state:
          type: string
          enum: [unknown, up, down]
          description: >-
            unknown until the first call; up when Pi-hole last answered with the password accepted; down when it was
            unreachable or refused the password, or the password or settings can't be used.
        last_success:
          type: string
          format: date-time
        last_failure:
          type: string
          format: date-time
        last_error:
          type: string
          description: The error code of the last failure, kept after a later success.

    InstanceTestResult:
      type: object
      additionalProperties: false
      required: [ok]
      properties:
        ok:
          type: boolean
        error:
          $ref: "#/components/schemas/InstanceTestError"

    InstanceTestError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum: [pihole_unreachable, pihole_auth_rejected, pihole_status_error, instance_password_missing, instance_misconfigured]
        message:
          type: string
          description: What went wrong, for the admin.
        detail:
          type: string
          description: The underlying error, such as a TLS or connection error. Never contains the password.

    InstanceGroupInput:
      type: object
      additionalProperties: false
      required: [name, mode, members]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: Unique, ignoring case.
        mode:
          type: string
          enum: [independent, mirrored]
        members:
          type: array
          maxItems: 100
          uniqueItems: true
          items:
            type: integer
            format: int64
            minimum: 1
          description: The member instances' IDs. A mirrored group needs at least its primary.
        primary_instance_id:
          type: integer
          format: int64
          minimum: 1
          description: >-
            Required for a mirrored group, and must be one of its members: the reference for reads and drift checks.
            Must be absent for an independent group.

    InstanceGroup:
      type: object
      additionalProperties: false
      required: [id, name, mode, members, created_at]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        mode:
          type: string
          enum: [independent, mirrored]
        primary_instance_id:
          type: integer
          format: int64
          description: The primary, for a mirrored group. Absent for an independent group.
        members:
          type: array
          description: By name.
          items:
            $ref: "#/components/schemas/InstanceGroupMember"
        created_at:
          type: string
          format: date-time

    InstanceGroupMember:
      type: object
      additionalProperties: false
      required: [id, name, enabled]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        enabled:
          type: boolean
          description: A disabled member is left out of everything done through a mirrored group.

    InstanceGroupList:
      type: object
      additionalProperties: false
      required: [groups]
      properties:
        groups:
          type: array
          items:
            $ref: "#/components/schemas/InstanceGroup"

    DriftReport:
      type: object
      additionalProperties: false
      required: [group_id, group, state, drifted, members, counts]
      properties:
        group_id:
          type: integer
          format: int64
        group:
          type: string
          description: The group's name.
        state:
          type: string
          enum: [not_checked, checked, primary_unavailable]
          description: >-
            not_checked: no check since the server started. checked: the primary answered, so the members that answered
            were compared with it. primary_unavailable: the primary didn't answer or is disabled, so nothing could be
            compared.
        checked_at:
          type: string
          format: date-time
          description: When the check ran. Absent when not_checked.
        drifted:
          type: boolean
          description: Whether any member was found to differ from the primary, in any of the three lists.
        members:
          type: array
          description: The enabled members as of the check, the primary first. Empty when not_checked.
          items:
            $ref: "#/components/schemas/MemberRead"
        counts:
          $ref: "#/components/schemas/DriftCounts"
        domains:
          type: array
          description: Absent without domains.view on the group.
          items:
            $ref: "#/components/schemas/DomainDrift"
        clients:
          type: array
          description: Absent without clients.view on the group.
          items:
            $ref: "#/components/schemas/ClientDrift"
        groups:
          type: array
          items:
            $ref: "#/components/schemas/PiholeGroupDrift"

    DriftCounts:
      type: object
      additionalProperties: false
      required: [domains, clients, groups]
      properties:
        domains:
          type: integer
        clients:
          type: integer
        groups:
          type: integer

    DriftDifference:
      type: string
      enum: [missing, extra, changed]
      description: >-
        missing: on the primary but not on this member. extra: on this member but not on the primary. changed: on
        both, with different settings.

    DomainDrift:
      type: object
      additionalProperties: false
      required: [instance, instance_id, domain, type, kind, difference]
      properties:
        instance:
          type: string
        instance_id:
          type: integer
          format: int64
        domain:
          type: string
        type:
          type: string
          enum: [allow, deny]
        kind:
          type: string
          enum: [exact, regex]
        difference:
          $ref: "#/components/schemas/DriftDifference"
        primary:
          $ref: "#/components/schemas/DriftDomainState"
        member:
          $ref: "#/components/schemas/DriftDomainState"

    DriftDomainState:
      type: object
      additionalProperties: false
      required: [comment, groups, enabled]
      description: The entry's settings on the primary or on the member; absent where the entry is missing.
      properties:
        comment:
          type: string
        groups:
          type: array
          description: The Pi-hole groups by name, sorted.
          items:
            type: string
        enabled:
          type: boolean

    ClientDrift:
      type: object
      additionalProperties: false
      required: [instance, instance_id, client, difference]
      properties:
        instance:
          type: string
        instance_id:
          type: integer
          format: int64
        client:
          type: string
        difference:
          $ref: "#/components/schemas/DriftDifference"
        primary:
          $ref: "#/components/schemas/DriftClientState"
        member:
          $ref: "#/components/schemas/DriftClientState"

    DriftClientState:
      type: object
      additionalProperties: false
      required: [comment, groups]
      properties:
        comment:
          type: string
        groups:
          type: array
          items:
            type: string

    PiholeGroupDrift:
      type: object
      additionalProperties: false
      required: [instance, instance_id, name, difference]
      properties:
        instance:
          type: string
        instance_id:
          type: integer
          format: int64
        name:
          type: string
        difference:
          $ref: "#/components/schemas/DriftDifference"
        primary:
          $ref: "#/components/schemas/DriftGroupState"
        member:
          $ref: "#/components/schemas/DriftGroupState"

    DriftGroupState:
      type: object
      additionalProperties: false
      required: [comment, enabled]
      properties:
        comment:
          type: string
        enabled:
          type: boolean

    ReconcileInput:
      type: object
      additionalProperties: false
      description: Either `all` true, or at least one item (at most 1000 in all). Each item names a member that isn't the primary.
      properties:
        all:
          type: boolean
        domains:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/ReconcileDomain"
        clients:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/ReconcileClient"
        groups:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/ReconcileGroup"

    ReconcileDomain:
      type: object
      additionalProperties: false
      required: [instance_id, domain, type, kind]
      properties:
        instance_id:
          type: integer
          format: int64
        domain:
          type: string
        type:
          type: string
          enum: [allow, deny]
        kind:
          type: string
          enum: [exact, regex]

    ReconcileClient:
      type: object
      additionalProperties: false
      required: [instance_id, client]
      properties:
        instance_id:
          type: integer
          format: int64
        client:
          type: string

    ReconcileGroup:
      type: object
      additionalProperties: false
      required: [instance_id, name]
      properties:
        instance_id:
          type: integer
          format: int64
        name:
          type: string

    ReconcileResult:
      type: object
      additionalProperties: false
      required: [results, members, report]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/ReconcileItemResult"
        members:
          type: array
          description: The members reconciled, with an error for those that couldn't be read and were left alone.
          items:
            $ref: "#/components/schemas/MemberRead"
        report:
          $ref: "#/components/schemas/DriftReport"

    ReconcileItemResult:
      type: object
      additionalProperties: false
      required: [instance, instance_id, item, action, status]
      properties:
        instance:
          type: string
        instance_id:
          type: integer
          format: int64
        item:
          type: string
          enum: [domain, client, group]
        domain:
          type: string
          description: For a domain list entry, with `type` and `kind`.
        type:
          type: string
          enum: [allow, deny]
        kind:
          type: string
          enum: [exact, regex]
        client:
          type: string
        group:
          type: string
          description: For a Pi-hole group, its name.
        action:
          type: string
          enum: [add, update, delete, none]
          description: none means the item already matched the primary, or (with an error) wasn't changed.
        status:
          type: string
          enum: [ok, failed]
        error:
          $ref: "#/components/schemas/WriteError"

    Grant:
      type: object
      additionalProperties: false
      required: [permission, scope]
      description: One permission within one scope.
      properties:
        permission:
          type: string
          description: A permission from the catalogue.
          examples: ["domains.edit"]
        scope:
          type: string
          enum: [all, group, instance]
        id:
          type: integer
          format: int64
          description: The instance or group, for scope instance or group. Absent for scope all.

    RoleInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: Unique, ignoring case. Surrounding spaces are ignored.
        description:
          type: string
          maxLength: 500

    RoleCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: Unique, ignoring case. Surrounding spaces are ignored.
        description:
          type: string
          maxLength: 500
        grants:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/Grant"

    GrantsInput:
      type: object
      additionalProperties: false
      required: [grants]
      properties:
        grants:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/Grant"

    Role:
      type: object
      additionalProperties: false
      required: [id, name, description, builtin, created_at, grants, users, ldap_groups, manageable]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        builtin:
          type: boolean
          description: The builtin admin role, which can't be changed or deleted.
        created_at:
          type: string
          format: date-time
        grants:
          type: array
          description: Sorted by permission, then scope.
          items:
            $ref: "#/components/schemas/Grant"
        users:
          type: array
          description: The local users who hold the role, by username.
          items:
            type: string
        ldap_groups:
          type: array
          description: The LDAP group DNs mapped to the role, as entered.
          items:
            type: string
        manageable:
          type: boolean
          description: >-
            Whether the caller holds every grant of the role, and so may give it to users, change it (unless it is
            builtin) or delete it. The server checks again on each change.

    RoleList:
      type: object
      additionalProperties: false
      required: [roles]
      properties:
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"

    RoleCatalogue:
      type: object
      additionalProperties: false
      required: [permissions, instances, groups]
      properties:
        permissions:
          type: array
          description: In the catalogue's order.
          items:
            $ref: "#/components/schemas/PermissionInfo"
        instances:
          type: array
          description: Every instance, enabled or not, sorted by name.
          items:
            $ref: "#/components/schemas/ScopeName"
        groups:
          type: array
          description: Every instance group, sorted by name.
          items:
            $ref: "#/components/schemas/GroupScopeName"

    PermissionInfo:
      type: object
      additionalProperties: false
      required: [name, class, description]
      properties:
        name:
          type: string
        class:
          type: string
          enum: [instance, group, global]
          description: >-
            instance permissions can be granted at scope all, on any group or on one instance; group permissions at
            scope all or on a mirrored group; global permissions at scope all only.
        description:
          type: string

    ScopeName:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string

    GroupScopeName:
      type: object
      additionalProperties: false
      required: [id, name, mode]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        mode:
          type: string
          enum: [independent, mirrored]

    PasswordChange:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          minLength: 1
          maxLength: 1024
        new_password:
          type: string
          minLength: 1
          maxLength: 1024
          description: At least 12 characters and at most 72 bytes, and not the current password.

    UserCreate:
      type: object
      additionalProperties: false
      required: [username, password, role_ids]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: >-
            1 to 64 lowercase letters, digits, '.', '_' or '-', starting with a letter or digit. Uppercase is folded
            and surrounding spaces are ignored. Unique across local and LDAP users.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: At least 12 characters and at most 72 bytes.
        role_ids:
          type: array
          maxItems: 1000
          description: The roles to give. A user with none can't log in.
          items:
            type: integer
            format: int64

    UserPassword:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: At least 12 characters and at most 72 bytes.

    UserRoles:
      type: object
      additionalProperties: false
      required: [role_ids]
      properties:
        role_ids:
          type: array
          maxItems: 1000
          description: Every role the user should have; an empty list takes them all away and ends the user's sessions.
          items:
            type: integer
            format: int64

    RoleRef:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string

    User:
      type: object
      additionalProperties: false
      required: [id, username, source, disabled, created_at, roles, manageable]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        source:
          type: string
          enum: [local, ldap]
        ldap_dn:
          type: string
          description: The user's DN in the directory, for LDAP users.
        disabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        last_login_at:
          type: string
          format: date-time
          description: Absent if the user has never logged in.
        roles:
          type: array
          description: >-
            Sorted by name. A local user's assigned roles; an LDAP user's are the roles their current sessions hold,
            so empty when they aren't logged in.
          items:
            $ref: "#/components/schemas/RoleRef"
        manageable:
          type: boolean
          description: >-
            Whether the caller holds every grant of every role the user has, and so may change their roles or
            password, disable, enable or delete them. The server checks again on each change.

    UserList:
      type: object
      additionalProperties: false
      required: [users]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/User"

    LoginMethods:
      type: object
      additionalProperties: false
      required: [methods]
      properties:
        methods:
          type: array
          minItems: 1
          maxItems: 2
          description: The enabled methods in the order they are tried. Must include local.
          items:
            type: string
            enum: [local, ldap]

    LDAPConnection:
      type: object
      additionalProperties: false
      required: [url, bind_dn, base_dn, user_filter, tls_mode, allow_cn_fallback]
      properties:
        url:
          type: string
          description: ldaps://host[:port], or ldap://host[:port] (passwords then cross the network unencrypted).
        bind_dn:
          type: string
          description: The read-only service account that finds users and their groups.
        base_dn:
          type: string
          description: Users and groups are searched for under this DN.
        user_filter:
          type: string
          description: Finds a user by username, with %s exactly once, e.g. (uid=%s) or (sAMAccountName=%s).
        tls_mode:
          type: string
          enum: [verify, insecure]
        allow_cn_fallback:
          type: boolean
          description: >-
            Accept a certificate whose Common Name, rather than a Subject Alternative Name, matches the host. Only
            applies with PIHOLE_RBAC_LDAP_CA_FILE.

    LDAPSettingsInput:
      type: object
      additionalProperties: false
      required: [url, bind_dn, base_dn, user_filter]
      properties:
        url:
          type: string
          maxLength: 1024
        bind_dn:
          type: string
          maxLength: 1024
        base_dn:
          type: string
          maxLength: 1024
        user_filter:
          type: string
          maxLength: 1024
        tls_mode:
          type: string
          enum: [verify, insecure]
          description: verify if absent.
        allow_cn_fallback:
          type: boolean
        bind_password:
          type: string
          minLength: 1
          maxLength: 1024
          description: >-
            Write-only. Stored encrypted, replacing the stored one, unless PIHOLE_RBAC_LDAP_BIND_PASSWORD is set, when it
            must match the variable. Required when the settings would send an existing password to a new server.

    LDAPSettingsView:
      type: object
      additionalProperties: false
      required: [enabled, bind_password, can_store_password, ca_file_set]
      properties:
        settings:
          $ref: "#/components/schemas/LDAPConnection"
        updated_at:
          type: string
          format: date-time
        updated_by:
          type: string
        enabled:
          type: boolean
          description: Whether LDAP is among the login methods.
        bind_password:
          $ref: "#/components/schemas/LDAPBindPasswordStatus"
        can_store_password:
          type: boolean
          description: Whether a master key is set, so a bind password can be stored.
        ca_file_set:
          type: boolean
          description: Whether PIHOLE_RBAC_LDAP_CA_FILE is set.

    LDAPBindPasswordStatus:
      type: object
      additionalProperties: false
      required: [source, variable]
      description: Where the bind password comes from. Never the password.
      properties:
        source:
          type: string
          enum: [environment, stored, none]
        variable:
          type: string
          description: The environment variable that overrides a stored password.
        updated_at:
          type: string
          format: date-time
          description: When the stored password was last set.
        updated_by:
          type: string

    LDAPUserTestInput:
      type: object
      additionalProperties: false
      required: [username]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 256

    LDAPUserTest:
      type: object
      additionalProperties: false
      required: [username, found, groups, local_account, mappings, roles, permissions]
      properties:
        username:
          type: string
        found:
          type: boolean
          description: Whether the directory has exactly one entry for the username.
        dn:
          type: string
        groups:
          type: array
          description: The group DNs the directory lists the user in, as it returned them.
          items:
            type: string
        local_account:
          type: boolean
          description: The username belongs to a local account, so an LDAP login with it is refused.
        mappings:
          type: array
          description: The mappings that match one of the user's groups.
          items:
            $ref: "#/components/schemas/LDAPMatchedMapping"
        roles:
          type: array
          description: The roles the user would get, sorted by name. None means they would be refused.
          items:
            $ref: "#/components/schemas/RoleRef"
        permissions:
          $ref: "#/components/schemas/TestedPermissions"

    LDAPMatchedMapping:
      type: object
      additionalProperties: false
      required: [group_dn, role]
      properties:
        group_dn:
          type: string
          description: The mapping's group DN, as entered.
        role:
          $ref: "#/components/schemas/RoleRef"

    TestedPermissions:
      type: object
      additionalProperties: false
      required: [global, targets]
      properties:
        global:
          type: array
          items:
            type: string
        targets:
          type: array
          description: Each instance and mirrored group where the roles give at least one permission, by name.
          items:
            $ref: "#/components/schemas/TargetPermissions"

    TargetPermissions:
      type: object
      additionalProperties: false
      required: [target, name, permissions]
      properties:
        target:
          type: string
          examples: ["i-1"]
        name:
          type: string
        permissions:
          type: array
          items:
            type: string

    LDAPGroupInput:
      type: object
      additionalProperties: false
      required: [group_dn]
      properties:
