# Keeps the runtime base image in deploy/docker/Dockerfile current (and its digest, once one is pinned). The node and
# golang build stages take their versions from ARGs, which Dependabot leaves alone: Go follows go.mod and Node
# follows CI.
version: 2
updates:
  - package-ecosystem: docker
    directory: /deploy/docker
    schedule:
      interval: weekly
