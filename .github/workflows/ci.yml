name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # The release workflow runs all of CI first and releases only if it passes.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows keeps the local dev loop honest; releases are Linux-only.
        os: [ubuntu-26.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Check generated sqlc code is up to date
        run: go tool "-modfile=tools/go.mod" sqlc diff

      - name: Install web dependencies
        run: npm --prefix web ci

      - name: Check generated API code is up to date
        shell: bash
        run: |
          go tool "-modfile=tools/go.mod" oapi-codegen -config api/oapi-codegen.yaml api/openapi.yaml
          npm --prefix web run --silent generate
          git diff --exit-code -- internal/api/gen web/src/lib/api/schema.d.ts

      - name: Type-check web
        run: npm --prefix web run check

      - name: Unit-test web
        run: npm --prefix web test

      - name: Build web
        run: npm --prefix web run build

      - name: gofmt
        if: runner.os == 'Linux'
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt (gofmt -w):" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: Build binary and check the frontend is embedded
        shell: bash
        run: |
          go build -trimpath -o bin/pihole-rbac${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/pihole-rbac
          out="$(./bin/pihole-rbac version)"
          echo "$out"
          grep -qx 'frontend: embedded' <<< "$out"

      # The browser tests run on Linux only: they check the app, not the developer loop, and Playwright's Chromium
      # with its system packages installs most simply there.
      - name: Install Playwright's Chromium
        if: runner.os == 'Linux'
        run: npm --prefix web exec -- playwright install --with-deps chromium

      - name: Browser tests
        if: runner.os == 'Linux'
        run: npm --prefix web run e2e

      - name: Keep the browser test report
        if: runner.os == 'Linux' && failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  # The race detector, which needs cgo (so a C compiler) where the rest of the build has it off.
  race:
    name: race detector
    runs-on: ubuntu-26.04
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - name: go test -race
        run: go test -race ./...

  # govulncheck and npm audit. A separate workflow so it can also run weekly, and so the release workflow, which runs
  # all of this one first, is held back by a known vulnerability too.
  vulncheck:
    name: vulnerability check
    uses: ./.github/workflows/vulncheck.yml

  # The image for both architectures, built on every push but never pushed (the release workflow publishes it). The
  # amd64 image is smoke-tested; the arm64 one only has to build, since its final stage runs nothing.
  docker:
    name: docker image
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Build the amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: pihole-rbac:ci
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        run: bash deploy/docker/smoke-test.sh pihole-rbac:ci

      - name: Build the arm64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/arm64
          push: false
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
          cache-from: type=gha

  # The LXC install script, run for real on the runner (a VM with systemd, Ubuntu 26.04 being a supported system)
  # against a binary built from this commit: install, a second run, a crash, uninstall, reinstall and purge.
  install:
    name: lxc install
    runs-on: ubuntu-26.04
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: ShellCheck
        run: shellcheck deploy/lxc/install.sh deploy/lxc/test-install.sh deploy/lxc/test-update.sh deploy/docker/smoke-test.sh

      - name: Build the binary
        run: |
          npm --prefix web ci
          npm --prefix web run build
          go build -trimpath -o bin/pihole-rbac ./cmd/pihole-rbac

      - name: Install, check, uninstall and purge
        run: sudo bash deploy/lxc/test-install.sh bin/pihole-rbac

      # Two binaries built with -tags updatertest, so the updater takes releases from the test's local server, signed
      # with a throwaway key. Release builds never have the tag (GoReleaser refuses a binary that reports it).
      - name: Build the update test binaries
        run: |
          pkg=github.com/Kate-0713/pihole-rbac/internal/buildinfo
          for v in 2.0.0 2.0.1; do
            go build -tags updatertest -trimpath -ldflags "-X $pkg.Version=$v" -o "bin/test-$v" ./cmd/pihole-rbac
          done

      - name: Update, refuse a downgrade, roll back a broken update
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends minisign
          sudo bash deploy/lxc/test-update.sh bin/test-2.0.0 bin/test-2.0.1

  # Log forwarding against a real rsyslog: that it parses the RFC 5424 messages and the octet-counted framing over TCP
  # and TLS, and the datagrams over UDP, which the fake collector in the unit tests can't show. rsyslogd is copied out of
  # /usr/sbin so the distribution's AppArmor profile, which stops it reading the test's files, doesn't apply to it.
  rsyslog:
    name: rsyslog
    runs-on: ubuntu-26.04
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - name: Install rsyslog with its TLS module
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends rsyslog rsyslog-gnutls
          sudo systemctl stop rsyslog || true
          cp /usr/sbin/rsyslogd "$RUNNER_TEMP/rsyslogd"
          "$RUNNER_TEMP/rsyslogd" -v | head -1

      - name: Forward to rsyslog over TCP, TLS and UDP
        env:
          PIHOLE_RBAC_TEST_RSYSLOG: "1"
        run: |
          export PIHOLE_RBAC_RSYSLOGD="$RUNNER_TEMP/rsyslogd"
          go test -count=1 -v -run Rsyslog ./internal/syslogfwd/

  prometheus:
    name: prometheus
    runs-on: ubuntu-26.04
    env:
      CGO_ENABLED: "0"
      PROMETHEUS_VERSION: "3.5.0"
      PROMETHEUS_SHA256: e811827af26d822afb09a4f28314f61b618b12cff5369835a67f674d8b46f39a
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - name: Install Prometheus (pinned, checksum verified)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/prometheus.tar.gz" \
            "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          echo "${PROMETHEUS_SHA256}  $RUNNER_TEMP/prometheus.tar.gz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/prometheus"
          tar -xzf "$RUNNER_TEMP/prometheus.tar.gz" -C "$RUNNER_TEMP/prometheus" --strip-components=1

      # Without the frontend: /metrics doesn't need it, and the app serves a placeholder page instead.
      - name: Build the binary
        run: go build -trimpath -o bin/pihole-rbac ./cmd/pihole-rbac

      - name: Check the Prometheus examples and the /metrics output
        run: bash deploy/prometheus/check.sh bin/pihole-rbac "$RUNNER_TEMP/prometheus"

  snapshot:
    name: goreleaser snapshot
    runs-on: ubuntu-26.04
    needs: test
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          # Signing needs the release key, which only the release workflow has.
          args: release --snapshot --clean --skip=sign
