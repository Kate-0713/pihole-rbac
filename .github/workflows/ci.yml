name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # The release workflow runs all of CI first and releases only if it passes.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows keeps the local dev loop honest; releases are Linux-only.
        os: [ubuntu-26.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Check generated sqlc code is up to date
        run: go tool "-modfile=tools/go.mod" sqlc diff

      - name: Install web dependencies
        run: npm --prefix web ci

      - name: Check generated API code is up to date
        shell: bash
        run: |
          go tool "-modfile=tools/go.mod" oapi-codegen -config api/oapi-codegen.yaml api/openapi.yaml
          npm --prefix web run --silent generate
          git diff --exit-code -- internal/api/gen web/src/lib/api/schema.d.ts

      - name: Type-check web
        run: npm --prefix web run check

      - name: Unit-test web
        run: npm --prefix web test

      - name: Build web
        run: npm --prefix web run build

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: Build binary and check the frontend is embedded
        shell: bash
        run: |
          go build -trimpath -o bin/pihole-rbac${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/pihole-rbac
          out="$(./bin/pihole-rbac version)"
          echo "$out"
          grep -qx 'frontend: embedded' <<< "$out"

      # The browser tests run on Linux only: they check the app, not the developer loop, and Playwright's Chromium
      # with its system packages installs most simply there.
      - name: Install Playwright's Chromium
        if: runner.os == 'Linux'
        run: npm --prefix web exec -- playwright install --with-deps chromium

      - name: Browser tests
        if: runner.os == 'Linux'
        run: npm --prefix web run e2e

      - name: Keep the browser test report
        if: runner.os == 'Linux' && failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  # The image for both architectures, built on every push but never pushed (the release workflow publishes it). The
  # amd64 image is smoke-tested; the arm64 one only has to build, since its final stage runs nothing.
  docker:
    name: docker image
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build the amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: pihole-rbac:ci
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        run: bash deploy/docker/smoke-test.sh pihole-rbac:ci

      - name: Build the arm64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/arm64
          push: false
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
          cache-from: type=gha

  # The LXC install script, run for real on the runner (a VM with systemd, Ubuntu 26.04 being a supported system)
  # against a binary built from this commit: install, a second run, a crash, uninstall, reinstall and purge.
  install:
    name: lxc install
    runs-on: ubuntu-26.04
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: ShellCheck
        run: shellcheck deploy/lxc/install.sh deploy/lxc/test-install.sh deploy/docker/smoke-test.sh

      - name: Build the binary
        run: |
          npm --prefix web ci
          npm --prefix web run build
          go build -trimpath -o bin/pihole-rbac ./cmd/pihole-rbac

      - name: Install, check, uninstall and purge
        run: sudo bash deploy/lxc/test-install.sh bin/pihole-rbac

  snapshot:
    name: goreleaser snapshot
    runs-on: ubuntu-26.04
    needs: test
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          # Signing needs the release key, which only the release workflow has.
          args: release --snapshot --clean --skip=sign
