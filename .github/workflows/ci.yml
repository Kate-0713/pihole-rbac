name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows keeps the local dev loop honest; releases are Linux-only.
        os: [ubuntu-26.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm --prefix web ci

      - name: Type-check web
        run: npm --prefix web run check

      - name: Build web
        run: npm --prefix web run build

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: Build binary and check the frontend is embedded
        shell: bash
        run: |
          go build -trimpath -o bin/pihole-rbac${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/pihole-rbac
          out="$(./bin/pihole-rbac version)"
          echo "$out"
          grep -qx 'frontend: embedded' <<< "$out"

  snapshot:
    name: goreleaser snapshot
    runs-on: ubuntu-26.04
    needs: test
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean
