name: Feature request
description: Suggest a change or a new capability
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. This is a solo-maintained project, so requests are weighed against the time they
        would take. A change to the data model, the API contract or a security rule needs agreement before any code
        is written, which is what this issue is for.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that you can't do now, or can only do awkwardly?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How might it work? Which roles or permissions would it involve?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I'd be willing to work on this myself
